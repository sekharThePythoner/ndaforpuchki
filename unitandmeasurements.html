3(\\Delta R/R)$. First, find the percentage error in $R$: $(0.05 / 5.00) \\times 100\\% = 1\\%$. Thus, the percentage error in volume is $3 \\times 1\\% = 3\\%$. This is a standard high-probability conceptual numerical [190]."}, {"q": "Using the same sphere with radius $R = (5.00 \\pm 0.05)\\text{ cm}$, what is the maximum percentage error in the calculated surface area of the sphere?", "options": ["$1\\%$", "$2\\%$", "$3\\%$", "$4\\%$"], "answer": 1, "explanation": "The surface area of a sphere is $A = 4\\pi R^2$. Since $4\\pi$ is a constant, the relative error depends on the radius: $\\Delta A/A = 2(\\Delta R/R)$. The percentage error in $R$ is $(0.05 / 5.00) \\times 100\\% = 1\\%$. Therefore, the percentage error in surface area is $2 \\times 1\\% = 2\\%$ [190]."}, {"q": "A physical quantity $X$ is calculated as $X = A^2 / B$. If the percentage errors in $A$ and $B$ are $3\\%$ and $4\\%$, what is the maximum possible percentage error in the value of $X$?", "options": ["$2\\%$", "$10\\%$", "$7\\%$", "$1\\%$"], "answer": 1, "explanation": "For $X = A^2 B^{-1}$, the fractional error relation is: $\\Delta X/X = 2(\\Delta A/a) + \\Delta B/B$. Even though $B$ is in the denominator, its error adds up to yield the maximum potential uncertainty. Substituting the values: $\\%\\text{ error in } X = 2(3\\%) + 4\\% = 6\\% + 4\\% = 10\\%$ [175]."}, {"q": "Which of the following experimental scenarios represents a measurement with high precision but low accuracy?", "options": ["A laboratory scale consistently measures a standard $1.000\\text{ kg}$ weight as $1.001\\text{ kg}, 0.999\\text{ kg}, 1.000\\text{ kg}$.", "A laboratory scale consistently measures a standard $1.000\\text{ kg}$ weight as $1.254\\text{ kg}, 1.255\\text{ kg}, 1.254\\text{ kg}$.", "A laboratory scale consistently measures a standard $1.000\\text{ kg}$ weight as $0.85\\text{ kg}, 1.15\\text{ kg}, 1.00\\text{ kg}$.", "A laboratory scale consistently measures a standard $1.000\\text{ kg}$ weight as $0.50\\text{ kg}, 1.50\\text{ kg}, 2.00\\text{ kg}$."], "answer": 1, "explanation": "Accuracy refers to how close a measurement is to the true value, whereas precision refers to the degree of agreement or resolution among multiple repeated measurements. In Option B, the measurements ($1.254, 1.255, 1.254\\text{ kg}$) are extremely close to each other, indicating high precision (small random variation). However, they are far from the true value of $1.000\\text{ kg}$, indicating low accuracy (large systematic error) [163-164]."}, {"q": "The resistivity of a wire is calculated using the formula $\\rho = R \\pi r^2 / l$. If the percentage errors in measuring the resistance $R$, radius $r$, and length $l$ are $1\\%, 1.5\\%,$ and $1\\%$ respectively, what is the maximum percentage error in the calculated resistivity?", "options": ["$3.5\\%$", "$5.0\\%$", "$4.0\\%$", "$6.0\\%$"], "answer": 1, "explanation": "The formula is $\\rho = R \\pi r^2 l^{-1}$. Since $\\pi$ is a constant, the relative error is: $\\Delta \\rho / \\rho = \\Delta R / R + 2(\\Delta r / r) + \\Delta l / l$. Substituting the given percentage errors: $\\%\\text{ error in } \\rho = 1\\% + 2(1.5\\%) + 1\\% = 1\\% + 3\\% + 1\\% = 5\\%$. Thus, the maximum percentage error is $5\\%$ [175]."}, {"q": "To measure the average density of a liquid, a student measures its mass as $M = (50.0 \\pm 0.5)\\text{ g}$ and its volume as $V = (25.0 \\pm 0.5)\\text{ mL}$. What is the percentage error in the calculated density?", "options": ["$1\\%$", "$2\\%$", "$3\\%$", "$4\\%$"], "answer": 2, "explanation": "Density is $\\rho = M/V$. The maximum relative error is $\\Delta \\rho / \\rho = \\Delta M / M + \\Delta V / V$. Calculating the individual percentage errors: $\\%\\text{ error in } M = (0.5 / 50.0) \\times 100\\% = 1\\%$. $\\%\\text{ error in } V = (0.5 / 25.0) \\times 100\\% = 2\\%$. Total percentage error in density = $1\\% + 2\\% = 3\\%$ [175]."}, {"q": "The length, breadth, and thickness of a rectangular metal block are measured as $L = (10.00 \\pm 0.01)\\text{ cm}$, $B = (5.00 \\pm 0.01)\\text{ cm}$, and $T = (2.00 \\pm 0.01)\\text{ cm}$. Which of these measurements contributes the most to the total percentage error in the calculated volume ($V = LBT$)?", "options": ["Length ($L$)", "Breadth ($B$)", "Thickness ($T$)", "All contribute equally because their absolute errors are identical."], "answer": 2, "explanation": "The volume is $V = LBT$. The total relative error is $\\Delta V/V = \\Delta L/L + \\Delta B/B + \\Delta T/T$. Although the absolute errors are identical ($\\Delta L = \\Delta B = \\Delta T = 0.01\\text{ cm}$), their relative contributions depend on their measured values: $\\%\\text{ error in } L = (0.01 / 10.00) \\times 100\\% = 0.1\\%$. $\\%\\text{ error in } B = (0.01 / 5.00) \\times 100\\% = 0.2\\%$. $\\%\\text{ error in } T = (0.01 / 2.00) \\times 100\\% = 0.5\\%$. Since $T$ is the smallest dimension, its relative error is the largest ($0.5\\%$) and contributes the most to the overall uncertainty [175, 192]."}, {"q": "A standard stopwatch has a least count of $0.1\\text{ s}$. If an observer records the time period of 20 oscillations of a pendulum to be $40.0\\text{ s}$, what is the absolute error in the calculated time period ($T$) of a single oscillation?", "options": ["$0.1\\text{ s}$", "$0.05\\text{ s}$", "$0.005\\text{ s}$", "$0.01\\text{ s}$"], "answer": 2, "explanation": "The time period of a single oscillation is $T = t/n$, where $t$ is the total recorded time and $n$ is the number of oscillations. The absolute error in the single period is $\\Delta T = \\Delta t / n$. Since the least count of the watch is the limit of absolute uncertainty in the total time, we have $\\Delta t = 0.1\\text{ s}$. Substituting this gives: $\\Delta T = 0.1\\text{ s} / 20 = 0.005\\text{ s}$. This is a classic resolution and trap question [184]."}, {"q": "Why do experimentalists prefer to measure the time for a large number of oscillations (e.g., 100 instead of 10) when calculating the time period of a simple pendulum?", "options": ["It increases the absolute error of the stopwatch.", "It reduces the relative error in the time measurement by increasing the total measured time interval against a fixed absolute stopwatch error.", "It changes the systematic error of the stopwatch into a random error.", "It mathematically alters the value of local gravitational acceleration."], "answer": 1, "explanation": "The stopwatch has a fixed absolute limit of accuracy (its least count, e.g., $\\Delta t = 0.1\\text{ s}$). If you measure 10 oscillations, the total time is short (e.g., $10\\text{ s}$), and the relative error is $0.1 / 10 = 1\\%$. If you measure 100 oscillations, the total time is much longer (e.g., $100\\text{ s}$), and the relative error is reduced to $0.1 / 100 = 0.1\\%$. Therefore, increasing the total measured time against a fixed least count dramatically increases the accuracy of the result [178, 214]."}, {"q": "If the percentage error in the measurement of mass of an object is 3\\% and in the measurement of its speed is 4\\%, what is the maximum percentage error in the estimation of its kinetic energy?", "options": ["7\\%", "11\\%", "12\\%", "10\\%"], "answer": 1, "explanation": "Kinetic energy is given by K.E. = 1/2 * m * v^2. The percentage error in K.E. is %dm/m + 2 * %dv/v. Substituting the values: 3% + 2 * (4%) = 11%. Hence, the correct answer is B [178]."}, {"q": "If the percentage error in the measurement of mass of an object is 1\\% and in the measurement of its speed is 5\\%, what is the maximum percentage error in the estimation of its kinetic energy?", "options": ["6\\%", "11\\%", "12\\%", "7\\%"], "answer": 1, "explanation": "Kinetic energy is given by K.E. = 1/2 * m * v^2. The percentage error in K.E. is %dm/m + 2 * %dv/v. Substituting the values: 1% + 2 * (5%) = 11%. Hence, the correct answer is B [178]."}, {"q": "If the percentage error in the measurement of mass of an object is 2\\% and in the measurement of its speed is 2\\%, - Q100)"}, {"q": "A student takes five successive measurements for the period of oscillation of a simple pendulum: 2.63 s, 2.56 s, 2.42 s, 2.71 s, and 2.80 s. What is the 'true value' of the period of oscillation based on this data?", "options": ["2.63 s, because it is the median value.", "2.62 s, representing the arithmetic mean of all measurements.", "2.42 s, because we must minimize the lower bound.", "2.80 s, because errors are always additive."], "answer": 1, "explanation": "By standard error analysis convention, when the true value of a physical quantity is not known, we take the arithmetic mean of a large set of measurements as the best representative value: Mean = (2.63 + 2.56 + 2.42 + 2.71 + 2.80) / 5 = 13.12 / 5 = 2.624 s. Rounded off to the same decimal places of measurement, it is 2.62 s. Exam Alignment: Matches the exact numerical steps of NCERT Section 2.6.1 [137]."}, {"q": "The absolute error in an individual measurement is defined as the magnitude of the difference between which two quantities?", "options": ["The maximum and minimum measured values.", "The true value (or arithmetic mean) of the quantity and the individual measured value.", "The measured value and the least count of the instrument.", "The sum of all measurements and the total number of trials."], "answer": 1, "explanation": "By definition, the absolute error in an individual measurement is the magnitude of the difference between the true value (usually represented by the arithmetic mean) of the physical quantity and the individual measured value. It is always taken as a positive quantity: delta_a_i = |a_mean - a_i|. Exam Alignment: Grounded in standard NCERT Section 2.6.1 [137]."}, {"q": "Two physical quantities A and B are measured as A = 20.0 ± 0.2 cm and B = 15.0 ± 0.1 cm. If a new quantity Z is defined as Z = A + B, what is the value of Z with its absolute error?", "options": ["35.0 ± 0.3 cm", "35.0 ± 0.1 cm", "35.0 ± 0.2 cm", "35.0 ± 0.15 cm"], "answer": 0, "explanation": "When two quantities are added, the absolute error in the final result is the sum of the individual absolute errors: delta_Z = delta_A + delta_B. Here: Z = 20.0 + 15.0 = 35.0 cm. delta_Z = 0.2 + 0.1 = 0.3 cm. Thus, Z = 35.0 ± 0.3 cm. Exam Alignment: Grounded in NCERT error combination rules [137]."}, {"q": "The temperatures of two bodies measured by a laboratory thermometer are t■ = 20°C ± 0.5°C and t■ = 50°C ± 0.5°C. What is the temperature difference and the absolute error therein?", "options": ["30°C ± 0.0°C", "30°C ± 0.5°C", "30°C ± 1.0°C", "70°C ± 1.0°C"], "answer": 2, "explanation": "When two quantities are subtracted (t' = t■ - t■), the absolute errors STILL add up to maximize the uncertainty limit: delta_t' = delta_t■ + delta_t■. Here: t' = 50°C - 20°C = 30°C. delta_t' = 0.5°C + 0.5°C = 1.0°C. Thus, t' = 30°C ± 1.0°C. Exam Alignment: Directly based on NCERT Example 2.8 [138] and error propagation rules tested in NDA 2025-I."}, {"q": "A rectangular plate is measured to have length L = 5.0 ± 0.1 cm and width W = 2.0 ± 0.1 cm. If the area is calculated as A = L * W, what is the maximum percentage error in the calculated area?", "options": ["2.0%", "5.0%", "7.0%", "10.0%"], "answer": 2, "explanation": "For a product (A = L * W), the relative errors add up: delta_A / A = delta_L / L + delta_W / W. delta_L / L = 0.1 / 5.0 = 0.02 (2% error). delta_W / W = 0.1 / 2.0 = 0.05 (5% error). Maximum Relative Error delta_A / A = 0.02 + 0.05 = 0.07. Percentage Error = 0.07 * 100% = 7.0%. Exam Alignment: Aligned with NCERT Section 2.6.2 product errors [138]."}, {"q": "The mass and volume of a uniform solid sphere are measured to be M = 4.0 ± 0.1 kg and V = 2.0 ± 0.1 m³ respectively. What is the maximum percentage error in calculating its density (rho = M/V)?", "options": ["2.5%", "5.0%", "7.5%", "10.0%"], "answer": 2, "explanation": "For a quotient (density = mass/volume), the relative/percentage errors still add up to maximize the potential error margin: delta_rho / rho = delta_M / M + delta_V / V. delta_M / M = 0.1 / 4.0 = 0.025 (2.5% error). delta_V / V = 0.1 / 2.0 = 0.05 (5% error). Relative Error in density = 0.025 + 0.05 = 0.075. Percentage Error = 7.5%. Exam Alignment: Grounded in NCERT Example 2.11 error combination rules [140]."}, {"q": "A physical quantity Z depends on a measured quantity A as Z = A^n, where n is a constant exponent. If the percentage error in measuring A is x%, what is the percentage error in the calculated value of Z?", "options": ["x% / n", "n * x%", "x^n %", "n * ln(x) %"], "answer": 1, "explanation": "When a physical quantity is raised to a power (Z = A^n), the relative error in the quantity is multiplied by the exponent: delta_Z / Z = n * (delta_A / A). Therefore, the percentage error in Z is exactly n times the percentage error in A, which is n * x%. Exam Alignment: Directly grounded in the power-law error rules of NCERT Section 2.6.2 [138]."}, {"q": "A physical quantity Z is related to four observables a, b, c, and d by the relation Z = a^4 * b^(1/3) / (c * d^(3/2)). What is the correct mathematical expression for the maximum relative error in Z?", "options": ["delta_Z / Z = 4*(delta_a/a) + (1/3)*(delta_b/b) - (delta_c/c) - (3/2)*(delta_d/d)", "delta_Z / Z = 4*(delta_a/a) + (1/3)*(delta_b/b) + (delta_c/c) + (3/2)*(delta_d/d)", "delta_Z / Z = [a^4 * b^(1/3) / (c * d^(3/2))] * (delta_a/a)", "delta_Z / Z = 4*(delta_a/a) * (1/3)*(delta_b/b) * (delta_c/c) * (3/2)*(delta_d/d)"], "answer": 1, "explanation": "To find the maximum possible relative error, all error contributions must be added, even if they appear in the denominator with a negative power. Subtracting errors would unphysically imply that some errors cancel each other out. Thus, we sum the absolute values of the contributions: delta_Z / Z = 4*(delta_a/a) + (1/3)*(delta_b/b) + (delta_c/c) + (3/2)*(delta_d/d). Exam Alignment: Directly based on NCERT Example 2.11 [140]."}, {"q": "The mass of a solid sphere is measured with a percentage error of 1.5%, and its radius is measured with a percentage error of 1.0%. What is the maximum percentage error in the calculated density of the sphere?", "options": ["2.5%", "3.5%", "4.5%", "5.5%"], "answer": 2, "explanation": "Density (rho) of a sphere = Mass / Volume = M / ((4/3)*pi*R³) = M / (C * R³). Using the error propagation rule: delta_rho / rho = delta_M / M + 3 * (delta_R / R). Percentage Error = Percentage Error in M + 3 * (Percentage Error in R) = 1.5% + 3 * (1.0%) = 1.5% + 3.0% = 4.5%. Exam Alignment: Excellent candidate for upcoming GAT papers based on standard NCERT concepts."}, {"q": "The kinetic energy K of a moving vehicle is given by K = (1/2)*m*v². If the percentage error in measuring the vehicle's mass is 2.0% and in its velocity is 3.0%, what is the maximum percentage error in the calculated kinetic energy?", "options": ["5.0%", "8.0%", "11.0%", "18.0%"], "answer": 1, "explanation": "Kinetic Energy K = (1/2)*m*v². The relative error is: delta_K / K = delta_m / m + 2 * (delta_v / v). Percentage Error = Percentage Error in m + 2 * (Percentage Error in v) = 2.0% + 2 * (3.0%) = 2.0% + 6.0% = 8.0%. Exam Alignment: Corresponds to basic energy and work relationships tested in both NDA and CDS."}, {"q": "In an experiment to determine the acceleration due to gravity g using a simple pendulum, the period of oscillation is T = 2*pi*sqrt(L/g). The measured length L is 20.0 cm known to 1 mm accuracy. The time for 100 oscillations of the pendulum is found to be 90 s using a wrist watch of 1 s resolution. What is the approximate accuracy in the determination of g?", "options": ["1.0%", "2.7%", "3.0%", "5.4%"], "answer": 1, "explanation": "We have g = 4*pi²*L / T². Relative error in g is delta_g / g = delta_L / L + 2 * (delta_T / T). Here, L = 20.0 cm = 200 mm, delta_L = 1 mm. So delta_L / L = 1 / 200 = 0.005. Time t for 100 oscillations is 90 s with 1 s resolution (delta_t = 1 s). Since T = t / n and delta_T = delta_t / n, the relative error delta_T / T = delta_t / t = 1 / 90 = 0.0111. Therefore, delta_g / g = 1 / 200 + 2 * (1 / 90) = 0.005 + 0.0222 = 0.0272. Percentage error in g = 2.72% (or approximately 2.7%). Exam Alignment: Directly reproduces the mathematical steps of NCERT Example 2.12 [140]."}, {"q": "Two resistors R■ = 100 ± 3 ohm and R■ = 200 ± 4 ohm are connected in series. What is the equivalent resistance of the combination along with its absolute error?", "options": ["300 ± 1 ohm", "300 ± 7 ohm", "300 ± 12 ohm", "300 ± 3.5 ohm"], "answer": 1, "explanation": "For a series combination, the equivalent resistance is R = R■ + R■. The absolute errors add up directly: R = 100 + 200 = 300 ohm. delta_R = delta_R■ + delta_R■ = 3 + 4 = 7 ohm. Thus, R = 300 ± 7 ohm. Exam Alignment: Directly based on NCERT Example 2.9(a) [139] and parallel series circuits in NDA 2024-II (Q63)."}, {"q": "Two resistors R■ = 10.0 ± 0.1 ohm and R■ = 15.0 ± 0.2 ohm are connected in parallel. If we use the differential error formula delta_R' / R'² = delta_R■ / R■² + delta_R■ / R■² to calculate the error in the equivalent resistance R', what is the value of delta_R'?", "options": ["0.04 ohm", "0.08 ohm", "0.12 ohm", "0.30 ohm"], "answer": 1, "explanation": "First, find R' = R■*R■ / (R■ + R■) = 10 * 15 / 25 = 150 / 25 = 6.0 ohm. The error formula is delta_R' = R'² * [delta_R■ / R■² + delta_R■ / R■²]. Substitute values: delta_R' = 6.0² * [0.1 / 10² + 0.2 / 15²] = 36 * [0.1 / 100 + 0.2 / 225] = 36 * [0.001 + 0.000889] = 36 * 0.001889 = 0.068 ohm (approximately 0.07 or 0.08 ohm depending on rounding, specifically 0.08 ohm is the closest standard option). Exam Alignment: Based on NCERT Example 2.9(b) [139]."}, {"q": "The pressure P on a surface is calculated as P = F / A, where F is the applied force and A is the surface area. If the percentage error in force is 4.0% and in area is 2.0%, what is the maximum percentage error in the calculated pressure?", "options": ["2.0%", "6.0%", "8.0%", "12.0%"], "answer": 1, "explanation": "For a division relationship (P = F / A), the maximum percentage error is the sum of the individual percentage errors: % Error in P = % Error in F + % Error in A = 4.0% + 2.0% = 6.0%. Exam Alignment: Provides direct link to GAT pressure questions tested in NDA 2025-II (Q57)."}, {"q": "Each side of a cube is measured with a percentage error of 1.5%. What are the maximum percentage errors in calculating the total surface area and the volume of the cube, respectively?", "options": ["3.0% and 4.5%", "1.5% and 3.0%", "3.0% and 3.0%", "4.5% and 6.0%"], "answer": 0, "explanation": "Surface area of a cube A = 6*s², so relative error is delta_A / A = 2 * (delta_s / s). Percentage error = 2 * (1.5%) = 3.0%. Volume of a cube V = s³, so relative error is delta_V / V = 3 * (delta_s / s). Percentage error = 3 * (1.5%) = 4.5%. Thus, surface area has 3.0% error and volume has 4.5% error. Exam Alignment: Directly linked to NCERT Example 2.13 area/volume concepts [150]."}, {"q": "A physical quantity Y is given by the relation Y = A^2 * B^(-3/2). If the percentage errors in measuring A and B are 2.0% and 4.0% respectively, what is the maximum percentage error in the calculated value of Y?", "options": ["2.0%", "4.0%", "10.0%", "12.0%"], "answer": 2, "explanation": "The maximum percentage error is found by adding the absolute value of all error contributions: % Error in Y = 2 * (% Error in A) + | -3/2 | * (% Error in B). % Error in Y = 2 * (2.0%) + 1.5 * (4.0%) = 4.0% + 6.0% = 10.0%. Exam Alignment: Conceptual trap designed to test that errors are never subtracted."}, {"q": "A student measures the resistance R of a wire using Ohm's law, R = V/I. If the measured voltage is V = 100 ± 5 V and the current is I = 10 ± 0.2 A, what is the maximum percentage error in the calculated resistance?", "options": ["2.0%", "5.0%", "7.0%", "10.0%"], "answer": 2, "explanation": "Relative error in R is: delta_R / R = delta_V / V + delta_I / I. delta_V / V = 5 / 100 = 0.05 (5% error). delta_I / I = 0.2 / 10 = 0.02 (2% error). Maximum Relative Error delta_R / R = 0.05 + 0.02 = 0.07. Percentage Error = 7.0%. Exam Alignment: Grounded in Ohm's law error propagation [138]."}, {"q": "A physical quantity P is related to four observables as P = a³ * b² / (sqrt(c) * d). The percentage errors in measuring a, b, c, and d are 1%, 3%, 4%, and 2% respectively. What is the maximum percentage error in the calculated value of P?", "options": ["13%", "10%", "7%", "15%"], "answer": 0, "explanation": "Relative error in P is: delta_P / P = 3*(delta_a / a) + 2*(delta_b / b) + 0.5*(delta_c / c) + delta_d / d. Percentage Error = 3 * (1%) + 2 * (3%) + 0.5 * (4%) + 2% = 3% + 6% + 2% + 2% = 13%. Exam Alignment: Directly based on NCERT Exercise 2.13 [168] and matches the high-weightage percentage error combinations tested in NDA 2025-I. NCERT Class 11 Physics — MCQs Practice Series Topic 2: Practical Units, Astronomical Measurements & Parallax Method (Q26 – Q50) 1. Astronomical Scales are High-Priority: Both exams consistently test practical astronomical units. For example, NDA 2025-II (Q53) directly asked for the value of 1 parsec in Astronomical Units (A.U.) (≈ 2 × 105 A.U.). 2. Light-Year Concept Traps: NDA 2021-I (Q51) and NDA 2019-I (Q98) repeatedly test the core concept that a light-year is a unit of distance, not time. 3. Parallax Method Mechanics: Questions testing the mathematical relation θ = b / D and conversion of angles from arcseconds/arcminutes into radians (Example 2.1) are high-probability focus areas for numerical setups. 4. Microscopic Length Scales: Atomic scales (Angstrom ∠ = 10-10 m) and nuclear scales (Fermi fm = 10-15 m) are tested in matching and ratio questions."}]}, {"topicNum": "6", "topicName": "Significant Figures & Rounding Off", "questions": [{"q": "How many significant figures are there in the recorded measurements: (i) $0.007\\text{ m}^2$, (ii) $2.64 \\times 10^{24}\\text{ kg}$, (iii) $0.2370\\text{ g cm}^{-3}$?", "options": ["(i) 1, (ii) 3, (iii) 4", "(i) 3, (ii) 24, (iii) 3", "(i) 1, (ii) 24, (iii) 5", "(i) 4, (ii) 3, (iii) 4"], "answer": 0, "explanation": "According to standard rules: (i) In numbers less than 1, zeros to the right of the decimal but to the left of the first non-zero digit are not significant. Thus, $0.007$ has only 1 significant figure. (ii) In scientific notation, the power of 10 is completely irrelevant for counting significant figures. Only the base number counts, so $2.64 \\times 10^{24}$ has 3 significant figures. (iii) Zeros at the end of a decimal number are significant, so $0.2370$ has 4 significant figures. This matches NCERT Exercise 2.10 precisely [180-181, 215]."}, {"q": "According to standard rounding off rules, what are the rounded values of $2.745$ and $2.735$ to three significant figures?", "options": ["$2.75$ and $2.74$", "$2.74$ and $2.74$", "$2.74$ and $2.73$", "$2.75$ and $2.73$"], "answer": 1, "explanation": "When the digit to be dropped is exactly 5, standard convention is: if the preceding digit is even, it is left unchanged; if it is odd, it is raised by 1. For $2.745$, the preceding digit (4) is even, so 5 is dropped to yield $2.74$. For $2.735$, the preceding digit (3) is odd, so it is raised by 1 to yield $2.74$. Thus, both round to $2.74$. This is a major trap designed to balance out positive and negative rounding biases across large datasets [187-188]."}, {"q": "A student adds three mass measurements: $436.32\\text{ g}, 227.2\\text{ g},$ and $0.301\\text{ g}$. According to the rules of significant figures, how should the final sum be reported?", "options": ["$663.821\\text{ g}$", "$663.82\\text{ g}$", "$663.8\\text{ g}$", "$664\\text{ g}$"], "answer": 2, "explanation": "In addition or subtraction, the final result must retain as many decimal places as there are in the number with the least decimal places. The components are: $436.32\\text{ g}$ (2 decimal places), $227.2\\text{ g}$ (1 decimal place), and $0.301\\text{ g}$ (3 decimal places). The least precise measurement has 1 decimal place. The arithmetic sum is $663.821\\text{ g}$, which rounds to 1 decimal place as $663.8\\text{ g}$. This matches the NCERT textbook standard rules [186]."}, {"q": "A block of substance has a mass of $5.74\\text{ g}$ and occupies a volume of $1.2\\text{ cm}^3$. Express its density by keeping significant figures in view.", "options": ["$4.783\\text{ g/cm}^3$", "$4.8\\text{ g/cm}^3$", "$4.78\\text{ g/cm}^3$", "$5.0\\text{ g/cm}^3$"], "answer": 1, "explanation": "In multiplication or division, the final result must retain only as many significant figures as the component with the least significant figures. The mass ($5.74\\text{ g}$) has 3 significant figures, and the volume ($1.2\\text{ cm}^3$) has 2 significant figures. The calculated density is $5.74 / 1.2 = 4.7833...\\text{ g/cm}^3$. Since the volume restricts our precision to 2 significant figures, the result must be rounded to $4.8\\text{ g/cm}^3$. This is NCERT Example 2.14 [191, 215]."}, {"q": "Each side of a uniform metal cube is measured to be $7.203\\text{ m}$. What are the total surface area and volume of the cube to appropriate significant figures?", "options": ["$311.299\\text{ m}^2$ and $373.715\\text{ m}^3$", "$311.3\\text{ m}^2$ and $373.7\\text{ m}^3$", "$311.0\\text{ m}^2$ and $373.0\\text{ m}^3$", "$311\\text{ m}^2$ and $374\\text{ m}^3$"], "answer": 1, "explanation": "The measured length $L = 7.203\\text{ m}$ has 4 significant figures. Therefore, any product of this measurement (surface area or volume) must also be reported to exactly 4 significant figures. Surface area = $6 L^2 = 6 \\times (7.203)^2 = 311.299254...\\text{ m}^2$, which rounds to 4 significant figures as $311.3\\text{ m}^2$. Volume = $L^3 = (7.203)^3 = 373.714754...\\text{ m}^3$, which rounds to 4 significant figures as $373.7\\text{ m}^3$. This matches NCERT Example 2.13 [190]."}, {"q": "What is the number of significant figures in the speed of light in vacuum ($2.99792458 \\times 10^8\\text{ m s}^{-1}$) and its standard approximate value ($3 \\times 10^8\\text{ m s}^{-1}$)?", "options": ["9 and 1 respectively", "8 and 1 respectively", "Infinite and infinite respectively", "9 and infinite respectively"], "answer": 0, "explanation": "The precise value $2.99792458$ has exactly 9 digits, all of which are measured and certain, giving 9 significant figures. The standard rounded approximation $3 \\times 10^8$ has only 1 significant figure because it represents a rough, single-digit estimation. Note that powers of 10 are completely excluded from significant figure calculations [189]."}, {"q": "A student is performing a multi-step physics calculation. What is the recommended strategy for keeping track of significant figures in intermediate steps to prevent rounding errors?", "options": ["Round off every intermediate value to 1 significant figure to simplify calculation.", "Retain one digit more than the significant digits in intermediate steps, and round off to the correct number of significant figures only at the final result.", "Round off intermediate steps using the odd-even rule at every addition.", "Retain infinite decimal places in all intermediate steps by ignoring standard rules."], "answer": 1, "explanation": "To prevent additional errors due to the accumulation of rounding bias, intermediate results in any multi-step calculation should retain at least one more significant figure than the final justified result. Rounding off strictly to the final number of significant figures at each intermediate step leads to deviations in the final decimals, as demonstrated in NCERT standard guidelines [189, 195]."}, {"q": "In the formula for the perimeter of a circle, $P = 2\\pi r$, what is the number of significant figures associated with the multiplying factor 2?", "options": ["One, because it is a single-digit integer.", "Zero, because integers carry no dimensions.", "Infinite, because it is an exact mathematical number that can be written with any number of trailing zeros (2.0, 2.00, etc.).", "Dependent on the precision of the radius ($r$)."], "answer": 2, "explanation": "Multiplying or dividing factors that are exact numbers (and not measured physical values) have an infinite number of significant figures. Thus, the factor 2 in $2\\pi r$ or $d = 2r$ is exact and does not limit the precision of the calculation; it can be treated as $2.0000...$ as required [184]."}, {"q": "The length of a table is measured to be $2.5\\text{ m}$. What is the difference between reporting it as $2.5\\text{ m}$, $2.50\\text{ m}$, or $2.500\\text{ m}$?", "options": ["There is no physical difference; all represent the exact same length.", "They indicate different levels of precision depending on the least count of the measuring instruments used ($1\\text{ dm}, 1\\text{ cm},$ and $1\\text{ mm}$ respectively).", "$2.500\\text{ m}$ is mathematically larger than $2.5\\text{ m}$.", "The number of significant figures decreases as we add trailing zeros."], "answer": 1, "explanation": "Trailing zeros in a decimal number are highly significant because they communicate the resolution of the measuring instrument. Writing $2.5\\text{ m}$ (2 sig figs) implies a least count of $0.1\\text{ m}$; writing $2.50\\text{ m}$ (3 sig figs) implies a least count of $0.01\\text{ m}$ ($1\\text{ cm}$); writing $2.500\\text{ m}$ (4 sig figs) implies a least count of $0.001\\text{ m}$ ($1\\text{ mm}$). Thus, more trailing zeros represent higher precision [183]."}, {"q": "Subtract $7.06\\text{ g}$ from $12.9\\text{ g}$. According to significant figures rules, how should the result be recorded?", "options": ["$5.84\\text{ g}$", "$5.8\\text{ g}$", "$6.0\\text{ g}$", "$5.840\\text{ g}$"], "answer": 1, "explanation": "The rule for addition/subtraction is governed by the smallest number of decimal places, not the number of significant figures. $12.9\\text{ g}$ has 1 decimal place, and $7.06\\text{ g}$ has 2 decimal places. The subtraction yields $5.84\\text{ g}$. Since we must restrict our result to 1 decimal place, we round it to $5.8\\text{ g}$ ere percentage errors are combined to find maximum uncertainty. Common traps include subtracting errors in difference calculations, failing to multiply errors of variables with exponential powers, and misapplying absolute vs. relative errors. The following 70 questions are designed to completely master every possible mathematical and conceptual combination tested in the syllabus."}]}, {"topicNum": "7", "topicName": "Dimensions & Dimensional Formulae", "questions": [{"q": "What do the \"dimensions\" of a physical quantity represent?", "options": ["The physical size of the instrument used for measurement.", "The base units themselves, independent of any mathematical exponents.", "The powers to which the fundamental base quantities must be raised to represent that quantity.", "The accuracy limit of a derived quantity in standard SI notation."], "answer": 2, "explanation": "According to the Class 11 textbook, the dimensions of a physical quantity are the powers to which the base quantities are raised to represent that quantity. They are denoted by square brackets, e.g., length [L], mass [M], time [T], etc."}, {"q": "Which of the following represents the correct standard SI symbol notation for the seven base dimensions used in dimensional formulas?", "options": ["[M], [L], [S], [A], [C], [mol], [cd]", "[M], [L], [T], [A], [K], [mol], [cd]", "[kg], [m], [s], [A], [K], [mol], [cd]", "[Mass], [Length], [Time], [Ampere], [Kelvin], [Mole], [Candela]"], "answer": 1, "explanation": "The seven fundamental dimensions of the physical world are represented as [M] for mass, [L] for length, [T] for time, [A] for electric current, [K] for thermodynamic temperature, [mol] for amount of substance, and [cd] for luminous intensity."}, {"q": "A vehicle covers a certain distance over a time interval. What is the dimensional formula for its acceleration?", "options": ["[M0 L1 T-1]", "[M0 L1 T-2]", "[M1 L1 T-2]", "[M0 L2 T-2]"], "answer": 1, "explanation": "Acceleration is defined as rate of change of velocity (velocity/time). The dimension of velocity is [L T-1], so acceleration is [L T-1] / [T] = [L T-2] or [M0 L1 T-2]."}, {"q": "Under Newton's second law of motion, force is defined as the product of mass and acceleration. What is the dimensional formula of Force?", "options": ["[M L2 T-2]", "[M L1 T-1]", "[M L T-2]", "[M L-1 T-2]"], "answer": 2, "explanation": "Force = mass × acceleration. Dimensions of mass = [M], and acceleration = [L T-2]. Multiplying them yields the dimensional formula of Force as [M L T-2]."}, {"q": "Work is defined as the product of force and the displacement in the direction of the force. What is the dimensional representation of Work?", "options": ["[M L T-2]", "[M L2 T-2]", "[M L2 T-3]", "[M L-1 T-2]"], "answer": 1, "explanation": "Work = Force × Displacement. Substituting the dimensions: [M L T-2] × [L] = [M L2 T-2]. This is identical to the dimensional formula of all forms of energy (kinetic, potential, thermal)."}, {"q": "Which of the following physical quantities is completely dimensionless, meaning its dimensional formula is [M0 L0 T0]?", "options": ["Relative Density", "Mass Density", "Velocity Gradient", "Specific Gravity Unit"], "answer": 0, "explanation": "Relative density is the ratio of the density of a substance to the density of water. Since it is a ratio of two identical physical quantities (density/density), all dimensions cancel out, leaving it completely dimensionless [M0 L0 T0]."}, {"q": "In materials science, \"Strain\" is defined as the ratio of change in dimension to the original dimension. What are the dimensions of strain?", "options": ["[M0 L1 T0]", "[M0 L0 T0]", "[M1 L-1 T-2]", "It has same dimensions as stress."], "answer": 1, "explanation": "Strain = change in length / original length (or change in volume / original volume). Because it is a ratio of two identical physical quantities with same dimensions, it is a dimensionless quantity [M0 L0 T0]."}, {"q": "What is the dimensional formula for plane angle (θ) and solid angle (Ω)?", "options": ["[M0 L1 T0] and [M0 L2 T0] respectively", "Both have dimensions of [M0 L0 T0]", "[M0 L0 T1] and 0 0 2 0 0 0 2 [M L T ] respectively", "Plane angle is [M L T ] but solid angle has dimensions [L ]"], "answer": 1, "explanation": "Plane angle is arc/radius ([L]/[L] = [L^0]), and solid angle is area/radius^2 ([L^2]/[L^2] = [L^0]). Thus, both supplementary quantities are completely dimensionless ([M^0 L^0 T^0]), even though they possess SI units (radian and steradian)."}, {"q": "The rotational inertia of a body is measured by its \"Moment of Inertia\". What is its dimensional formula?", "options": ["[M L T-2]", "[M L2 T0]", "[M L2 T-2]", "[M L-2 T0]"], "answer": 1, "explanation": "Moment of Inertia (I) = mass × distance^2 (∑ m_i r_i^2). Substituting standard dimensions: [M] × [L]^2 = [M L^2 T^0]."}, {"q": "What is the dimensional formula for the physical quantity \"Linear Momentum\" (p)?", "options": ["[M L T-2]", "[M L T-1]", "[M L2 T-1]", "[M L-1 T-1]"], "answer": 1, "explanation": "Linear Momentum (p) = mass × velocity. Substituting standard dimensions: [M] × [L T-1] = [M L T-1]."}, {"q": "The time period of a simple pendulum is the time taken to complete one full oscillation. What is its dimensional formula?", "options": ["[M0 L0 T1]", "[M0 L1 T1]", "[M0 L0 T-1]", "[M1 L0 T1]"], "answer": 0, "explanation": "Time period represents a fundamental time interval, so its dimensional formula is [M^0 L^0 T^1]. Its frequency is the reciprocal, [M^0 L^0 T^-1]."}, {"q": "Pressure is defined as thrust (force) acting perpendicularly per unit area. What is the dimensional formula of Pressure?", "options": ["[M L T-2]", "[M L-1 T-2]", "[M L-2 T-2]", "[M L2 T-2]"], "answer": 1, "explanation": "Pressure = Force / Area. Dimensional formula: [M L T-2] / [L2] = [M L-1 T-2]. This is identical to the dimensions of stress and modulus of elasticity."}, {"q": "What is the dimensional formula of Area and Volume respectively?", "options": ["[L1] and [L2]", "[M0 L2 T0] and [M0 L3 T0]", "[L2 T0] and [L3 T1]", "Both are fundamental dimensionless parameters."], "answer": 1, "explanation": "Area is length × breadth ([L^2]), and Volume is length × breadth × height ([L^3]). Their respective dimensional formulas are [M^0 L^2 T^0] and [M^0 L^3 T^0]."}, {"q": "The mass density of a uniform solid is its mass per unit volume. What is its dimensional formula?", "options": ["[M L-3 T0]", "[M L3 T0]", "[M1 L-2 T0]", "[M L T-3]"], "answer": 0, "explanation": "Mass Density = Mass / Volume. Standard dimensions: [M] / [L3] = [M L-3 T0]."}, {"q": "Power is defined as the rate at which work is done. What is its dimensional formula?", "options": ["[M L2 T-2]", "[M L2 T-3]", "[M L T-3]", "[M L3 T-2]"], "answer": 1, "explanation": "Power = Work / Time. Dimensional formula of Work = [M L2 T-2]. Dividing by Time [T] yields [M L2 T-3]."}, {"q": "What is the dimensional formula of the Universal Gravitational Constant (G)?", "options": ["[M L3 T-2]", "[M-1 L3 T-2]", "[M-1 L2 T-2]", "[M L2 T-2]"], "answer": 1, "explanation": "From Newton's Law of Gravitation, F = G m_1 m_2 / r^2. Therefore, G = F r^2 / (m_1 m_2). Substituting dimensions: G = [M L T-2] [L2] / [M2] = [M-1 L3 T-2]."}, {"q": "Planck's constant (h) is a fundamental constant in quantum mechanics. What other physical quantity shares identical dimensions with Planck's constant?", "options": ["Linear Momentum", "Angular Momentum", "Torque", "Power"], "answer": 1, "explanation": "From photon energy formula, E = h f ⇒ h = E / f. Dimension of h = [M L2 T-2] / [T-1] = [M L2 T-1]. Angular Momentum L = m v r = [M] [L T-1] [L] = [M L2 T-1]. Both share the exact same dimensions."}, {"q": "A high-velocity projectile hits a target. The ratio of \"Thrust\" acting on the target to the \"Impulse\" imparted has the same units and dimensions as which of the following?", "options": ["Speed", "Frequency", "Acceleration", "Time constant"], "answer": 1, "explanation": "Thrust is a force, so [Thrust] = [M L T-2]. Impulse is force × time, so [Impulse] = [M L T-1]. The ratio of Thrust to Impulse is [M L T-2] / [M L T-1] = [T-1], which is the dimension of frequency (or reciprocal of time)."}, {"q": "A sphere falls through a viscous fluid. The viscous drag force is given by Stokes' law: F = 6πηrv. What is the dimensional formula of the coefficient of viscosity (η)?", "options": ["[M L T-1]", "[M L-1 T-1]", "[M L-1 T-2]", "[M0 L2 T-1]"], "answer": 1, "explanation": "From F = 6πηrv, we have η = F / (6πrv). Substituting dimensions of force [M L T-2], radius [L], and velocity [L T-1]: η = [M L T-2] / ([L] × [L T-1]) = [M L-1 T-1]. Highly important for competitive exams."}, {"q": "Surface tension (S) of a liquid is defined as force per unit length. What is its dimensional formula?", "options": ["[M L T-2]", "[M L0 T-2]", "[M L T-1]", "[M L2 T-2]"], "answer": 1, "explanation": "Surface tension S = Force / Length. Substituting dimensions: [M L T-2] / [L] = [M T-2] or [M L^0 T^-2]. It is identical to the dimensions of the spring constant and surface energy per unit area."}, {"q": "Modulus of elasticity is the ratio of stress to strain. What is its dimensional formula?", "options": ["[M L-1 T-2]", "[M L T-2]", "[M L2 T-2]", "It is dimensionless."], "answer": 0, "explanation": "Modulus of Elasticity = Stress / Strain. Since strain is dimensionless, the modulus of elasticity has the exact same dimensions as stress (Force/Area), which is [M L-1 T-2]."}, {"q": "Specific heat capacity (c) of a substance is the heat required to raise the temperature of a unit mass by one Kelvin. What is its dimensional formula?", "options": ["[M L2 T-2 K-1]", "[M0 L2 T-2 K-1]", "[M L2 T-3 K-1]", "[M0 L2 T-1 K-1]"], "answer": 1, "explanation": "From Q = m c ∆T, we get c = Q / (m ∆T). The heat energy Q has dimensions [M L2 T-2], mass is [M], and change in temperature is [K]. So, c = [M L2 T-2] / ([M] [K]) = [L2 T-2 K-1] or [M0 L2 T-2 K-1]."}, {"q": "Latent heat (L) represents the thermal energy required to change the phase of a unit mass without a change in temperature. What is its dimensional formula?", "options": ["[M0 L2 T-2 K-1]", "[M0 L2 T-2]", "[M L2 T-2]", "[M L T-2]"], "answer": 1, "explanation": "From Q = m L, we get L = Q / m. Heat energy Q is [M L2 T-2] and mass is [M]. Thus, L = [M L2 T-2] / [M] = [M0 L2 T-2]. Note that it does not contain the dimension of temperature."}, {"q": "Thermal conductivity (K) is the measure of a material's ability to conduct heat. What is the dimensional formula of K?", "options": ["[M L T-2 K-1]", "[M L T-3 K-1]", "[M L2 T-3 K-1]", "[M L0 T-3 K-1]"], "answer": 1, "explanation": "From heat conduction equation, Q/t = K A ∆T / d ⇒ K = (Q/t) d / (A ∆T). Heat flow rate (Q/t) is power [M L2 T-3], thickness d is [L], area A is [L2], and ∆T is [K]. K = [M L2 T-3] [L] / ([L2] [K]) = [M L T-3 K-1]."}, {"q": "The average kinetic energy of a gas molecule is given by E = (3/2) k_B T. What is the dimensional formula of the Boltzmann constant (k_B)?", "options": ["[M L2 T-2 K-1]", "[M L T-2 K-1]", "[M0 L2 T-2 K-1]", "[M L2 T-3 K-1]"], "answer": 0, "explanation": "From E = (3/2) k_B T, we have k_B = E / T. The energy E is [M L2 T-2] and temperature T is [K]. Hence, k_B has dimensions of [M L2 T-2 K-1]."}, {"q": "The ideal gas equation is PV = n R T, where n is the number of moles. What is the dimensional formula of the Universal Gas Constant (R)?", "options": ["[M L2 T-2 K-1]", "[M L2 T-2 K-1 mol-1]", "[M L T-2 K-1 mol-1]", "[M0 L2 T-2 K-1 mol-1]"], "answer": 1, "explanation": "From PV = n R T, we get R = PV / (n T). Pressure P is [M L-1 T-2], Volume V is [L3], n is [mol], and T is [K]. So R = [M L2 T-2] / ([mol] [K]) = [M L2 T-2 K-1 mol-1]."}, {"q": "Electric Charge (Q) is defined as the product of electric current and time. What is its dimensional formula?", "options": ["[M0 L0 T1 A1]", "[M0 L0 T-1 A1]", "[M1 L0 T1 A1]", "It is a fundamental dimensionless quantity."], "answer": 0, "explanation": "Electric Current is an SI fundamental base quantity represented by [A]. Since Charge Q = Current × Time, its dimensional formula is [T A] or [M^0 L^0 T^1 A^1]."}, {"q": "Electric Potential or electromotive force (V) is the work done per unit charge. What is its dimensional formula?", "options": ["[M L2 T-3 A-1]", "[M L2 T-2 A-1]", "[M L T-3 A-1]", "[M-1 L-2 T3 A1]"], "answer": 0, "explanation": "V = Work / Charge. Work is [M L2 T-2] and Charge is [T A]. Therefore, V = [M L2 T-2] / [T A] = [M L2 T-3 A-1]."}, {"q": "According to Ohm's law, Electric Resistance is given by R = V / I. What is the dimensional formula of Resistance?", "options": ["[M L2 T-3 A-1]", "[M L2 T-3 A-2]", "[M L3 T-3 A-2]", "[M-1 L-2 T3 A2]"], "answer": 1, "explanation": "Resistance R = Potential / Current. Dimensions of potential V = [M L2 T-3 A-1] and current I = [A]. Dividing them gives [M L2 T-3 A-2]."}, {"q": "Resistivity (ρ) is a material property that depends on resistance, cross-sectional area, and length. What is the dimensional formula of Resistivity?", "options": ["[M L2 T-3 A-2]", "[M L3 T-3 A-2]", "[M-1 L-3 T3 A2]", "[M L3 T-2 A-2]"], "answer": 1, "explanation": "From R = ρ l / A, we have ρ = R A / l. Resistance R has dimensions [M L2 T-3 A-2], area A is [L2], and length l is [L]. Thus, ρ = [M L2 T-3 A-2] [L2] / [L] = [M L3 T-3 A-2]."}, {"q": "Capacitance (C) is defined as the charge stored per unit potential difference. What is its dimensional formula?", "options": ["[M L2 T-2 A2]", "[M-1 L-2 T4 A2]", "[M-1 L-2 T3 A1]", "[M L2 T-4 A-2]"], "answer": 1, "explanation": "C = Q / V. Charge Q is [T A] and Potential V is [M L2 T-3 A-1]. So C = [T A] / [M L2 T-3 A-1] = [M-1 L-2 T4 A2]."}, {"q": "The electromagnetic property \"Self-Inductance\" (L) is defined via e = -L (di/dt). What is the dimensional formula of Inductance?", "options": ["[M L2 T-2 A-2]", "[M L T-2 A-2]", "[M L2 T-3 A-2]", "[M-1 L-2 T2 A2]"], "answer": 0, "explanation": "From induced emf, e = L (di/dt) ⇒ L = e / (di/dt). The emf e is potential [M L2 T-3 A-1] and di/dt is [A T-1]. Thus, L = [M L2 T-3 A-1] / [A T-1] = [M L2 T-2 A-2]."}, {"q": "According to Coulomb's law, the electric force between two charges is mediated by the permittivity of free space (ε_0). What is the dimensional formula of ε_0?", "options": ["[M L3 T-4 A-2]", "[M-1 L-3 T4 A2]", "[M-1 L-3 T3 A1]", "[M L3 T-2 A-2]"], "answer": 1, "explanation": "From Coulomb's law, F = q_1 q_2 / (4πε_0 r^2) ⇒ ε_0 = q^2 / (F r^2). Substituting dimensions of charge [T A], force [M L T-2], and distance [L]: ε_0 = [T2 A2] / ([M L T-2] [L2]) = [M-1 L-3 T4 A2]."}, {"q": "The magnetic force between parallel current-carrying conductors involves the permeability of free space (µ_0). What is the dimensional formula of µ_0?", "options": ["[M L T-2 A-2]", "[M L T-2 A-1]", "[M L2 T-2 A-2]", "[M-1 L-1 T2 A2]"], "answer": 0, "explanation": "From the force per unit length between parallel wires, F/l = µ_0 I_1 I_2 / (2πd) ⇒ µ_0 = (F/l) d / I^2. Substituting force per unit length [M T-2], distance [L], and current [A^2]: µ_0 = [M T-2] [L] / [A2] = [M L T-2 A-2]."}, {"q": "A moving charge experiences a magnetic Lorentz force F = q (v × B). What is the dimensional formula of the Magnetic Field (B)?", "options": ["[M T-2 A-1]", "[M L T-2 A-1]", "[M L2 T-2 A-1]", "[M-1 T2 A1]"], "answer": 0, "explanation": "From F = q v B, we get B = F / (q v). Force is [M L T-2], charge is [T A], and velocity is [L T-1]. Thus, B = [M L T-2] / ([T A] [L T-1]) = [M T-2 A-1] or [M L^0 T^-2 A^-1]."}, {"q": "Magnetic flux (Φ_B) is defined as the product of magnetic field and the area perpendicular to it. What is the dimensional formula of Φ_B?", "options": ["[M L T-2 A-1]", "[M L2 T-2 A-1]", "[M L2 T-3 A-1]", "[M-1 L-2 T2 A1]"], "answer": 1, "explanation": "Magnetic Flux Φ_B = B × Area. Substituting dimensions: [M T-2 A-1] × [L2] = [M L2 T-2 A-1]."}, {"q": "Which of the following pairs of physical quantities has identical dimensions?", "options": ["Torque and Work", "Momentum and Impulse", "Stress and Pressure", "All of the above have identical dimensional pairs"], "answer": 3, "explanation": "All three options represent standard matching identical pairs in physics: - Torque and Work both have dimensions of [M L2 T-2]. - Momentum and Impulse both have dimensions of [M L T-1]. - Stress and Pressure both have dimensions of [M L-1 T-2]."}, {"q": "Which of the following groups of three physical quantities all share the exact same dimensional formula: [M L-1 T-2]?", "options": ["Pressure, Stress, and Modulus of Elasticity", "Force, Thrust, and Tension", "Work, Energy, and Power", "Surface Tension, Surface Energy, and Spring Constant"], "answer": 0, "explanation": "Pressure, Stress, and all types of Elastic Moduli (Young's, Bulk, and Shear) are defined physically as force per unit area. Therefore, they all share the exact same dimensional formula: [M L-1 T-2]."}, {"q": "Which of the following represents the correct dimensional formula of \"Surface Energy\" (energy per unit area) and is it identical to Surface Tension?", "options": ["[M L2 T-2], which is different from Surface Tension.", "[M L0 T-2], which is identical to Surface Tension.", "[M L T-2], which is identical to Force.", "[M L-1 T-2], which is identical to Pressure."], "answer": 1, "explanation": "Surface Energy = Energy / Area. Dimensions: [M L2 T-2] / [L2] = [M T-2]. Since Surface Tension is Force / Length = [M L T-2] / [L] = [M T-2], both quantities have identical dimensions."}, {"q": "While specific heat capacity involves temperature, \"Latent heat\" does not. What is the dimensional formula of Latent Heat?", "options": ["[M0 L2 T-2 K-1]", "[M0 L2 T-2]", "[M1 L2 T-2]", "It is completely dimensionless."], "answer": 1, "explanation": "Latent heat L = Heat energy / Mass. Substituting dimensions: [M L2 T-2] / [M] = [M0 L2 T-2]. It does not depend on temperature directly, so [K] is not present."}, {"q": "Electric Field (E) is the force experienced per unit positive test charge. What is its dimensional formula?", "options": ["[M L T-2 A-1]", "[M L T-3 A-1]", "[M L2 T-3 A-1]", "[M-1 L-1 T3 A1]"], "answer": 1, "explanation": "E = Force / Charge. Force has dimensions [M L T-2], and Charge has dimensions [T A]. Therefore, E = [M L T-2] / [T A] = [M L T-3 A-1]."}, {"q": "The restoring force of an ideal spring is given by Hooke's law: F = -k x. What is the dimensional formula of the spring constant (k)?", "options": ["[M L T-2]", "[M L0 T-2]", "[M L2 T-2]", "[M L-1 T-1]"], "answer": 1, "explanation": "Spring constant k = Force / extension. Substituting dimensions: [M L T-2] / [L] = [M T-2] or [M L^0 T^-2], which is identical to the dimensions of Surface Tension."}, {"q": "The flow of electric current per unit cross-sectional area of a conductor is defined as the \"Current Density\" (J). What is its dimensional formula?", "options": ["[M0 L-2 T0 A1]", "[M0 L2 T0 A1]", "[M1 L-2 T0 A1]", "It is a fundamental dimensionless quantity."], "answer": 0, "explanation": "Current density J = Current / Area. Substituting dimensions: [A] / [L2] = [M0 L-2 T0 A1]."}, {"q": "An electric dipole consists of equal and opposite charges separated by a distance 2a. What is the dimensional formula of the \"Electric Dipole Moment\" (p)?", "options": ["[M0 L1 T1 A1]", "[M0 L-1 T1 A1]", "[M1 L1 T1 A1]", "[M0 L1 T-1 A-1]"], "answer": 0, "explanation": "Electric Dipole Moment p = charge × separation. Substituting dimensions: [T A] × [L] = [M0 L1 T1 A1]."}, {"q": "A flywheel rotates at a constant angular speed. What is the dimensional formula of its Rotational Kinetic Energy?", "options": ["[M L2 T-2]", "[M L2 T-3]", "[M L T-2]", "It is dimensionless because rotation is a supplementary quantity."], "answer": 0, "explanation": "Rotational Kinetic Energy (K_rot) = (1/2) I ω^2. Substituting dimensions of moment of inertia [M L^2] and angular speed [T^-1]: [M L^2] × [T^-1]^2 = [M L^2 T^-2]. This is identical to the dimensions of work, heat, and translational kinetic energy."}, {"q": "Due to thermal expansion, a solid's dimensions change with temperature. What is the dimensional formula of the \"Coefficient of Thermal Expansion\" (α)?", "options": ["[M0 L1 T0 K-1]", "[M0 L0 T0 K-1]", "[M1 L0 T0 K-1]", "It is completely dimensionless."], "answer": 1, "explanation": "From thermal expansion formula, ∆L = L_0 α ∆T ⇒ α = ∆L / (L_0 ∆T). Since ∆L / L_0 is dimensionless, the dimensions of α are simply 1 / [K] = [M^0 L^0 T^0 K^-1]."}, {"q": "In alternating current (AC) circuits, the inductive reactance (X_L) limits the current flow. What is its dimensional formula?", "options": ["[M L2 T-3 A-2]", "[M L2 T-2 A-2]", "[M L T-3 A-1]", "It is dimensionless."], "answer": 0, "explanation": "Inductive reactance (X_L = ω L) behaves exactly like electrical resistance in limiting current flow. Therefore, it shares the exact same dimensional formula as Resistance, which is [M L2 T-3 A-2]."}, {"q": "In capacitive AC circuits, the capacitive reactance (X_C) limits current flow. What is its dimensional formula?", "options": ["[M L2 T-3 A-2]", "[M-1 L-2 T4 A2]", "[M L3 T-3 A-2]", "It is dimensionless."], "answer": 0, "explanation": "Capacitive reactance (X_C = 1/(ω C)) also behaves exactly like electrical resistance in limiting current. Therefore, its dimensional formula is identical to Resistance, [M L2 T-3 A-2]."}, {"q": "A student analyzes the ratio of Magnetic Field to Electric Field (B / E) in electromagnetic wave theory. What is its dimensional formula?", "options": ["[L T-1]", "[L-1 T]", "[L T]", "It is a dimensionless ratio."], "answer": 1, "explanation": "In electromagnetic wave propagation, the ratio of Electric Field to Magnetic Field (E / B) equals the velocity of light (c), which has dimensions [L T-1]. Therefore, the reciprocal ratio (B / E) has dimensions of 1 / velocity = [L-1 T]."}, {"q": "In some laboratory experiments, the term \"Specific Resistance\" is used instead of resistivity. What is the dimensional formula of specific resistance?", "options": ["[M L2 T-3 A-2]", "[M L3 T-3 A-2]", "[M L3 T-2 A-2]", "It is a dimensionless ratio."], "answer": 1, "explanation": "Specific Resistance is simply another name for Electrical Resistivity (ρ). Therefore, it possesses the exact same dimensional formula as resistivity: [M L3 T-3 A-2]."}, {"q": "The propagation speed of electromagnetic waves in vacuum is given by the relation c = 1 / √(µ_0 ε_0). What is the dimensional formula of the combination 1 / √(µ_0 ε_0)?", "options": ["[M0 L1 T-1]", "[M0 L2 T-2]", "[M1 L3 T-4 A-2]", "It is a dimensionless universal constant."], "answer": 0, "explanation": "By Maxwell's equations of electromagnetism, the term 1 / √(µ_0 ε_0) is exactly equal to the velocity of light in vacuum (c). Therefore, its dimensions must be the dimensions of velocity, which is [L T-1] or [M^0 L^1 T^-1]."}, {"q": "In alternating current theory, the combination √(L / C) has the unit of ohms. What is the dimensional formula of the combination √(L / C)?", "options": ["[M L2 T-3 A-2]", "[M L2 T-2 A-2]", "[M-1 L-2 T4 A2]", "It is a dimensionless quantity."], "answer": 0, "explanation": "The quantity √(L / C) represents the characteristic impedance of an LC combination, measured in ohms. Its dimensions are identical to those of electrical resistance, which is [M L2 T-3 A-2]."}, {"q": "According to Stefan's law, the energy radiated per unit area per unit time by a black body is given by E = σ T^4. What is the dimensional formula of the Stefan-Boltzmann constant (σ)?", "options": ["[M L T-3 K-4]", "[M L0 T-3 K-4]", "[M L2 T-2 K-4]", "[M L2 T-3 K-4]"], "answer": 1, "explanation": "The emissive power E is energy per unit area per unit time: [E] = [M L2 T-2] / ([L2] [T]) = [M T-3]. From E = σ T^4, we have σ = E / T^4. Hence, σ = [M T-3] / [K4] = [M L0 T-3 K-4]."}, {"q": "Wien's displacement law states that the peak wavelength of black-body radiation is inversely proportional to the absolute temperature: λ_m T = b. What is the dimensional formula of the Wien constant (b)?", "options": ["[M0 L1 T0 K1]", "[M0 L1 T0 K-1]", "[M1 L1 T0 K1]", "It is completely dimensionless."], "answer": 0, "explanation": "From λ_m T = b, the wavelength λ_m is [L] and the temperature T is [K]. Therefore, the Wien constant b has the dimensions [L K] or [M^0 L^1 T^0 K^1]."}, {"q": "In astronomy, Hubble's law relates the recession velocity of a galaxy to its distance: v = H_0 d. What is the dimensional formula of Hubble's constant (H_0)?", "options": ["[M0 L1 T-1]", "[M0 L0 T-1]", "[M0 L0 T1]", "It is dimensionless."], "answer": 1, "explanation": "From v = H_0 d, we have H_0 = v / d. Velocity is [L T-1] and distance is [L]. So H_0 = [L T-1] / [L] = [T-1], which is the dimension of frequency (or reciprocal of time)."}, {"q": "The \"Solar Constant\" represents the solar electromagnetic energy received perpendicularly per unit area per second at the Earth's orbit. What is its dimensional formula?", "options": ["[M L2 T-3]", "[M L0 T-3]", "[M L2 T-2]", "[M L-1 T-2]"], "answer": 1, "explanation": "Solar constant is power per unit area (Energy / (Area × Time)). Substituting dimensions: [M L2 T-2] / ([L2] [T]) = [M T-3] or [M L^0 T^-3]. It is identical to the dimensions of wave intensity."}, {"q": "A student is analyzing electromagnetic coils. What is the dimensional formula of the ratio of self-inductance to mutual-inductance (L / M)?", "options": ["[M L2 T-2 A-2]", "[M0 L0 T0 A0]", "[M L T-2 A-2]", "[T A]"], "answer": 1, "explanation": "Both self-inductance (L) and mutual-inductance (M) are measured in Henries and have identical dimensional formulas: [M L2 T-2 A-2]. Therefore, their ratio (L / M) is completely dimensionless: [M0 L0 T0 A0]."}, {"q": "The relative magnetic permeability (µ_r) of a medium is defined as µ_r = µ / µ_0. What is its dimensional formula?", "options": ["[M L T-2 A-2]", "[M0 L0 T0 A0]", "[M-1 L-1 T2 A2]", "[T A]"], "answer": 1, "explanation": "Relative permeability µ_r is the ratio of the permeability of a medium to the permeability of free space. Being a ratio of two identical physical quantities with same dimensions, it is completely dimensionless [M0 L0 T0 A0]."}, {"q": "Thermal Resistance (R_th) is the measure of a component's resistance to heat flow, defined via ∆T = P × R_th, where P is the thermal power. What is its dimensional formula?", "options": ["[M-1 L-2 T3 K1]", "[M L2 T-3 K1]", "[M L T-3 K-1]", "[M0 L0 T1 K-1]"], "answer": 0, "explanation": "From ∆T = P × R_th, we get R_th = ∆T / P. The change in temperature is [K], and thermal power P is [M L2 T-3]. Therefore, R_th = [K] / [M L2 T-3] = [M-1 L-2 T3 K1]."}, {"q": "The dimensionless ratio k_e e^2 / (G m_e m_p) represents the ratio of electrostatic force to gravitational force between an electron and a proton. What is its dimensional formula?", "options": ["[M0 L0 T0 A0]", "[M L T-2 A-2]", "[M-1 L3 T-2]", "[M L3 T-3 A-2]"], "answer": 0, "explanation": "Since this expression represents the ratio of two physical forces (Electrostatic Force / Gravitational Force), the Newton units cancel out completely, making the entire expression a dimensionless ratio [M^0 L^0 T^0 A^0]. Class 11 Physics — Chapter 1: Units and Measurements Topic 8: Dimensional Analysis & its Applications Comprehensive Practice Question Bank (60 MCQs with Detailed Solutions) Exam Trend Analysis (2014–2025): Dimensional Analysis is a core pillar of physics tested in every UPSC NDA/CDS examination. Questions consistently target the dimensions of fundamental constants (such as G, h, eta, and vacuum permittivity), identifying identical dimensions (e.g., Planck's constant & angular momentum), and checking the structural limits of homogeneity. This high-density practice bank comprises 60 original questions mapping every crucial dimension and limit covered in the syllabus."}]}, {"topicNum": "8", "topicName": "Dimensional Analysis & Applications", "questions": [{"q": "What is the dimensional formula of the Universal Gravitational Constant ($G$)?", "options": ["$[M L^2 T^{-2}]$", "$[M^{-1} L^3 T^{-2}]$", "$[M^{-1} L^2 T^{-1}]$", "$[M L^3 T^{-2}]$"], "answer": 1, "explanation": "According to Newton's law of gravitation, $F = G M_1 M_2 / r^2$, which can be rearranged as $G = F r^2 / (M_1 M_2)$. Substituting the dimensions of Force $[M L T^{-2}]$, distance $[L]$, and mass $[M]$, we get: $[G] = [M L T^{-2}] [L^2] / [M^2] = [M^{-1} L^3 T^{-2}]$. Finding the dimensions of $G$ is a highly recurring pattern in NDA and CDS exams (e.g., NDA 2022-I Q68) [189, 512]."}, {"q": "Which of the following physical quantities has the exact same dimensions as Planck's constant ($h$)?", "options": ["Linear momentum", "Angular momentum", "Force", "Potential energy"], "answer": 1, "explanation": "According to Einstein's photoelectric equation, the energy of a photon is $E = hf$, where $f$ is frequency ($[T^{-1}]$). Thus, $[h] = [E]/[f] = [M L^2 T^{-2}] / [T^{-1}] = [M L^2 T^{-1}]$. Similarly, angular momentum ($L = m v r$) has dimensions: $[M] [L T^{-1}] [L] = [M L^2 T^{-1}]$. Therefore, Planck's constant and angular momentum share identical dimensions. This exact match was tested in NDA 2025-I Q60 and CDS Physics PYQs [95, 514]."}, {"q": "A student derives the relation for the displacement $y$ of a particle undergoing periodic motion as $y = a \\sin(\\omega t)$, where $a$ is maximum displacement, $t$ is time, and $\\omega$ is angular velocity. On what dimensional grounds is this formula valid?", "options": ["The argument of the trigonometric function must have the dimension $[T]$.", "Both sides of the equation have the dimension of velocity $[L T^{-1}]$.", "The argument of the trigonometric function ($\\omega t$) must be completely dimensionless $[M^0 L^0 T^0]$, and both sides must have the dimension of length $[L]$.", "Trigonometric functions can have any arbitrary dimensions depending on the medium."], "answer": 2, "explanation": "Arguments of trigonometric, exponential, and logarithmic functions must always be dimensionless physical quantities. For $\\sin(\\omega t)$ to be valid, $[\\omega t]$ must be $[T^{-1}] [T] = [T^0]$ (dimensionless). Furthermore, since the sine function itself is a ratio and dimensionless, the left-hand side ($[y] = [L]$) must have the same dimension as the multiplying coefficient on the right-hand side ($[a] = [L]$). This is the base rule of NCERT Example 2.14 [217, 515]."}, {"q": "Which of the following groups of physical quantities have identical dimensions?", "options": ["Force, Torque, and Work", "Stress, Pressure, and Young's Modulus", "Impulse, Force, and Momentum", "Power, Energy, and Force"], "answer": 1, "explanation": "Pressure is defined as force per unit area ($[M L T^{-2}] / [L^2] = [M L^{-1} T^{-2}]$). Stress is also defined as force per unit area and shares the same dimensions. Young's modulus (or Modulus of Elasticity) is defined as stress/strain, and since strain is dimensionless ($[M^0 L^0 T^0]$), Young's modulus also has the dimension $[M L^{-1} T^{-2}]$. Thus, all three share identical dimensions [511-512]."}, {"q": "If the equation of motion is given as $v = u + at^2$, where $v$ and $u$ are velocities, $a$ is acceleration, and $t$ is time, is this equation dimensionally correct?", "options": ["Yes, because it is one of the standard equations of motion.", "No, because the term $at^2$ has the dimension $[L]$ while $v$ and $u$ have the dimension $[L T^{-1}]$.", "Yes, because the units of both sides simplify to metres.", "No, because time cannot be squared in physical equations."], "answer": 1, "explanation": "According to the Principle of Homogeneity, only physical quantities with identical dimensions can be added, subtracted, or equated. Here, $[v] = [L T^{-1}]$ and $[u] = [L T^{-1}]$. However, $[at^2] = [L T^{-2}] [T^2] = [L]$. Since $[L T^{-1}] \\neq [L]$, the term $at^2$ cannot be added to $u$, making the equation dimensionally inconsistent (and therefore completely wrong) [199, 209]."}, {"q": "Using dimensional analysis, the relation for the time period $T$ of a simple pendulum is hypothesized as $T = k l^x g^y m^z$. What are the values of exponents $x, y,$ and $z$?", "options": ["$x = 1, y = 1, z = 0$", "$x = 1/2, y = -1/2, z = 0$", "$x = -1/2, y = 1/2, z = 1$", "$x = 1/2, y = 1/2, z = 0$"], "answer": 1, "explanation": "Writing the dimensional equation: $[T^1] = [L]^x [L T^{-2}]^y [M]^z$. Equating powers on both sides: Mass $[M]$: $z = 0$. Length $[L]$: $x + y = 0$. Time $[T]$: $-2y = 1 \\rightarrow y = -1/2$. Substituting $y$ gives $x = 1/2$. This yields the formula $T = k \\sqrt{l/g}$, which is independent of the mass of the bob. This is NCERT Example 2.17 [202-203]."}, {"q": "What are the dimensions of the coefficient of viscosity ($\\eta$), which is defined by Newton's law of viscous flow as $F = -\\eta A (dv/dx)$?", "options": ["$[M L^{-1} T^{-1}]$", "$[M L T^{-1}]$", "$[M L^{-1} T^{-2}]$", "$[M L^2 T^{-1}]$"], "answer": 0, "explanation": "From the formula, we get $\\eta = F / [A (dv/dx)]$. Substitute the dimensions of each variable: Force $[F] = [M L T^{-2}]$, Area $[A] = [L^2]$, and velocity gradient $[dv/dx] = [L T^{-1}] / [L] = [T^{-1}]$. Substituting these gives: $[\\eta] = [M L T^{-2}] / ([L^2] [T^{-1}]) = [M L^{-1} T^{-1}]$. This is a very common high-probability exam question [511]."}, {"q": "What are the dimensions of the electric permittivity of free space ($\\varepsilon_0$), which appears in Coulomb's Law ($F = \\frac{1}{4\\pi\\varepsilon_0} \\frac{q_1 q_2}{r^2}$)?", "options": ["$[M^{-1} L^{-3} T^4 A^2]$", "$[M L^3 T^{-4} A^{-2}]$", "$[M^{-1} L^2 T^{-2} A^1]$", "$[M L^2 T^{-3} A^{-1}]$"], "answer": 0, "explanation": "Coulomb's Law can be written as $\\varepsilon_0 = q^2 / (4\\pi F r^2)$. The dimension of charge is $[q] = [I \\times t] = [A T]$. Force is $[F] = [M L T^{-2}]$, and distance squared is $[r^2] = [L^2]$. Substituting these dimensions gives: $[\\varepsilon_0] = [A T]^2 / ([M L T^{-2}] [L^2]) = [A^2 T^2] / [M L^3 T^{-2}] = [M^{-1} L^{-3} T^4 A^2]$. This highly advanced dimensional formula is listed in NCERT Appendix A9 [512, 631]."}, {"q": "Which of ^{-2}] [199]."}, {"q": "What is the dimensional ratio of Torque to Angular Momentum?", "options": ["$[T^{-1}]$", "$[T^{-2}]$", "$[M L^2 T^{-1}]$", "$[L T^{-1}]$"], "answer": 0, "explanation": "The dimensional formula of Torque is [M L^2 T^-2]. The dimensional formula of Angular Momentum is [M L^2 T^-1]. The ratio is: [M L^2 T^-2] / [M L^2 T^-1] = [T^-1] (which has the dimension of frequency) [511-512]."}, {"q": "Which of the following equations represents a valid, dimensionally consistent formula for the velocity ($v$) of a wave in a stretched string under tension ($T$) and linear mass density ($\\mu = m/l$)?", "options": ["$v = k T \\mu$", "$v = k \\sqrt{T/\\mu}$", "$v = k T/\\mu$", "$v = k \\sqrt{T \\mu}$"], "answer": 1, "explanation": "Velocity [v] has dimensions [L T^-1]. Tension is a force [T] = [M L T^-2]. Linear mass density [mu] is mass per unit length [M L^-1]. Checking option B: [T/mu] = [M L T^-2] / [M L^-1] = [L^2 T^-2]. The square root gives [L T^-1], which matches the dimensions of velocity [199]."}, {"q": "What are the dimensions of the coefficient of linear expansion ($\\alpha$), defined as $\\Delta L = L_0 \\alpha \\Delta T$?", "options": ["$[K^{-1}]$", "$[M^0 L^0 T^0]$", "$[L K^{-1}]$", "$[L^{-1} K^{-1}]$"], "answer": 0, "explanation": "From the formula, alpha = dL / (L0 * dT). Since dL and L0 both have the dimension of length [L], their ratio is dimensionless. Therefore, the dimension of alpha is simply [1/dT] = [K^-1] [512]."}, {"q": "What is the dimensional formula of Thermal Conductivity ($K$), appearing in the heat flow equation $Q = K A (dT/dx) t$?", "options": ["$[M L T^{-3} K^{-1}]$", "$[M L^2 T^{-2} K^{-1}]$", "$[M L^2 T^{-3} K^{-1}]$", "$[M L T^{-2} K^{-1}]$"], "answer": 0, "explanation": "From the heat equation, K = Q x / (A x dT x t). Substitute the dimensions of Heat Energy [M L^2 T^-2], distance [L], Area [L^2], Temperature difference [K], and time [T]. This yields: [K] = [M L T^-3 K^-1] [512]."}, {"q": "According to the Principle of     <script>
        const TOPICS = JSON.parse(document.getElementById('quizData').textContent);
        const STORAGE_KEY = 'puchki_uom_progress_v1';
        const INPROGRESS_PREFIX = 'puchki_uom_inprogress_v1_';

        const borderPalette = [
            { border: 'rgba(56,189,248,0.55)',  hover: 'rgba(56,189,248,0.9)',  shadow: 'rgba(56,189,248,0.2)',  shadowHover: 'rgba(56,189,248,0.4)' },
            { border: 'rgba(167,139,250,0.55)', hover: 'rgba(167,139,250,0.9)', shadow: 'rgba(167,139,250,0.2)', shadowHover: 'rgba(167,139,250,0.4)' },
            { border: 'rgba(244,114,182,0.55)', hover: 'rgba(244,114,182,0.9)', shadow: 'rgba(244,114,182,0.2)', shadowHover: 'rgba(244,114,182,0.4)' },
            { border: 'rgba(52,211,153,0.55)',  hover: 'rgba(52,211,153,0.9)',  shadow: 'rgba(52,211,153,0.2)',  shadowHover: 'rgba(52,211,153,0.4)' },
            { border: 'rgba(251,146,60,0.55)',  hover: 'rgba(251,146,60,0.9)',  shadow: 'rgba(251,146,60,0.2)',  shadowHover: 'rgba(251,146,60,0.4)' },
            { border: 'rgba(45,212,191,0.55)',  hover: 'rgba(45,212,191,0.9)',  shadow: 'rgba(45,212,191,0.2)',  shadowHover: 'rgba(45,212,191,0.4)' },
            { border: 'rgba(129,140,248,0.55)', hover: 'rgba(129,140,248,0.9)', shadow: 'rgba(129,140,248,0.2)', shadowHover: 'rgba(129,140,248,0.4)' },
            { border: 'rgba(251,191,36,0.55)',  hover: 'rgba(251,191,36,0.9)',  shadow: 'rgba(251,191,36,0.2)',  shadowHover: 'rgba(251,191,36,0.4)' },
        ];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getProgress() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) { return {}; }
        }
        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }
        function getInProgress(topicNum) {
            try {
                return JSON.parse(localStorage.getItem(INPROGRESS_PREFIX + topicNum));
            } catch (e) { return null; }
        }
        function saveInProgress(topicNum, state) {
            localStorage.setItem(INPROGRESS_PREFIX + topicNum, JSON.stringify(state));
        }
        function clearInProgress(topicNum) {
            localStorage.removeItem(INPROGRESS_PREFIX + topicNum);
        }

        // ============ TOPIC LIST ============
        function renderTopics() {
            const progress = getProgress();
            const grid = document.getElementById('topicsGrid');
            const totalQ = TOPICS.reduce((sum, t) => sum + t.questions.length, 0);
            document.getElementById('totalQCount').textContent = `${totalQ} MCQs across ${TOPICS.length} topics — pick one, Puchki! ☁️✨`;

            grid.innerHTML = TOPICS.map((t, i) => {
                const c = borderPalette[i % borderPalette.length];
                const p = progress[t.topicNum];
                const inProg = getInProgress(t.topicNum);
                let badge = '';
                if (p) {
                    const pct = Math.round((p.bestScore / t.questions.length) * 100);
                    const trophy = pct === 100 ? ' 🏆' : '';
                    badge = `<div class="text-xs font-bold text-ndagreen-700 bg-ndagreen-400/20 inline-block px-3 py-1 rounded-full w-max mb-3 border border-ndagreen-400/40">Best: ${p.bestScore}/${t.questions.length} (${pct}%)${trophy}</div>`;
                } else if (inProg) {
                    badge = `<div class="text-xs font-bold text-amber-700 bg-amber-100 inline-block px-3 py-1 rounded-full w-max mb-3 border border-amber-200">In progress — Q${inProg.currentIndex + 1}/${t.questions.length}</div>`;
                } else {
                    badge = `<div class="text-xs font-bold text-cutesky-400 bg-cutesky-50 inline-block px-3 py-1 rounded-full w-max mb-3 border border-cutesky-100">Not started</div>`;
                }
                return `
                <div class="cute-glass p-6 flex flex-col group card-hover cursor-pointer relative" onclick="startTopic('${t.topicNum}')"
                     style="--card-border: ${c.border}; --card-shadow: ${c.shadow}; --card-border-hover: ${c.hover}; --card-shadow-hover: ${c.shadowHover};">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold text-cutesky-400 bg-white/70 px-2.5 py-1 rounded-full border border-cutesky-100">Topic ${t.topicNum}</span>
                        <span class="text-xs font-bold text-gray-500">${t.questions.length} Qs</span>
                    </div>
                    <h3 class="text-lg font-cute font-bold text-gray-800 mb-3 leading-snug">${escapeHtml(t.topicName)}</h3>
                    ${badge}
                    <span class="mt-auto text-sm font-bold text-cutesky-500 flex items-center gap-1">${inProg ? 'Resume ' : 'Start '}Quiz →</span>
                </div>
            `;
            }).join('');
        }

        // ============ QUIZ STATE ============
        let currentTopic = null;
        let currentIndex = 0;
        let score = 0;
        let answers = []; // per-question: chosen index or null
        let answered = false;

        function startTopic(topicNum) {
            currentTopic = TOPICS.find(t => t.topicNum === topicNum);
            const saved = getInProgress(topicNum);
            if (saved && saved.currentIndex < currentTopic.questions.length) {
                currentIndex = saved.currentIndex;
                score = saved.score;
                answers = saved.answers;
            } else {
                currentIndex = 0;
                score = 0;
                answers = new Array(currentTopic.questions.length).fill(null);
            }
            showView('quizView');
            renderQuestion();
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showTopics() {
            currentTopic = null;
            renderTopics();
            showView('topicView');
        }

        function exitQuiz() {
            if (currentTopic) {
                saveInProgress(currentTopic.topicNum, { currentIndex, score, answers });
            }
            showTopics();
        }

        function renderQuestion() {
            answered = false;
            const q = currentTopic.questions[currentIndex];
            document.getElementById('quizTopicName').textContent = currentTopic.topicName;
            document.getElementById('quizScoreBadge').textContent = `Score: ${score}/${currentIndex}`;
            document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${currentTopic.questions.length}`;
            document.getElementById('progressFill').style.width = `${(currentIndex / currentTopic.questions.length) * 100}%`;
            document.getElementById('questionText').textContent = q.q;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = q.options.map((opt, i) => `
                <button class="option-btn w-full text-left p-4 rounded-xl border-2 border-cutesky-100 bg-white/60 font-semibold text-sm text-gray-700"
                        onclick="selectOption(${i})" id="opt-${i}">
                    <span class="font-bold text-cutesky-500 mr-2">${String.fromCharCode(65 + i)}.</span>${escapeHtml(opt)}
                </button>
            `).join('');

            document.getElementById('explanationBox').classList.add('hidden');
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-40', 'cursor-not-allowed');
            nextBtn.textContent = currentIndex === currentTopic.questions.length - 1 ? 'Finish 🏁' : 'Next →';

            // If this question was already answered (resumed session), show its state
            if (answers[currentIndex] !== null && answers[currentIndex] !== undefined) {
                selectOption(answers[currentIndex], true);
            }
        }

        function selectOption(i, isResume) {
            if (answered) return;
            answered = true;
            const q = currentTopic.questions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (i === q.answer) {
                buttons[i].classList.add('option-correct');
                if (!isResume) score++;
            } else {
                buttons[i].classList.add('option-wrong');
                buttons[q.answer].classList.add('option-correct');
            }

            if (!isResume) {
                answers[currentIndex] = i;
                saveInProgress(currentTopic.topicNum, { currentIndex, score, answers });
            }

            const box = document.getElementById('explanationBox');
            const label = document.getElementById('feedbackLabel');
            label.textContent = i === q.answer ? "✅ Correct!" : "❌ Not quite";
            label.className = i === q.answer ? "font-bold mb-1 text-emerald-600" : "font-bold mb-1 text-rose-600";
            document.getElementById('explanationText').textContent = q.explanation;
            box.classList.remove('hidden');

            document.getElementById('quizScoreBadge').textContent = `Score: ${score}/${currentIndex + 1}`;

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        }

        function nextQuestion() {
            if (currentIndex < currentTopic.questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishTopic();
            }
        }

        function finishTopic() {
            const progress = getProgress();
            const total = currentTopic.questions.length;
            const existing = progress[currentTopic.topicNum];
            progress[currentTopic.topicNum] = {
                bestScore: existing ? Math.max(existing.bestScore, score) : score,
                lastScore: score,
                total: total,
                completedAt: new Date().toISOString()
            };
            saveProgress(progress);
            clearInProgress(currentTopic.topicNum);

            const pct = Math.round((score / total) * 100);
            document.getElementById('resultTopicName').textContent = currentTopic.topicName;
            document.getElementById('resultScore').textContent = `${score}/${total} (${pct}%)`;

            let emoji, msg;
            if (pct >= 90) { emoji = '🚀'; msg = "You're unstoppable, Puchki! Absolutely crushing it."; }
            else if (pct >= 70) { emoji = '💪'; msg = "Solid work! A little more practice and this topic is locked in."; }
            else if (pct >= 50) { emoji = '🌱'; msg = "Good start! Review the explanations and give it another go."; }
            else { emoji = '📚'; msg = "This topic needs a revisit — go through the chapter notes and try again."; }
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultMessage').textContent = msg;

            showView('resultView');
        }

        function retryTopic() {
            currentIndex = 0;
            score = 0;
            answers = new Array(currentTopic.questions.length).fill(null);
            clearInProgress(currentTopic.topicNum);
            showView('quizView');
            renderQuestion();
        }

        renderTopics();

        /* ============ MUSIC SYNC (same mechanism as other pages) ============ */
        document.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicToggleBtn');

            const savedTime = localStorage.getItem('puchki_music_time') || 0;
            const isPlaying = localStorage.getItem('puchki_music_playing') === 'true';

            audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.play().then(() => {
                    musicBtn.innerHTML = '🔊';
                }).catch(e => {
                    console.log("Autoplay blocked", e);
                    musicBtn.innerHTML = '🔇';
                    localStorage.setItem('puchki_music_playing', 'false');
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('puchki_music_time', audio.currentTime);
            });

            window.toggleMusic = function() {
                if (audio.paused) {
                    audio.play();
                    localStorage.setItem('puchki_music_playing', 'true');
                    musicBtn.innerHTML = '🔊';
                } else {
                    audio.pause();
                    localStorage.setItem('puchki_music_playing', 'false');
                    musicBtn.innerHTML = '🔇';
                }
            };
        });
    </script>
</body>
</html>
