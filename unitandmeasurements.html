    <script id="quizData" type="application/json">[{"topicNum": "1", "topicName": "Introduction & SI System", "questions": [{"q": "In the International System of Units (SI), physical quantities are classified into fundamental (base) and derived quantities. Which of the following statements correctly distinguishes between them?", "options": ["Base units can be completely expressed in terms of derived units, whereas derived units are independent.", "Base units are internationally accepted reference standards that are independent of each other, whereas derived units are expressed as algebraic combinations of these base units.", "Both base units and derived units must be defined using mathematical equations containing dimensional constants.", "Base units can only be defined for scalar quantities, while derived units are defined exclusively for vectors."], "answer": 1, "explanation": "By definition, a measurement involves comparison with an internationally accepted reference standard called a unit. The units for fundamental or base quantities are called base units, which are independent of each other, whereas all other physical quantities can be expressed as combinations of these base units and are called derived units."}, {"q": "Besides the seven base units, the SI system defines two supplementary units: the radian for plane angle and the steradian for solid angle. What is the dimensional nature of these supplementary quantities?", "options": ["They have both units and dimensions of [L].", "They have units but are completely dimensionless.", "They are completely unitless and dimensionless.", "They have dimensions of [T-1] but no units."], "answer": 1, "explanation": "The SI system includes two supplementary units: the radian (rad) for plane angle (dθ = ds/r) and the steradian (sr) for solid angle (dΩ = dA/r2). Because both are defined as ratios of similar geometric dimensions (length/length and area/length2), they are dimensionless, yet they retain their specified units."}, {"q": "The SI base unit of time, the second, is defined with extreme precision. According to the standard definition, one second is the duration of exactly 9,192,631,770 periods of radiation corresponding to the transition between which levels of the cesium-133 atom?", "options": ["The ground state and the first excited state of the nucleus.", "The two hyperfine levels of the ground state of the atom.", "The outermost valence shell orbitals in an electric field.", "The ionized state and the neutral ground state."], "answer": 1, "explanation": "The second (s) is defined as the duration of 9,192,631,770 periods of the radiation corresponding to the transition between the two hyperfine levels of the ground state of the cesium-133 atom. This high precision is maintained by stable cesium atomic clocks."}, {"q": "Which of the following groups contains only official SI base units as defined in the International System?", "options": ["Metre, Kilogram, Second, Celsius, Ampere, Candela, Mole", "Metre, Kilogram, Second, Ampere, Kelvin, Mole, Candela", "Metre, Gram, Second, Ampere, Kelvin, Mole, Luminous Flux", "Metre, Kilogram, Second, Coulomb, Kelvin, Mole, Candela"], "answer": 1, "explanation": "The seven SI base units are: metre (m), kilogram (kg), second (s), ampere (A), kelvin (K), mole (mol), and candela (cd). Celsius is a derived unit, gram is a non-SI CGS unit, Coulomb is a derived unit, and Luminous Flux is measured in lumens (a derived unit). CONFIDENTIAL — FOR STUDENT USE ONLY Page 2"}, {"q": "Although some units lie outside the official SI system, they are retained for general use because of their clinical, scientific, or commercial importance. Which of the following units is correctly matched with its SI equivalent?", "options": ["1 bar = 103 Pa", "1 hectare = 104 m2", "1 barn = 10-24 m2", "1 standard atmosphere (atm) = 105 Pa"], "answer": 1, "explanation": "According to official SI tables: 1 hectare (ha) = 1 hm2 = 104 m2 (Correct). 1 bar = 105 Pa. 1 barn (b) = 10-28 m2 (the trap option used 10-24). 1 standard atmosphere (atm) = 101,325 Pa (approx. 1.013 x 105 Pa)."}, {"q": "When writing physical quantities and their respective units, strict standard grammatical and typesetting rules must be followed. Which of the following represents the correct application of SI symbol rules?", "options": ["The unit of force is written as 'Newton' with a capital N, and its symbol is 'n'.", "The unit of temperature is written as 'kelvin' with a lowercase k, and its symbol is 'K'.", "The unit of electric current is written as 'Ampere' with a capital A, and its symbol is 'amp'.", "The unit of pressure is written as 'pascal' with a lowercase p, and its symbol is 'pa'."], "answer": 1, "explanation": "Standard guidelines state that unit names are never capitalized when spelled out (i.e., 'kelvin', 'newton', 'ampere', 'pascal' are always written in lowercase). However, the unit symbols are capitalized only if they are named after a scientist (e.g., Kelvin -> K, Newton -> N, Pascal -> Pa, Ampere -> A). Therefore, writing 'kelvin' with symbol 'K' is correct."}, {"q": "A student is recording measurements in a laboratory manual. Which of the following entries violates the international guidelines for using SI symbols?", "options": ["The length of the copper wire is L = 15 m.", "The mass of the sample is M = 25 kgs.", "The time period of the pendulum is T = 2.5 s.", "The potential difference across the resistor is V = 12 V."], "answer": 1, "explanation": "Symbols for units remain completely unaltered in their plural form. For example, 25 kilograms must be written as '25 kg' and never as '25 kgs'. Furthermore, unit symbols do not contain any trailing full stops unless they occur at the end of a sentence. CONFIDENTIAL — FOR STUDENT USE ONLY Page 3"}, {"q": "When representing a derived unit that is formed by dividing one unit symbol by another, a solidus (/) or slash can be used. What is the restriction on using the solidus according to SI guidelines?", "options": ["No more than two solidi can be used in a single expression.", "No solidus is allowed; only negative powers are permissible.", "Not more than one solidus can be used in an expression unless brackets are added to avoid ambiguity.", "A solidus can only be used between base units, never between derived units."], "answer": 2, "explanation": "To prevent ambiguity, the use of more than one solidus (/) in a unit expression is prohibited. For example, acceleration should be written as m/s2 or m·s-2, but never as m/s/s. Similarly, the unit for heat capacity is J/(K·mol) or J·K-1·mol-1 but never J/K/mol."}, {"q": "When a prefix is placed before a unit symbol, the combination of the prefix and the symbol behaves as a new, inseparable unit. If this combined unit is raised to a power, how does the power apply?", "options": ["The power applies only to the base unit symbol, leaving the prefix unaffected.", "The power applies to both the prefix factor and the unit symbol.", "Unit prefixes cannot be raised to negative powers.", "Brackets must always be written explicitly around the prefix and unit."], "answer": 1, "explanation": "When a prefix is attached to a unit symbol, the combination constitutes a new composite symbol. Raising this combination to a positive or negative power means the power applies to the entire unit, including the numerical factor of the prefix. For example: 1 cm3 = (1 cm)3 = (10-2 m)3 = 10-6 m3 (not 10-2 m3)."}, {"q": "In professional engineering and physics calculations, certain prefixes must be simplified. Which of the following combinations of prefixes is strictly prohibited?", "options": ["mm (millimetre)", "GW (gigawatt)", "µµF (micromicrofarad)", "nm (nanometre)"], "answer": 2, "explanation": "Under SI guidelines, the use of double prefixes is strictly avoided when a single prefix is available. Thus, 10-12 F must be written as 1 pF (picofarad) instead of 1 µµF (micromicrofarad). Similarly, 10-9 m is written as 1 nm instead of 1 mµm. CONFIDENTIAL — FOR STUDENT USE ONLY Page 4"}, {"q": "The spacing between unit symbols carries critical physical meaning. What is the fundamental difference between the notations 'm s-1' (with a space) and 'ms-1' (without a space)?", "options": ["There is no difference; both represent metres per second.", "'m s-1' represents metres per second, while 'ms-1' represents per millisecond.", "'m s-1' represents millisecond, while 'ms-1' represents metres per second.", "'m s-1' is an invalid expression, while 'ms-1' is a valid base unit."], "answer": 1, "explanation": "Spacing is vital to distinguish between a prefix and a unit symbol. In 'm s-1', the space indicates that independent symbols for the metre (m) and second (s) are being multiplied, meaning 'metre per second'. Without a space, as in 'ms-1', the 'm' acts as the prefix 'milli' (10-3) attached to the second, making the unit 'per millisecond' (i.e., (10-3 s)-1 = 103 s-1)."}, {"q": "Match the physical quantities with their corresponding standard SI units (inspired by NDA 2025-I): (A) Temperature (B) Weight (C) Mass (D) Pressure Units: 1. Newton 2. Kilogram 3. Pascal 4. Kelvin", "options": ["A-1, B-2, C-4, D-3", "A-4, B-1, C-2, D-3", "A-4, B-2, C-1, D-3", "A-3, B-1, C-2, D-4"], "answer": 1, "explanation": "Temperature is measured in kelvin (K). Weight is a gravitational force, measured in newtons (N). Mass is the amount of matter, measured in kilograms (kg). Pressure is force per unit area, measured in pascals (Pa). Directly inspired by NDA 2025-I (Q84)."}, {"q": "The unit of pressure commonly used in meteorology is the 'bar'. What is the correct value of 1 bar in the standard SI unit of pressure (Pascal)?", "options": ["103 Pa", "105 Pa", "106 Pa", "104 Pa"], "answer": 1, "explanation": "Pressure is measured in pascals (Pa) or newton per square metre (N/m2). The 'bar' is a non-SI unit retained for general use, where 1 bar = 105 Pa = 0.1 MPa. Matches the core pressure units tested in CDS GK Physics (Q8) and NDA 2025-I. CONFIDENTIAL — FOR STUDENT USE ONLY Page 5"}, {"q": "The SI base unit for luminous intensity is the candela. By definition, a candela is the luminous intensity, in a given direction, of a source that emits monochromatic radiation of what frequency, having a radiant intensity of 1/683 watt per steradian?", "options": ["540 x 1012 Hz", "540 x 109 Hz", "540 x 106 Hz", "400 x 1012 Hz"], "answer": 0, "explanation": "The candela (cd) is the SI base unit of luminous intensity in a given direction from a source emitting monochromatic radiation of frequency 540 x 1012 hertz with a radiant intensity in that direction of 1/683 watt per steradian."}, {"q": "Plane angle and solid angle are supplementary quantities. Which of the following statements about their dimensions is correct?", "options": ["Plane angle has the dimension [L], whereas solid angle has the dimension [L2].", "Plane angle has the dimension [T-1], whereas solid angle has the dimension [T-2].", "Both quantities have the dimensional formula [M0 L0 T0].", "Both quantities can be expressed using the base dimension [K] of temperature."], "answer": 2, "explanation": "Plane angle is defined as the ratio of arc length to radius (d_theta = ds/r), giving dimensions [L]/[L] = [L0]. Solid angle is defined as the ratio of intercepted area to the square of the radius (d_omega = dA/r2), giving dimensions [L2]/[L2] = [L0]. Thus, both are dimensionless quantities [M0 L0 T0]."}, {"q": "The base unit of electric current, the Ampere, is defined in terms of the magnetic force between two current-carrying wires. To produce a force of exactly 2 x 10-7 N/m, these infinitely long, parallel conductors of negligible cross-section must be placed at what distance apart in vacuum?", "options": ["1 cm", "10 cm", "1 m", "2 m"], "answer": 2, "explanation": "According to the standard definition, one Ampere is that constant current which, if maintained in two straight parallel conductors of infinite length, of negligible circular cross-section, and placed 1 metre apart in vacuum, would produce a mutual force equal to 2 x 10-7 newton per metre of length. CONFIDENTIAL — FOR STUDENT USE ONLY Page 6"}, {"q": "The SI base unit of thermodynamic temperature is the kelvin. By international agreement, the kelvin is defined as the fraction of 1/273.16 of the thermodynamic temperature of which specific thermodynamic state?", "options": ["The boiling point of pure water at 1 atm.", "The freezing point of water in contact with air.", "The triple point of water.", "Absolute zero on the Celsius scale."], "answer": 2, "explanation": "The kelvin (K) is defined specifically as the fraction 1/273.16 of the thermodynamic temperature of the triple point of water. This ensures a highly stable and reproducible temperature standard."}, {"q": "The solid angle subtended by a closed sphere at its center is equal to how many steradians?", "options": ["pi sr", "2*pi sr", "4*pi sr", "8*pi sr"], "answer": 2, "explanation": "The solid angle is defined as d_omega = dA/r2. For a complete closed sphere of radius r, the total surface area is A = 4*pi*r2. Substituting this into the solid angle formula gives: omega = 4*pi*r2 / r2 = 4*pi steradians (sr)."}, {"q": "The decibel (dB) is widely used to measure sound levels. What is the standard SI unit for acoustic (sound) intensity?", "options": ["decibel (dB)", "watt per square metre (W/m2)", "pascal (Pa)", "newton per metre (N/m)"], "answer": 1, "explanation": "While sound levels are practically compared using the logarithmic decibel (dB) scale, the actual physical quantity of sound intensity (power per unit area) has the standard SI unit of watt per square metre (W/m2). CONFIDENTIAL — FOR STUDENT USE ONLY Page 7"}, {"q": "In 1983, the definition of the metre was revised to link it directly to the speed of light. One metre is now defined as the distance travelled by light in vacuum during a time interval of what fraction of a second?", "options": ["1 / (3 x 108)", "1 / 299,792,458", "1 / 9,192,631,770", "1 / 273.16"], "answer": 1, "explanation": "The metre is officially defined as the length of the path travelled by light in vacuum during a time interval of 1/299,792,458 of a second. This definition links the standard of length directly to the universal speed of light constant c."}, {"q": "The international prototype of the kilogram, which was kept at the International Bureau of Weights and Measures at Sèvres, near Paris, is a cylinder made of which highly stable metal alloy?", "options": ["Platinum-Iridium", "Copper-Nickel", "Steel-Chromium", "Gold-Silver"], "answer": 0, "explanation": "Under the historic definition, the standard kilogram was defined as equal to the mass of the international prototype of the kilogram, which is a cylinder made of platinum-iridium alloy kept at Sèvres, near Paris."}, {"q": "The 'barn' is a unit used in nuclear physics to measure the cross-sectional area of sub-atomic particle collisions. What is the value of 1 barn in standard SI units?", "options": ["10-24 m2", "10-28 m2", "10-30 m2", "10-15 m2"], "answer": 1, "explanation": "The 'barn' (b) is a non-SI unit retained for general use to describe nuclear collision areas, where 1 barn = 100 fm2 = 10-28 m2. CONFIDENTIAL — FOR STUDENT USE ONLY Page 8"}, {"q": "When writing derived units in terms of SI base units, proper spacing must prevent prefix-unit confusion. Which of the following symbols is correctly typed to represent 'metre-second'?", "options": ["ms", "m·s", "m-s", "M s"], "answer": 1, "explanation": "When representing a product of two unit symbols, they should be separated by a space or a half-high dot (·). Writing them together as 'ms' is incorrect because it represents 'millisecond'. Thus, 'm·s' or 'm s' is the correct way to write metre-second."}, {"q": "While the candela measures the physiological luminous intensity of a source in a given direction, the total flow of visible light emitted into a solid angle is measured in lumens. If a source has a luminous intensity of 1 candela, what is the total luminous flux emitted into a solid angle of 1 steradian?", "options": ["1 lumen", "4*pi lumens", "1/683 lumens", "2*pi lumens"], "answer": 0, "explanation": "Luminous flux is measured in lumens (lm). By definition, if a light source emits one candela (cd) of luminous intensity into a solid angle of one steradian (sr), the total luminous flux emitted into that solid angle is one lumen (1 lm = 1 cd·sr)."}, {"q": "In physics equations, symbols for physical quantities are distinguished from symbols for units by their typesetting. Which of the following represents the standard convention?", "options": ["Both physical quantities and unit symbols are printed in upright Roman font.", "Physical quantities are printed in italic (sloping) font, while unit symbols are printed in upright (Roman) font.", "Physical quantities are printed in bold, while unit symbols are printed in italics.", "Unit symbols are printed in italics, while physical quantities are printed in upright font."], "answer": 1, "explanation": "Under international guidelines, symbols for physical quantities are printed in italic (sloping) font (e.g., m for mass, g for acceleration due to gravity, W for weight). In contrast, symbols for units are printed in upright (Roman) font (e.g., m for metre, g for gram, W for watt). CONFIDENTIAL — FOR STUDENT USE ONLY Page 9"}]}, {"topicNum": "2", "topicName": "Practical Units & Astronomical Measurements", "questions": [{"q": "A light-year is a widely used unit in stellar astronomy. Which of the following statements correctly defines its physical nature and value?", "options": ["It is a unit of time, representing the time taken by light to travel from the Sun to the Earth.", "It is a unit of distance, representing the distance that light travels in vacuum in one Julian year (365.25 days).", "It is a unit of luminous intensity, representing the brightness of a standard star at a distance of one parsec.", "It is a unit of velocity, representing the maximum speed limits of electromagnetic radiation in a dense medium."], "answer": 1, "explanation": "A light-year is a unit of distance (not time). By definition, one light-year (symbol: ly) is the distance traveled by light in a vacuum in one year (365.25 days). Using c = 2.998 × 108 m s-1 and 1 year = 3.1557 × 107 s, 1 ly = c × t = 9.46 × 1015 m [NCERT Page 18, Table 2.2]. PYQ Connection: Directly inspired by NDA 2021-I (Q51) and NDA 2019-I (Q98) which test the misconception that a light-year is a unit of time."}, {"q": "The 'parsec' is the largest practical unit of length used by astronomers to measure stellar distances outside the solar system. What is the fundamental basis for the definition of one parsec?", "options": ["It is the distance at which an arc of length 1 Astronomical Unit (A.U.) subtends an angle of exactly 1 second of arc.", "It is the distance traveled by light in vacuum during the time interval of one standard cosmic orbital cycle.", "It is the radius of a circular orbit in which a planet has an orbital speed equal to 1/100 of the speed of light.", "It is the distance at which the diameter of the Earth's orbit subtends an angle of exactly 1 minute of arc at a stellar body."], "answer": 0, "explanation": "According to NCERT Chapter 2 [Page 35, Exercise 2.19], a parsec (pc) is defined as the distance at which a baseline of length 1 Astronomical Unit (distance from Earth to Sun) subtends an angle of 1 second of arc (1\"). Mathematically, θ = b / d ⇒ d = b / θ. Substituting b = 1 A.U. ≈ 1.496 × 1011 m and θ = 1\" = 4.85 × 10-6 rad, we get 1 pc ≈ 3.08 × 1016 m."}, {"q": "The nearest star system to our Sun is Alpha Centauri, which is located at a distance of approximately 4.29 light-years. What is this distance when expressed in terms of parsecs?", "options": ["14.0 parsecs", "1.32 parsecs", "0.76 parsecs", "3.26 parsecs"], "answer": 1, "explanation": "We are given d = 4.29 ly. Since 1 parsec ≈ 3.08 × 1016 m and 1 ly ≈ 9.46 × 1015 m, the conversion factor is: 1 pc = 3.08 × 1016 / 9.46 × 1015 ≈ 3.26 ly. Therefore, d = 4.29 ly / 3.26 ly/pc ≈ 1.32 pc [NCERT Page 35, Exercise 2.20 / Answer Page 220]."}, {"q": "What is the approximate numerical value of one parsec when expressed in terms of Astronomical Units (A.U.)?", "options": ["1.5 × 104 A.U.", "3.26 × 105 A.U.", "2.06 × 105 A.U.", "4.85 × 10-6 A.U."], "answer": 2, "explanation": "By definition, 1 pc = 1 A.U. / 1\". In radians, 1\" = 4.847 × 10-6 rad. Therefore, 1 pc = (1 A.U.) / (4.847 × 10-6) ≈ 2.06 × 105 A.U. This matches the exact astronomical ratio. PYQ Connection: Directly matches the concept and values tested in NDA 2025-II (Q53) where 1 parsec was asked to be estimated in Astronomical Units."}, {"q": "When utilizing the parallax method to determine the distance D of a nearby star from Earth, why must the parallax angle θ be converted into radians before carrying out any calculations?", "options": ["Radians are the only SI unit that account for the gravitational curvature of light waves in space.", "The standard mathematical equation θ = b / D is strictly derived from the geometric definition of an arc length, which requires the angle to be dimensionless (in radians).", "The parallax angle in degrees varies depending on the mass of the observing telescope, whereas radians remain constant.", "Using degrees in θ = b / D would cause the calculated distance to be 360 times larger than the true value."], "answer": 1, "explanation": "The angle equation θ = arc/radius (or θ = b / D) is a fundamental geometric ratio. For this ratio to hold without adding conversion constants (like π/180), the angle θ must be expressed in radians, which is the dimensionless SI unit for plane angles [NCERT Page 18]."}, {"q": "Stellar parallax measurements from ground-based telescopes are generally limited to stars located within a few hundred light-years. What is the primary physical reason for this limitation?", "options": ["The speed of light decreases when traveling through interstellar gas, making distant angles fluctuate.", "As the distance D increases, the parallax angle θ becomes so exceedingly small that it cannot be resolved due to the atmospheric limits and least count of telescopes.", "Distant stars do not orbit the galactic center, so they show zero parallax relative to the background.", "The baseline of the Earth's orbit shrinks as the Earth moves closer to the Sun during winter."], "answer": 1, "explanation": "Because stellar distances are extremely large, the parallax angle θ = b / D is tiny (of the order of 1\" or less). Even for the nearest star (Alpha Centauri), the parallax is only about 0.76\" [NCERT Page 35]. For extremely distant stars, θ drops below the measurement resolution limit (least count) of optical instruments, making the method unusable."}, {"q": "The Astronomical Unit (A.U.) is a primary standard of length on the solar system scale. How is it officially defined?", "options": ["The radius of the Sun's core where thermonuclear fusion occurs.", "The mean distance of the Earth from the Sun, equal to approximately 1.496 × 1011 m.", "The distance traveled by light in vacuum in exactly 8 minutes and 20 seconds.", "The distance between the Earth and the Moon during a total solar eclipse."], "answer": 1, "explanation": "The Astronomical Unit (A.U.) is the average distance of the Earth from the Sun. Its standard value is 1 A.U. = 1.496 × 1011 m [NCERT Page 18, Table 2.2]. Option C is a common trap: though light takes about 8.3 minutes to reach Earth, the A.U. is defined independently as a geometric average distance."}, {"q": "The 'fermi' is a practical unit of length used exclusively in nuclear and high-energy particle physics. What is the relation of 1 fermi to the standard SI unit of length?", "options": ["1 fermi = 10-10 m", "1 fermi = 10-15 m", "1 fermi = 10-12 m", "1 fermi = 10-9 m"], "answer": 1, "explanation": "The fermi (or femtometre, symbol: fm) is the standard unit used on the nuclear scale to express the size of atomic nuclei: 1 fermi = 1 f = 10-15 m [NCERT Page 21 / Page 36, Exercise 2.28]."}, {"q": "The Angstrom (∠) is commonly used to express wavelengths of light and atomic dimensions. What is its exact relationship to the nanometre (nm)?", "options": ["1 ∠ = 10 nm", "1 ∠ = 0.1 nm", "1 ∠ = 100 nm", "1 ∠ = 10-5 nm"], "answer": 1, "explanation": "By definition, 1 Angstrom (1 ∠) = 10-10 m. A nanometre (1 nm) = 10-9 m. Ref: 1 ∠ = 10-10 m = 0.1 × 10-9 m = 0.1 nm. This is a common conversion trap in competitive exams [NCERT Page 21]."}, {"q": "The average size of a hydrogen atom is estimated to be about 0.5 ∠. What is the total atomic volume of one mole of hydrogen atoms when treated as individual spheres?", "options": ["3.14 × 10-7 m3", "6.02 × 10-23 m3", "5.24 × 10-31 m3", "3.15 × 10-3 m3"], "answer": 0, "explanation": "Radius of hydrogen atom r = 0.5 ∠ = 0.5 × 10-10 m. Volume of one hydrogen atom Vatom = (4/3) π r3 = (4/3) × 3.1416 × (0.5 × 10-10)3 ≈ 5.24 × 10-31 m3. One mole contains Avogadro's number NA = 6.023 × 1023 atoms. Total volume V = NA × Vatom = (6.023 × 1023) × (5.24 × 10-31) ≈ 3.15 × 10-7 m3 [NCERT Page 35, Exercise 2.16 / Answer Page 219]."}, {"q": "One mole of an ideal gas at standard temperature and pressure (S.T.P.) occupies a molar volume of 22.4 L. What is the ratio of this molar volume to the actual atomic volume of one mole of hydrogen atoms (calculated as approximately 3.15 × 10-7 m3)?", "options": ["7.1 × 104", "1.0 × 102", "3.5 × 10-3", "2.2 × 104"], "answer": 0, "explanation": "Molar volume Vmolar = 22.4 L = 22.4 × 10-3 m3. Atomic volume Vatomic ≈ 3.15 × 10-7 m3. Ratio = Vmolar / Vatomic = (22.4 × 10-3) / (3.15 × 10-7) ≈ 7.1 × 104 (which is of the order of 104). This extremely large ratio arises because the intermolecular separation in a gas is much larger than the size of individual molecules [NCERT Page 35, Exercise 2.17 / Answer Page 219]."}, {"q": "To measure the distance of a nearby star using the stellar parallax method, astronomers record its position relative to distant background stars at two instances six months apart in Earth's orbit. What is the length of the 'basis' (baseline) used for this measurement?", "options": ["The radius of the Earth (6,400 km).", "The radius of the Earth's orbit around the Sun (1 A.U.).", "The diameter of the Earth's orbit around the Sun (approx. 2 A.U. or 3 × 1011 m).", "The distance traveled by the Earth in its orbit in exactly one Julian month."], "answer": 2, "explanation": "According to NCERT Chapter 2 [Page 35, Exercise 2.19], the baseline AB joining the Earth's two locations six months apart in its orbit around the Sun is equal to the diameter of the Earth's orbit, which is approximately 2 A.U. or 3 × 1011 m."}, {"q": "A laser beam is shot from an observatory towards the Moon's surface. If the light pulse takes exactly 2.56 seconds to make the round trip back to the observatory after reflection, what is the calculated radius of the lunar orbit?", "options": ["7.68 × 108 m", "3.84 × 108 m", "1.92 × 108 m", "3.00 × 108 m"], "answer": 1, "explanation": "The total time for the round trip is t = 2.56 s. The distance D is given by the formula: D = (c × t) / 2. Substituting c = 3.00 × 108 m s-1 and t = 2.56 s: D = (3.00 × 108 × 2.56) / 2 = 3.84 × 108 m [NCERT Page 36, Exercise 2.29 / Answer Page 220]."}, {"q": "In the standard laboratory method to estimate the molecular size of oleic acid, a thin film of the acid is spread over a water surface. What is the fundamental assumption of this experiment?", "options": ["The oleic acid dissolves completely in water to form a uniform homogeneous mixture.", "The oleic acid molecules form a continuous monomolecular layer of thickness equal to the molecular diameter.", "The molecules of oleic acid align in a perfect vertical column of exactly 10 layers.", "Lycopodium powder behaves as a catalyst to accelerate the evaporation of alcohol from the solution."], "answer": 1, "explanation": "The oleic acid method relies on the assumption that the acid spreads out on the water surface as a monomolecular layer (a layer exactly one molecule thick). By measuring the volume of the acid added and the area of the film, the thickness (and thus the molecular diameter) is calculated as t = Volume / Area [NCERT Page 21]."}, {"q": "The scale of lengths in our physical universe spans a tremendous range. What is the ratio of the longest length (order of magnitude of the observable universe) to the shortest length (order of magnitude of an atomic nucleus)?", "options": ["1040", "1026", "1014", "1080"], "answer": 0, "explanation": "The size of the atomic nucleus is of the order of 10-14 m, and the size of the observable universe is of the order of 1026 m. The ratio of the longest to shortest length is: 1026 / 10-14 = 1040 [NCERT Page 21 / Page 182]. This is a fundamental constant of cosmic scale."}, {"q": "When looking out of the window of a rapidly moving train, nearby trees and houses appear to move backward with high speed, while extremely distant objects like mountain peaks or the Moon appear to remain stationary. What is the optical cause of this phenomenon?", "options": ["The speed of the train is added to the speed of light reflecting from nearby objects.", "Nearby objects subtend a much larger angle at our eye, so their angular displacement changes rapidly as we move, whereas distant objects show negligible change in their subtended angle.", "Distant objects are physically locked into a geostationary orbit with the moving train.", "The atmospheric refraction of light bends the rays from distant mountains to make them appear to follow the train."], "answer": 1, "explanation": "As explained in NCERT Exercise 2.18 [Page 35 / Answer Page 220], near objects make a much greater angle at the eye than distant objects. When the observer moves, the rate of change of this angle (angular velocity) is large for nearby objects (making them appear to fly past), but extremely small for distant objects, making them appear stationary or seem to move along with the observer."}, {"q": "When the planet Jupiter is at a distance of 824.7 million kilometers from Earth, its angular diameter is measured by a telescope to be 35.72\" of arc. What is the calculated diameter of Jupiter?", "options": ["1.429 × 105 km", "3.842 × 104 km", "7.525 × 105 km", "1.429 × 108 km"], "answer": 0, "explanation": "We are given distance D = 824.7 × 106 km = 824.7 × 109 m. Angular diameter θ = 35.72\" = 35.72 × 4.85 × 10^{-6} rad ≈ 1.732 × 10^{-4} rad. The diameter d of Jupiter is: d = θ × D = (1.732 × 10^{-4} rad) × (824.7 × 106 km) ≈ 1.429 × 105 km [NCERT Page 35, Exercise 2.24 / Answer Page 220]."}, {"q": "Astronomers discover a distant quasar whose emitted light has taken 3.0 billion years to reach Earth. What is the distance of this quasar in kilometers?", "options": ["2.8 × 1022 km", "9.46 × 1015 km", "3.0 × 109 km", "2.8 × 1025 km"], "answer": 0, "explanation": "Time t = 3.0 billion years = 3.0 × 109 years = 3.0 × 109 × 3.156 × 107 s ≈ 9.47 × 1016 s. Distance d = c × t = (3.00 × 108 m/s) × (9.47 × 1016 s) ≈ 2.84 × 1025 m = 2.84 × 1022 km [NCERT Page 36, Exercise 2.31 / Answer Page 220]."}, {"q": "Angle conversions are critical in parallax calculations. Which of the following matches the correct conversion of 1\" (one second of arc) into standard radians?", "options": ["1\" ≈ 1.75 × 10-2 rad", "1\" ≈ 2.91 × 10-4 rad", "1\" ≈ 4.85 × 10-6 rad", "1\" ≈ 9.46 × 10-15 rad"], "answer": 2, "explanation": "From NCERT Chapter 2, Example 2.1 [Page 19 / Answer Page 180]: 1º = π / 180 rad ≈ 1.75 × 10-2 rad. 1' (arcmin) = 1º / 60 ≈ 2.91 × 10-4 rad. 1\" (arcsec) = 1' / 60 ≈ 4.85 × 10-6 rad (specifically 4.847 × 10-6 rad)."}, {"q": "An observer wishes to estimate the distance of a nearby tower C. He stands at a point A directly in front of C and spots a very distant object O in line with AC. He then walks perpendicular to AC up to a point B, a distance of 100 m. Looking at C from B, the parallax angle θ (angle between BO and BC) is measured to be 40º. What is the distance of the tower C from the initial point A?", "options": ["119 m", "84 m", "100 m", "150 m"], "answer": 0, "explanation": "The geometry forms a right-angled triangle ABC, where ∠BAC = 90º. The parallax angle ∠ACB = θ = 40º. Therefore: tan θ = AB / AC ⇒ AC = AB / tan θ. AB = 100 m, tan 40º ≈ 0.8391. AC = 100 / 0.8391 ≈ 119 m [NCERT Page 20, Example 2.2 / Answer Page 180]."}, {"q": "A new unit of length is chosen such that the speed of light in vacuum is exactly unity (1 unit/s). If light takes 8 minutes and 20 seconds to cover the distance between the Sun and the Earth, what is this distance in terms of the new unit of length?", "options": ["500 new units", "150 new units", "1.496 new units", "1000 new units"], "answer": 0, "explanation": "The time taken is t = 8 min 20 s = (8 × 60) + 20 = 500 s. Since c = 1 unit/s in the new system: Distance = speed × time = 1 unit/s × 500 s = 500 new units [NCERT Page 35, Exercise 2.5 / Answer Page 219]."}, {"q": "What is the mathematical ratio of 1 micron (µm) to 1 nanometre (nm)?", "options": ["103", "10-3", "106", "10-6"], "answer": 0, "explanation": "1 micron (µm) = 10-6 m. 1 nanometre (nm) = 10-9 m. Ratio = 10-6 / 10-9 = 103 = 1000. microns are 1000 times larger than nanometres."}, {"q": "An optical microscope cannot resolve details smaller than the wavelength of visible light used (approximately 4000 ∠ to 7000 ∠). What physical wave phenomenon causes this fundamental limit of resolution?", "options": ["Refraction of light passing through the glass surface.", "Diffraction of light waves around the edges of the objective aperture.", "Total internal reflection inside the microscope slides.", "Dispersion of white light into its constituent colors."], "answer": 1, "explanation": "The limit of resolution of any optical instrument is governed by diffraction. When light passes through the finite aperture of a lens, it undergoes diffraction, spreading a point image into an 'Airy disc'. If two details are closer than the diffraction limit, their patterns overlap completely and they cannot be resolved [NCERT Page 35, Exercise 2.6 / Page 372]."}, {"q": "If the nearest star Alpha Centauri is located at a distance of 1.32 parsecs, what is the maximum possible parallax shift (total angular displacement) observed when viewed from the ends of a 2 A.U. baseline six months apart?", "options": ["1.52 seconds of arc", "2.64 seconds of arc", "0.76 seconds of arc", "1.32 seconds of arc"], "answer": 0, "explanation": "By definition, the parallax angle (semi-angle) θ for a star at distance d (in parsecs) with a baseline of 1 A.U. is θ = 1 / d. Here d = 1.32 pc, so the semi-angle parallax is θ = 1 / 1.32 ≈ 0.758\". The total angular shift observed from the ends of the 2 A.U. baseline is 2θ = 2 × 0.758\" ≈ 1.52\". Note: In NCERT Answer Page 220, the printed answer is listed as '2.64\"' because the author mistakenly multiplied the distance by 2 (2 × 1.32) instead of dividing the baseline by the distance. A critical competitive trap to note! PYQ Connection: Extends the Alpha Centauri parallax calculations from Exercise 2.20 and resolves the textbook's printed errata."}, {"q": "In atomic physics, the Bohr radius is used as a fundamental constant of length. What is the approximate value of the Bohr radius in standard meters?", "options": ["0.53 × 10-10 m", "1.2 × 10-15 m", "3.08 × 1016 m", "1.67 × 10-27 m"], "answer": 0, "explanation": "The Bohr radius represents the radius of the innermost electron orbit of a hydrogen atom in its ground state, equal to approximately 0.53 ∠ or 0.53 × 10-10 m [NCERT Page 35, Exercise 2.8 / Page 425]. NCERT CLASS 11 PHYSICS Chapter 1: Units and Measurements Topic 1: Introduction & The International System of Units (SI) Exam Analysis & Trend Insights (2014-2025): UPSC NDA and CDS exams consistently prioritize Units, Measurements, and Dimensions. Key high-weightage topics include SI base and supplementary units (radian and steradian), precise definitions of standard units (such as the cesium clock transition for the second), and standard typesetting rules (capitals for scientist-named symbols, lowercase for written out units, and proper spacing to distinguish prefixes). This question bank is designed to test absolute conceptual clarity, with standard-parallel numerical and conceptual options to eliminate standard exam traps. Every question is fully grounded in the official NCERT syllabus."}]}, {"topicNum": "3", "topicName": "Measurement of Mass, Density & Time", "questions": [{"q": "A standard metallic cylinder is used in the laboratory to calibrate balances. If the cylinder's inertial mass is measured on a space-station in microgravity and its gravitational mass is measured on Earth, what is the fundamental relationship between these two masses?", "options": ["The inertial mass is exactly equal to the gravitational mass in magnitude.", "The inertial mass is zero in microgravity, while the gravitational mass is non-zero.", "The gravitational mass is greater than the inertial mass by a factor of g.", "The inertial mass depends on the local gravitational field, while gravitational mass is constant."], "answer": 0, "explanation": "According to the Principle of Equivalence, the inertial mass (which determines a body's resistance to acceleration, F = ma) and the gravitational mass (which determines the gravitational force it experiences, F = m'g) are strictly equal. A body's inertial mass is a fundamental intrinsic property and does not become zero in microgravity; only its weight becomes zero. Exam Alignment: Inspired by the mass vs weight conceptual pattern repeatedly tested in CDS GK Physics (Q48) and NDA 2021-II (Q115)."}, {"q": "The average mass density of the Sun is approximately 1.4 x 10³ kg/m³. How does this value compare to the densities of standard states of matter, and what is its physical origin?", "options": ["It is in the range of densities of typical gases, showing that the Sun is composed of uncompressed hydrogen.", "It is in the range of densities of typical liquids and solids, arising due to the intense inward gravitational attraction on the outer layers by the inner layers of the Sun.", "It is much larger than the density of any solid on Earth, showing that the Sun is made of heavy metals.", "It is exactly equal to the density of water at 4°C, which is a pure cosmological coincidence."], "answer": 1, "explanation": "According to the NCERT Chapter 2 answers [452, 471], the average density of the Sun (1.4 x 10³ kg/m³) is in the range of densities of typical liquids and solids on Earth (close to water, which is 10³ kg/m³), rather than gases. This unexpectedly high density for a gaseous star arises because the massive inward gravitational attraction of the Sun's outer layers strongly compresses the inner core, packing the plasma tightly. Exam Alignment: Aligned with the density trends tested in CDS Physics Question Bank (Q2)."}, {"q": "To measure short time intervals and maintain high-precision standards, atomic clocks are utilized. One second is officially defined as the duration of exactly 9,192,631,770 periods of radiation corresponding to the transition between which levels of the cesium-133 atom?", "options": ["The ground state and the first excited state of the outer valence electron.", "The two hyperfine levels of the ground state of the unperturbed atom.", "The K and L electronic shells under a strong magnetic field.", "The nuclear spin energy states in the presence of an electric field."], "answer": 1, "explanation": "By international standard definition, the second is linked to the transition frequency of cesium-133. Specifically, it is the duration of 9,192,631,770 periods of radiation corresponding to the transition between the two hyperfine levels of the ground state of the cesium-133 atom. This provides a highly stable time reference, unaffected by environmental fluctuations. Exam Alignment: Corresponds to the high-precision SI definitions tested in NDA 2025-I (Q84)."}, {"q": "The density of water varies with temperature. At what temperature does water reach its maximum density, and what is the ecological significance of this phenomenon?", "options": ["At 0°C; it allows ice to sink to the bottom of lakes, keeping the surface warm.", "At 4°C; it causes the denser 4°C water to remain at the bottom of frozen lakes, allowing aquatic life to survive in the liquid layer below.", "At 100°C; it ensures that hot steam rises rapidly to the surface, creating convection currents.", "At -4°C; it prevents water from freezing under high pressure."], "answer": 1, "explanation": "Water exhibits an anomalous expansion behavior, reaching its maximum density at 4°C (specifically 1000 kg/m³). In cold climates, as a lake cools, the water at 4°C sinks to the bottom. Once the surface cools below 4°C, it becomes less dense and stays on top, eventually freezing into ice. Since ice is less dense than water, it floats, insulating the liquid water at 4°C below and enabling aquatic organisms to survive. Exam Alignment: Directly inspired by CDS Physics Question Bank (Q2) and NDA 2021-I (Q52)."}, {"q": "In a molecular size estimation experiment, a student dissolves 1 cm³ of oleic acid in alcohol to prepare a 500 cm³ solution. Then, 1 cm³ of this solution is dropped onto a water surface. If the film spreads over an area of 200 cm², what is the approximate thickness of the monomolecular layer, representing the molecular size?", "options": ["1.0 x 10^-7 m", "1.0 x 10^-10 m", "1.0 x 10^-9 m", "1.0 x 10^-8 m"], "answer": 2, "explanation": "The concentration of oleic acid in the solution is 1/500. The volume of oleic acid in 1 cm³ of the solution dropped is V = (1/500) cm³ = 2.0 x 10^-3 cm³. When dropped, the alcohol evaporates, and oleic acid spreads as a monomolecular layer of thickness t. Since Volume = Area x Thickness: t = V / A = (2.0 x 10^-3 cm³) / 200 cm² = 1.0 x 10^-5 cm = 1.0 x 10^-7 cm = 1.0 x 10^-9 m. This matches the standard nanometer scale of molecular size. Exam Alignment: Targeted at the molecular size estimation concepts discussed in NCERT Section 2.3 [135]."}, {"q": "The international standard prototype of the kilogram, which was historically kept at the International Bureau of Weights and Measures at Sèvres, France, is a cylinder constructed of which specific alloy?", "options": ["Platinum-Nickel alloy", "Platinum-Iridium alloy", "Gold-Silver alloy", "Stainless steel-Chromium alloy"], "answer": 1, "explanation": "Historically, the standard prototype of the kilogram was a cylinder made of an alloy of 90% Platinum and 10% Iridium. This specific alloy was selected because of its extreme chemical stability, resistance to oxidation, and hardness, minimizing mass changes over time. Exam Alignment: Grounded in standard textbook definitions of SI mass standards [413]."}, {"q": "An astronaut on board the International Space Station (ISS) wishes to determine the mass of an unknown metal block. Why can the astronaut NOT use a standard spring balance for this measurement, and what device must be used instead?", "options": ["A spring balance reads weight, which is zero in free fall; the astronaut must use an inertial balance that measures vibrational frequency.", "The spring's elastic properties change in space; the astronaut must use a beam balance.", "Mass is zero in microgravity; no measurement is possible.", "Air resistance in the cabin prevents spring elongation; a vacuum chamber balance is required."], "answer": 0, "explanation": "A spring balance measures weight (W = mg), which becomes zero in the free-fall environment of the ISS, causing the balance to read zero. To measure the intrinsic mass of a body, the astronaut must use an 'inertial balance'. This device vibrates the mass back and forth. Since the time period of oscillation depends on the inertial mass (T = 2*pi*sqrt(m/k)), mass can be measured completely independent of gravity. Exam Alignment: Directly explains the weightlessness paradox tested in NDA 2024-II (Q65) and NDA 2014-I (Q100)."}, {"q": "According to Einstein's Special Theory of Relativity, a particle's mass increases as its speed approaches the speed of light. If a particle has a rest mass of m■, what is its moving mass m at a velocity v?", "options": ["m = m■ * (1 - v²/c²)^1/2", "m = m■ / (1 - v²/c²)^1/2", "m = m■ * (1 + v²/c²)", "m = m■ * ln(1 - v²/c²)"], "answer": 1, "explanation": "As first formulated by Albert Einstein in Special Relativity, the moving mass is given by m = m■ / sqrt(1 - v²/c²), where c is the speed of light. As the velocity v approaches c, the denominator approaches zero, causing the moving mass to approach infinity. This is why classical Newtonian mechanics (which assumes mass is constant) fails for high-speed subatomic particles. Exam Alignment: Matches the exact relativistic formula derivation tested in NCERT Exercise 2.15 [169, 451]."}, {"q": "How does the mass density of an atomic nucleus compare to the average mass density of bulk atomic matter, and how does it vary with the mass number A of the nucleus?", "options": ["Nuclear density is about 10^15 times larger than atomic density and decreases as A increases.", "Nuclear density is about 10^15 times larger than atomic density and is constant, independent of the mass number A.", "Nuclear density is roughly equal to atomic density and increases linearly with A.", "Nuclear density is much smaller than atomic density because of the electrostatic repulsion between protons."], "answer": 1, "explanation": "According to NCERT Chapter 2 answers [452], nuclear density is extremely large—about 10^15 times the mass density of typical atomic solids. Crucially, because the volume of a nucleus is directly proportional to its mass number A (V is proportional to A, since R = R■*A^(1/3)), the ratio of mass to volume (Density = Mass/Volume) is constant, approximately 2.3 x 10^17 kg/m³ for all nuclei, completely independent of A. Exam Alignment: Grounded in nuclear physical constants discussed in NCERT Section 2.7 [452]."}, {"q": "An astronaut on the International Space Station experiences weightlessness. Which of the following is the correct physical explanation for this observation?", "options": ["The gravitational force of the Earth at the station's altitude is zero.", "The space station is in a state of continuous free fall towards the Earth under gravity, so the normal reaction force from the floor is zero.", "The gravitational pull of the Sun exactly cancels the gravitational pull of the Earth.", "The station is shielded from gravity by a thick aluminum hull."], "answer": 1, "explanation": "Weightlessness is not due to the absence of gravity (gravity at ISS altitude is still about 90% of its Earth-surface value). Rather, it is because both the astronaut and the space station are in a state of continuous 'free fall' towards the Earth. Because they fall with the same acceleration, there is no relative acceleration, and the normal reaction force between the astronaut and the cabin floor becomes exactly zero. Exam Alignment: Directly based on NDA 2024-II (Q65) and the 'Points to Ponder' in Chapter 8 [441]."}, {"q": "The spring constant of a spiral spring is measured in a physics lab. If the spring is cut exactly into two equal halves, how does the spring constant of each half compare to the original spring constant k?", "options": ["It remains equal to k.", "It becomes k/2.", "It becomes 2k.", "It becomes 4k."], "answer": 2, "explanation": "The spring constant k of a spring is inversely proportional to its length (k * L = constant). This is because a shorter spring is stiffer and requires more force to stretch by the same unit distance. When cut into two equal halves, the length is halved, so the spring constant of each half becomes exactly double, i.e., 2k. Exam Alignment: Connects to the spring properties tested in CDS GK Physics (Q22)."}, {"q": "In timekeeping, the 'mean solar day' is the average interval between two successive transits of the Sun across the meridian. Why does the actual length of a solar day vary slightly over the course of the year?", "options": ["Because the speed of Earth's rotation on its axis fluctuates due to tidal friction.", "Because the Earth's orbit is elliptical, causing its orbital speed around the Sun to vary, and its rotational axis is tilted relative to its orbital plane.", "Because the Sun's core density fluctuates periodically.", "Because the Moon's gravitational pull accelerates the Earth's orbit during solar eclipses."], "answer": 1, "explanation": "The variation in the length of the apparent solar day is caused by two factors: the eccentricity of the Earth's orbit (Kepler's Second Law, which means Earth moves faster when closer to the Sun) and the obliquity of the ecliptic (the tilt of the Earth's axis of rotation relative to its orbital plane). This makes the solar day an unstable time standard, which is why highly stable cesium atomic clocks are used instead. Exam Alignment: Provides the background for precision time measurement tested in NDA 2025-I."}, {"q": "A fascinating coincidence exists among the fundamental ratios of the universe. What is the approximate value of the ratio of the longest to the shortest time intervals, and how does it relate to the mass ratios?", "options": ["The ratio of time intervals is about 10^41, and the ratio of the largest to the smallest mass in the universe is about (10^41)².", "The ratio of time intervals is about 10^20, and the mass ratio is about 10^40.", "The ratio of time intervals is 10^8, and the mass ratio is 10^16.", "Both ratios are exactly equal to the speed of light in vacuum."], "answer": 0, "explanation": "According to the NCERT Chapter 2 textbook [136], the ratio of the longest time interval (age of the universe) to the shortest (lifetime of an unstable particle) is about 10^41. Remarkably, the ratio of the largest mass (observable universe) to the smallest mass (electron) is about (10^41)² = 10^82. This large number (10^41) is a famous cosmological value known as Dirac's large number. Exam Alignment: Grounded in standard NCERT Section 2.5 cosmic data [136]."}, {"q": "With what level of precision do cesium atomic clocks operate in modern standard laboratories, as described in the NCERT textbook?", "options": ["They lose or gain no more than 1 second in 100 years.", "They maintain an accuracy of 1 part in 10^11 to 10^12, meaning a difference of only a few seconds over millions of years.", "They have an uncertainty of 1 part in 10^5, similar to a standard quartz wristwatch.", "They are only accurate to 1 part in 10^3 due to the radioactive decay of cesium."], "answer": 1, "explanation": "According to NCERT Chapter 2 answers [226, 452], cesium atomic clocks are extremely precise, maintaining an accuracy of about 1 part in 10^11 to 10^12. This means that the time difference between two such clocks would be less than a fraction of a second even after running continuously for thousands of years. Exam Alignment: Directly grounded in NCERT Chapter 2 reference data [226, 452]."}, {"q": "The mass of astronomical bodies like Jupiter or the Sun cannot be measured directly. By what scientific principle do physicists calculate their masses?", "options": ["By measuring their surface temperatures and applying Stefan-Boltzmann's law.", "By measuring the orbital period and radius of their orbiting satellites and applying Kepler's Third Law combined with Newton's Law of Gravitation.", "By measuring their visual brightness from Earth and multiplying by their volume.", "By measuring the electrostatic force exerted on cosmic rays."], "answer": 1, "explanation": "To calculate the mass of a central body (like the Sun or Jupiter), we use the orbital parameters of a satellite revolving around it. Since the centripetal force is provided by gravity: G*M*m/r² = m*(4*pi²/T²)*r, we get M = 4*pi²*r³ / (G*T²). By measuring the orbital radius r and period T, we can calculate the central mass M precisely. Exam Alignment: Inspired by NCERT Chapter 8 gravitational mass calculations [435, 442]."}]}, {"topicNum": "4", "topicName": "Accuracy, Precision & Least Count", "questions": [{"q": "A student measures the acceleration due to gravity g (standard value 9.81 m/s²) using two different pendulums. Instrument X yields 9.54, 9.55, and 9.53 m/s². Instrument Y yields 9.7, 9.9, and 9.6 m/s². Which of the following statements correctly evaluates their measurements?", "options": ["Instrument X is more accurate but less precise than Instrument Y.", "Instrument X is more precise but less accurate than Instrument Y.", "Both instruments have the same accuracy and precision.", "Instrument X has high systematic error and low random error, while Y has low systematic error and low random error."], "answer": 1, "explanation": "Accuracy refers to how close a measured value is to the true value (mean of Y is 9.73, closer to 9.81, so Y is more accurate). Precision refers to the limit of resolution of the instrument, shown by the closeness of repeated measurements (X values are spread by only 0.02, while Y values are spread by 0.3, so X is highly precise). Thus, X is more precise but less accurate. Exam Alignment: Grounded in the core definitions of NCERT Section 2.6 [137]."}, {"q": "A clinical thermometer has its scale designed to measure human body temperature. A student measures their temperature by placing it under the armpit and records 36.2°C, whereas the actual oral temperature is 37.0°C. What type of error does this represent?", "options": ["Random error, because the value changes dynamically.", "Systematic error due to imperfection in experimental technique.", "Instrumental error, because the glass tube has expanded.", "Personal error, because the student misread the meniscus."], "answer": 1, "explanation": "According to the NCERT textbook [137], systematic errors arise from a constant bias in one direction. Placing a thermometer under the armpit consistently yields a temperature lower than the actual internal body temperature due to heat loss to the surrounding air. This is a classic example of a systematic error due to 'imperfection in experimental technique or procedure'. Exam Alignment: Aligned with the error classification tested in NDA 2025-I."}, {"q": "A spherometer is used to measure the thickness of a thin glass plate. If the pitch of the spherometer screw is 1.0 mm and there are 200 divisions on its circular scale, what is the least count of this spherometer?", "options": ["0.01 mm", "0.005 mm", "0.001 mm", "0.05 mm"], "answer": 1, "explanation": "The least count of a screw-based instrument (spherometer or screw gauge) is defined as: Least Count = Pitch / Number of circular scale divisions. Substituting the values: Least Count = 1.0 mm / 200 = 0.005 mm = 5.0 x 10^-6 m (or 5 micrometers). Exam Alignment: Directly based on the spherometer exercise in NCERT Section 2.6 [166]."}, {"q": "A standard laboratory Vernier Caliper has a main scale graduated in millimeters (1 MSD = 1 mm). If 10 divisions of the Vernier scale coincide exactly with 9 divisions of the main scale, what is the least count of this caliper?", "options": ["0.1 mm", "0.01 mm", "0.05 mm", "0.2 mm"], "answer": 0, "explanation": "The least count (or Vernier constant) is given by: LC = 1 MSD - 1 VSD. We are given 10 VSD = 9 MSD, which means 1 VSD = 0.9 MSD. Since 1 MSD = 1 mm: LC = 1 mm - 0.9 mm = 0.1 mm = 0.01 cm. This is the standard resolution of a basic school Vernier caliper. Exam Alignment: Grounded in the Vernier caliper measurement principles in NCERT Section 2.6 [166]."}, {"q": "A micrometer screw gauge is used to measure the diameter of a thin wire. If the screw is rotated, it advances by 0.5 mm on the main scale for one complete rotation. If there are 50 divisions on the circular scale, what is the least count of the instrument?", "options": ["0.01 mm", "0.1 mm", "0.02 mm", "0.05 mm"], "answer": 0, "explanation": "The pitch of the screw is the distance moved in one rotation, which is 0.5 mm. The number of circular divisions is 50. Therefore, the least count is: Least Count = Pitch / Circular Divisions = 0.5 mm / 50 = 0.01 mm = 10^-5 m. This is a very common laboratory standard. Exam Alignment: Aligned with standard micrometer screw gauge problems in NCERT Section 2.6 [166]."}, {"q": "A spherometer is placed on a flat glass plate to determine its zero error. When the three outer legs rest on the plate, the central screw must be turned to touch the plate. If the triangular base legs are separated by a distance l and the height of the central screw above the plane is h, what is the formula for the radius of curvature R of a spherical surface measured by this spherometer?", "options": ["R = l²/6h + h/2", "R = l²/3h + h", "R = 6h/l² + h/2", "R = sqrt(l² + h²)"], "answer": 0, "explanation": "By geometric properties of a sphere and the spherometer design, the radius of curvature R of the spherical surface is given by the standard formula: R = l² / (6h) + h / 2, where l is the mean distance between any two outer legs of the spherometer and h is the sagitta (height of the central screw above the plane of the three legs). This is verified by classical geometry. Exam Alignment: Directly links to spherometer physics in NCERT Section 2.6 [166]."}, {"q": "A student is recording measurements with a Vernier Caliper. When the jaws of the caliper are closed completely, the zero of the Vernier scale lies slightly to the right of the zero of the main scale, and the 3rd division of the Vernier scale coincides with a main scale division. If the least count is 0.1 mm, what is the zero error, and how should it be corrected?", "options": ["Zero Error = -0.3 mm; it must be added to the observed reading.", "Zero Error = +0.3 mm; it must be subtracted from the observed reading.", "Zero Error = +0.3 mm; it must be added to the observed reading.", "Zero Error = -0.3 mm; it must be subtracted from the observed reading."], "answer": 1, "explanation": "When the Vernier zero lies to the right of the main scale zero, the instrument reads a non-zero positive value even when closed. This is a 'positive zero error', calculated as: Error = + (Coinciding Division x Least Count) = + (3 x 0.1 mm) = +0.3 mm. To get the true reading, we must subtract this excess value: True Reading = Observed Reading - (Zero Error). Thus, we subtract +0.3 mm. Exam Alignment: Standard experimental trap tested in class 11 labs and NCERT."}, {"q": "When the jaws of a micrometer screw gauge are closed, the zero of the circular scale lies 4 divisions below the reference line of the main scale. If the least count is 0.01 mm, what is the zero error, and what is its correct mathematical sign?", "options": ["Zero Error = -0.04 mm", "Zero Error = +0.04 mm", "Zero Error = +0.40 mm", "Zero Error = -0.40 mm"], "answer": 1, "explanation": "When the circular scale zero lies below the reference line on the main scale, the screw is not turned enough to reach the true zero, so it reads a positive value. This is a positive zero error: Error = + (4 x 0.01 mm) = +0.04 mm. It must be subtracted from the observed reading to obtain the actual corrected thickness. Exam Alignment: Grounded in standard zero error correction rules."}, {"q": "While using a screw gauge, a student notices that turning the screw in one direction and then immediately reversing it causes a small lag before the screw moves backward on the linear scale. What is this error called, and how is it minimized in practice?", "options": ["Zero error; minimized by applying oil to the gears.", "Backlash error; minimized by always turning the screw in the same direction to take a final reading.", "Imperfection error; minimized by taking a larger number of circular divisions.", "Elastic fatigue; minimized by replacing the steel screw."], "answer": 1, "explanation": "Backlash error arises in screw-based instruments due to wear and tear or loose fitting between the screw and the nut threads, creating a mechanical gap. When we reverse the direction of rotation, the screw does not move immediately. To minimize this, the screw should always be turned in the same direction (usually clockwise) when bringing it to the final touch/reading. Exam Alignment: Standard laboratory error concept."}, {"q": "When reading the scale of a thermometer or a burette, a student fails to align their line of sight perpendicular to the meniscus of the liquid, resulting in a slightly shifted reading. What type of error is this, and how can it be avoided?", "options": ["Random error; avoided by averaging 100 measurements.", "Parallax error; avoided by keeping the eye exactly perpendicular and level with the meniscus.", "Instrumental error; avoided by recalibrating the thermometer.", "Least count error; avoided by using a digital sensor."], "answer": 1, "explanation": "This is a classic 'parallax error', which is a personal/systematic error. It occurs due to the relative shift in the apparent position of the meniscus against the scale when viewed from an angle. It is avoided by aligning the line of sight exactly perpendicular and level with the scale at the meniscus. Exam Alignment: Directly aligned with NCERT Section 2.6 error guides [137]."}, {"q": "A physics student wants to determine the diameter of a thin copper wire. Why is taking a set of 100 measurements of the diameter expected to yield a more reliable estimate than a set of 5 measurements?", "options": ["Taking more measurements increases the least count of the Vernier caliper.", "Taking more measurements completely eliminates all systematic and zero errors.", "Taking n measurements reduces the random error by a factor of 1/sqrt(n) according to statistical probability.", "It is a psychological trick to keep the student focused in the lab."], "answer": 2, "explanation": "Random errors occur irregularly and are unbiased in sign or magnitude. According to statistics, if we take a very large number of measurements n, the random error in the arithmetic mean decreases by a factor of 1/sqrt(n). For 100 measurements, the random error is reduced by 1/sqrt(100) = 1/10 (or 10 times less), making the mean value highly reliable. Exam Alignment: Directly answers NCERT Exercise 2.8(c) [166]."}, {"q": "The resolution of an instrument determines its precision. If we compare a standard meter scale (least count 1 mm), a Vernier Caliper (least count 0.1 mm), and a Screw Gauge (least count 0.01 mm), which of the following is correct?", "options": ["The meter scale is the most precise, while the screw gauge is the most accurate.", "The screw gauge has the highest precision, meaning it can resolve smaller subdivisions of length.", "Precision is completely independent of the least count.", "All three instruments will always yield the same accuracy."], "answer": 1, "explanation": "Precision refers to the limit or resolution of the measuring instrument. It is directly determined by the instrument's least count (smallest measurable quantity). The screw gauge, with the smallest least count (0.01 mm), can resolve the smallest fractions of length, making it the most precise of the three. Exam Alignment: Grounded in precision concepts of NCERT Section 2.6 [137]."}, {"q": "A student is designing a custom Vernier caliper. If the main scale is graduated in 0.5 mm divisions, and 20 divisions of the Vernier scale coincide with 19 divisions of the main scale, what is the least count of this custom instrument?", "options": ["0.025 mm", "0.05 mm", "0.1 mm", "0.01 mm"], "answer": 0, "explanation": "Here, 1 MSD = 0.5 mm. 20 VSD = 19 MSD, so 1 VSD = (19/20) MSD = 0.95 MSD. Least Count = 1 MSD - 1 VSD = 1 MSD * (1 - 19/20) = (1/20) MSD = 0.5 mm / 20 = 0.025 mm (or 0.0025 cm). Exam Alignment: Extends standard Vernier Caliper least count questions."}, {"q": "In a laboratory, a student tries to arbitrarily increase the accuracy of a micrometer screw gauge by increasing the number of circular divisions to 1000 while keeping the pitch at 1.0 mm. Why is this practically ineffective beyond a certain limit?", "options": ["Because the pitch of the screw increases proportionally.", "Because the resolution of the human eye cannot resolve extremely close graduations on the circular scale, and mechanical play limits accuracy.", "Because circular divisions must always be a multiple of 100.", "Because the speed of rotation decreases the precision."], "answer": 1, "explanation": "According to the NCERT textbook [166], we cannot arbitrarily increase the precision of a screw gauge by simply increasing the circular divisions. First, the human eye cannot resolve graduations that are spaced too closely. Second, mechanical imperfections, play in threads (backlash), and friction set a physical limit to the precision of any mechanical screw. Exam Alignment: Directly answers NCERT Exercise 2.8(b) [166]."}, {"q": "A standard stopwatch has a mechanical resolution of 0.1 s. A student measures the time for 100 oscillations of a pendulum to be 90.0 s. What is the limit of resolution error in measuring this time?", "options": ["1.0 s", "0.1 s", "0.01 s", "0.001 s"], "answer": 1, "explanation": "The maximum possible error in any direct measurement due to the resolution of the instrument is equal to its least count. For a stopwatch with a resolution of 0.1 s, the limit of resolution error in the measured time is exactly 0.1 s. Exam Alignment: Aligned with pendulum timing exercises in NCERT Section 2.6 [140]."}, {"q": "A student measures the diameter of a steel ball with a Vernier caliper of least count 0.1 mm. If the main scale reads 1.2 cm and the 4th Vernier division coincides with a main scale division, what is the observed diameter?", "options": ["1.24 cm", "1.204 cm", "1.6 cm", "1.24 mm"], "answer": 0, "explanation": "Observed Reading = Main Scale Reading (MSR) + (Coinciding Vernier Division x LC). Here, MSR = 1.2 cm = 12 mm. LC = 0.1 mm. Coinciding division = 4. Reading = 12 mm + (4 x 0.1 mm) = 12.4 mm = 1.24 cm. Exam Alignment: Basic practical lab concept."}, {"q": "If a micrometer screw gauge has a negative zero error of -0.02 mm, and the observed reading for a wire's thickness is 1.48 mm, what is the true corrected thickness?", "options": ["1.46 mm", "1.50 mm", "1.48 mm", "1.44 mm"], "answer": 1, "explanation": "True Reading = Observed Reading - (Zero Error with sign). Here, Observed Reading = 1.48 mm, Zero Error = -0.02 mm. True Reading = 1.48 mm - (-0.02 mm) = 1.48 mm + 0.02 mm = 1.50 mm. Exam Alignment: Classic micrometer zero correction numerical."}]}, {"topicNum": "5", "topicName": "Error Analysis & Percentage Error", "questions": [{"q": "What is the fundamental difference between systematic errors and random errors in experimental physics?", "options": ["Systematic errors can be minimized by taking a large number of readings, whereas random errors cannot.", "Systematic errors are unidirectional (either positive or negative) and arise from identifiable causes, while random errors occur irregularly and are unpredictable in sign and magnitude.", "Systematic errors are always larger in magnitude than random errors.", "Random errors are caused solely by temperature fluctuations, whereas systematic errors are caused by gravitational changes."], "answer": 1, "explanation": "Systematic errors are those errors that tend to be in one direction, either positive or negative. They arise from instrumental design defects, calibration errors, or personal bias. Random errors, on the other hand, occur irregularly and unpredictably due to random fluctuations in experimental conditions (like temperature, voltage, or mechanical vibrations) or observer limitations. Taking the arithmetic mean of multiple readings minimizes random errors but has no effect on systematic errors [164-165]."}, {"q": "If a student repeats an observation 100 times instead of 5 times, by what factor is the magnitude of the random error in the average value expected to change?", "options": ["It remains completely unchanged.", "It is reduced by a factor of 20.", "It is reduced by a factor of 10.", "It is reduced by a factor of 4.47."], "answer": 3, "explanation": "Mathematically, the random error in the arithmetic mean of $n$ measurements is proportional to $1/\\sqrt{n}$. When the number of observations increases from 5 to 100 (which is an increase by a factor of 20), the random error is reduced by a factor of $\\sqrt{20} = \\sqrt{4 \\times 5} = 2\\sqrt{5} \\approx 4.47$. Thus, the error decreases by a factor of approximately 4.47, making the mean value much closer to the true value [165, 214]."}, {"q": "A standard thermometer reads $101.5^\\circ\\text{C}$ at the boiling point of pure water under standard atmospheric pressure (STP). What category of error does this represent, and how can it be eliminated?", "options": ["Personal error; eliminated by changing the observer.", "Random error; eliminated by taking the mean of 50 separate readings.", "Instrumental systematic error; eliminated by re-calibrating the thermometer scale.", "Least count error; eliminated by using a digital sensor with higher resolution."], "answer": 2, "explanation": "The boiling point of water at STP is exactly $100^\\circ\\text{C}$. If a thermometer consistently reads $101.5^\\circ\\text{C}$ at this point, it suffers from a systematic calibration error (an instrumental error). Because it is a consistent offset in one direction, it cannot be reduced by taking averages of multiple readings. It can only be eliminated by re-calibrating the instrument or applying a mathematical correction factor [164]."}, {"q": "Two physical quantities are measured as $A = 12.0 \\pm 0.3\\text{ cm}$ and $B = 8.0 \\pm 0.2\\text{ cm}$. What is the absolute error in their sum ($Z = A + B$)?", "options": ["$0.5\\text{ cm}$", "$0.1\\text{ cm}$", "$0.36\\text{ cm}$", "$0.05\\text{ cm}$"], "answer": 0, "explanation": "When two quantities are added, the absolute error in the final result is the sum of the individual absolute errors of the components. Mathematically, for $Z = A + B$, we have $\\Delta Z = \\Delta A + \\Delta B$. Substituting the values: $\\Delta Z = 0.3\\text{ cm} + 0.2\\text{ cm} = 0.5\\text{ cm}$. Therefore, the sum is reported as $20.0 \\pm 0.5\\text{ cm}$ [173]."}, {"q": "For the same measured values, $A = 12.0 \\pm 0.3\\text{ cm}$ and $B = 8.0 \\pm 0.2\\text{ cm}$, what is the absolute error in their difference ($Y = A - B$)?", "options": ["$0.1\\text{ cm}$", "$0.5\\text{ cm}$", "$0.25\\text{ cm}$", "$0.05\\text{ cm}$"], "answer": 1, "explanation": "A common trap is to subtract errors when taking a difference of two quantities. However, in any arithmetic operation (addition or subtraction), absolute errors always add up to maximize the potential uncertainty. For $Y = A - B$, the maximum absolute error is $\\Delta Y = \\Delta A + \\Delta B = 0.3\\text{ cm} + 0.2\\text{ cm} = 0.5\\text{ cm}$ [173-174]."}, {"q": "The temperatures of two bodies measured by a laboratory thermometer are $t_1 = 20.0^\\circ\\text{C} \\pm 0.5^\\circ\\text{C}$ and $t_2 = 50.0^\\circ\\text{C} \\pm 0.5^\\circ\\text{C}$. What is the temperature difference and the percentage error in this difference?", "options": ["$30.0^\\circ\\text{C} \\pm 0.0^\\circ\\text{C}$ and $0\\%$ error", "$30.0^\\circ\\text{C} \\pm 1.0^\\circ\\text{C}$ and $3.3\\%$ error", "$30.0^\\circ\\text{C} \\pm 1.0^\\circ\\text{C}$ and $1.0\\%$ error", "$30.0^\\circ\\text{C} \\pm 0.5^\\circ\\text{C}$ and $1.67\\%$ error"], "answer": 1, "explanation": "First, calculate the temperature difference: $\\Delta t = t_2 - t_1 = 50.0^\\circ\\text{C} - 20.0^\\circ\\text{C} = 30.0^\\circ\\text{C}$. Next, add the absolute errors: $\\Delta (\\Delta t) = 0.5^\\circ\\text{C} + 0.5^\\circ\\text{C} = 1.0^\\circ\\text{C}$. Now, find the percentage error: $(\\Delta (\\Delta t) / \\Delta t) \\times 100\\% = (1.0 / 30.0) \\times 100\\% \\approx 3.33\\%$. This matches the experimental error pattern detailed in NCERT Example 2.8 [174]."}, {"q": "The potential difference across a resistor is measured as $V = (100 \\pm 5)\\text{ V}$ and the current passing through it is $I = (10.0 \\pm 0.2)\\text{ A}$. What is the percentage error in the calculated resistance $R = V/I$?", "options": ["$3\\%$", "$5\\%$", "$7\\%$", "$2\\%$"], "answer": 2, "explanation": "According to Ohm's Law, $R = V/I$. Since resistance is a quotient, the relative error in $R$ is the sum of the relative errors in $V$ and $I$: $\\Delta R/R = \\Delta V/V + \\Delta I/I$. Calculating the percentage errors: $\\%\\text{ error in } V = (5 / 100) \\times 100\\% = 5\\%$. $\\%\\text{ error in } I = (0.2 / 10.0) \\times 100\\% = 2\\%$. Total percentage error in $R = 5\\% + 2\\% = 7\\%$. This matches NCERT Example 2.9 [176]."}, {"q": "The mass and volume of a body are measured as $M = (22.42 \\pm 0.1)\\text{ g}$ and $V = (4.7 \\pm 0.1)\\text{ cm}^3$. What is the relative error in the density of the body?", "options": ["$0.026$", "$0.045$", "$0.005$", "$0.021$"], "answer": 0, "explanation": "Density is given by $\\rho = M/V$. The maximum relative error is: $\\Delta \\rho / \\rho = \\Delta M / M + \\Delta V / V$. Substituting the measured values: $\\Delta M / M = 0.1 / 22.42 \\approx 0.00446$. $\\Delta V / V = 0.1 / 4.7 \\approx 0.02128$. Adding these gives the total relative error: $\\Delta \\rho / \\rho = 0.00446 + 0.02128 = 0.02574 \\approx 0.026$. Thus, the fractional uncertainty in density is roughly $2.6\\%$ [173]."}, {"q": "A student measures the value of a physical constant $Y$ using the formula $Y = \\frac{a^3 b^2}{c \\sqrt{d}}$. If the percentage errors of measurement in $a, b, c,$ and $d$ are $1\\%, 2\\%, 3\\%,$ and $4\\%$ respectively, what is the maximum percentage error in the calculated value of $Y$?", "options": ["$12\\%$", "$16\\%$", "$10\\%$", "$14\\%$"], "answer": 0, "explanation": "For a quantity $Y = a^3 b^2 c^{-1} d^{-1/2}$, the fractional error relation is: $\\Delta Y/Y = 3(\\Delta a/a) + 2(\\Delta b/b) + 1(\\Delta c/c) + \\frac{1}{2}(\\Delta d/d)$. Note that negative powers in the denominator still contribute positively to maximize the error bounds. Substituting the given percentage errors: $\\%\\text{ error in } Y = 3(1\\%) + 2(2\\%) + 1(3\\%) + \\frac{1}{2}(4\\%) = 3\\% + 4\\% + 3\\% + 2\\% = 12\\%$. This represents the exact power-combination rule tested in NDA 2025-I [216]."}, {"q": "The length of a simple pendulum is measured with a scale of least count $1\\text{ mm}$, and the value is recorded as $L = 20.0\\text{ cm}$. The time for 100 oscillations is measured with a stopwatch of resolution $1\\text{ s}$ to be $t = 90\\text{ s}$. What is the percentage error in the calculated value of $g$ ($g = 4\\pi^2 L / T^2$)?", "options": ["$1.5\\%$", "$2.7\\%$", "$3.2\\%$", "$4.0\\%$"], "answer": 1, "explanation": "The formula is $g = 4\\pi^2 L / T^2$. The time period $T$ is $t/n$, meaning $\\Delta T/T = \\Delta t/t$. Thus, the maximum relative error is: $\\Delta g/g = \\Delta L/L + 2(\\Delta t/t)$. Substitute the given least count values: $\\Delta L = 0.1\\text{ cm}$ (since least count is $1\\text{ mm}$), so $\\Delta L/L = 0.1 / 20.0 = 0.005$. $\\Delta t = 1\\text{ s}$, so $\\Delta t/t = 1 / 90 \\approx 0.0111$. Total relative error $\\Delta g/g = 0.005 + 2(1/90) = 0.005 + 0.0222 = 0.0272$. In percentage: $2.72\\% \\approx 2.7\\%$. This matches NCERT standard methods [178]."}, {"q": "An experiment measures the mass of a copper block. If the scale has a zero error of $+0.15\\text{ g}$, what type of error does this introduce, and how will it affect the arithmetic mean of multiple trials?", "options": ["Personal error; it cancels out over 50 trials.", "Systematic error; it introduces a constant offset that cannot be removed by taking averages of multiple trials.", "Random error; it is minimized by repeating the trials.", "Least count error; it limits the precision of each individual trial."], "answer": 1, "explanation": "Zero error is a classic example of an instrumental systematic error. Since the scale always reads $0.15\\text{ g}$ higher than the actual mass, every single measurement has the same positive bias. Taking the average of multiple trials will not reduce this error; it will simply preserve the $+0.15\\text{ g}$ offset. It can only be corrected by mathematically subtracting $0.15\\text{ g}$ from all recorded values [164]."}, {"q": "A standard resistor is labeled as $R = 200 \\pm 3\\text{ ohms}$ and a second resistor is labeled as $R = 400 \\pm 4\\text{ ohms}$. If these two resistors are connected in series, what is the equivalent resistance and the absolute error in this combination?", "options": ["$600 \\pm 1\\text{ ohm}$", "$600 \\pm 5\\text{ ohms}$", "$600 \\pm 7\\text{ ohms}$", "$600 \\pm 12\\text{ ohms}$"], "answer": 2, "explanation": "For a series connection of resistors, the equivalent resistance is the simple sum of the individual values: $R_s = R_1 + R_2 = 200 + 400 = 600\\text{ ohms}$. The absolute error in the sum is the sum of the individual absolute errors: $\\Delta R_s = \\Delta R_1 + \\Delta R_2 = 3\\text{ ohms} + 4\\text{ ohms} = 7\\text{ ohms}$. Thus, the equivalent resistance is reported as $600 \\pm 7\\text{ ohms}$ [176-177]."}, {"q": "Using the same resistors, $R_1 = 100 \\pm 3\\text{ ohms}$ and $R_2 = 200 \\pm 4\\text{ ohms}$, connected in parallel, what is the absolute error in their equivalent resistance ($R_p$)?", "options": ["$1.8\\text{ ohms}$", "$7.0\\text{ ohms}$", "$0.5\\text{ ohm}$", "$3.5\\text{ ohms}$"], "answer": 0, "explanation": "For parallel resistors, the equivalent resistance is $R_p = (R_1 R_2) / (R_1 + R_2) = (100 \\times 200) / (100 + 200) = 66.7\\text{ ohms}$. The fractional error in the parallel combination is governed by the derivative formula: $\\Delta R_p / R_p^2 = \\Delta R_1 / R_1^2 + \\Delta R_2 / R_2^2$. Solving for $\\Delta R_p$: $\\Delta R_p = R_p^2 [\\Delta R_1 / R_1^2 + \\Delta R_2 / R_2^2] = (66.7)^2 [3/100^2 + 4/200^2] = 4448.9 [0.0003 + 0.0001] = 4448.9 \\times 0.0004 \\approx 1.8\\text{ ohms}$. This matches the detailed derivation in NCERT Example 2.10 [177]."}, {"q": "The kinetic energy ($K$) of a moving vehicle depends on its mass ($m$) and velocity ($v$). If the percentage error in measuring the mass is $2\\%$ and in measuring the velocity is $3\\%$, what is the maximum percentage error in the calculated kinetic energy?", "options": ["$5\\%$", "$8\\%$", "$11\\%$", "$6\\%$"], "answer": 1, "explanation": "Kinetic energy is defined as $K = \\frac{1}{2} m v^2$. The fractional error equation is: $\\Delta K / K = \\Delta m / m + 2(\\Delta v / v)$. Note that the constant fraction $\\frac{1}{2}$ is an exact number and carries no error. Substituting the given percentage errors: $\\%\\text{ error in } K = 2\\% + 2(3\\%) = 2\\% + 6\\% = 8\\%$. This concept is highly tested in both NDA and CDS exams [184, 352]."}, {"q": "An electric heater is rated at a resistance of $R = 40 \\pm 2\\text{ ohms}$. If a current of $I = 5.0 \\pm 0.1\\text{ A}$ passes through it, what is the maximum percentage error in the calculated power dissipation ($P = I^2 R$)?", "options": ["$6\\%$", "$7\\%$", "$9\\%$", "$4\\%$"], "answer": 2, "explanation": "The formula for power is $P = I^2 R$. The fractional error relationship is: $\\Delta P/P = 2(\\Delta I/I) + \\Delta R/R$. First, calculate the individual percentage errors: $\\%\\text{ error in } I = (0.1 / 5.0) \\times 100\\% = 2\\%$. $\\%\\text{ error in } R = (2 / 40) \\times 100\\% = 5\\%$. Combining these: $\\%\\text{ error in } P = 2(2\\%) + 5\\% = 4\\% + 5\\% = 9\\%$. Thus, the maximum percentage error in power is $9\\%$ [176]."}, {"q": "The radius of a solid copper sphere is measured to be $R = (5.00 \\pm 0.05)\\text{ cm}$. What is the maximum percentage error in the calculated volume of the sphere?", "options": ["$1\\%$", "$2\\%$", "$3\\%$", "$5\\%$"], "answer": 2, "explanation": "The volume of a sphere is $V = \\frac{4}{3}\\pi R^3$. Since $\\frac{4}{3}\\pi$ is a constant, the relative error depends entirely on the radius: $\\Delta V/V =
