ange over time?", "options": ["It increases linearly with time.", "It decreases linearly with time.", "It remains completely constant.", "It is zero."], "answer": 2, "explanation": "For a particle moving in a straight line, \\(l = m v d\\), where d is the perpendicular distance from the origin to the line of motion. Since m, v, and d are all constant over time, the angular momentum remains completely constant [310]."}, {"q": "If the angular momentum of a system is given by \\(\\vec{l} = (3t^2\\hat{i} - 4t\\hat{j})\\text{ kg m^2/s}\\), what is the torque acting on the system at \\(t = 2\\text{ s}\\)?", "options": ["\\(12\\hat{i} - 4\\hat{j}\\)", "\\(6\\hat{i} - 4\\hat{j}\\)", "\\(12\\hat{i} + 4\\hat{j}\\)", "\\(6\\hat{i} + 4\\hat{j}\\)"], "answer": 0, "explanation": "Since \\(\\vec{\\tau} = \\frac{d\\vec{l}}{dt}\\), differentiating \\(\\vec{l}\\) with respect to t gives \\(\\vec{\\tau} = 6t\\hat{i} - 4\\hat{j}\\). At \\(t=2\\text{ s}\\), \\(\\vec{\\tau} = 12\\hat{i} - 4\\hat{j}\\) [310]."}, {"q": "A force of 5 N is applied perpendicular to a door at a distance of 80 cm from the hinges. What is the magnitude of the torque produced?", "options": ["400 N m", "4.0 N m", "40 N m", "0.4 N m"], "answer": 1, "explanation": "Distance \\(r = 0.8\\text{ m}\\). Since force is perpendicular, \\(\\theta = 90^\\circ\\), giving \\(\\tau = r F \\sin(90) = 0.8 \\times 5 = 4.0\\text{ N m}\\) [310]."}, {"q": "Why is the handle of a door always placed at the maximum possible distance from the hinges?", "options": ["To minimize the required force by maximizing the perpendicular lever arm.", "To minimize the torque required to open the door.", "To increase the moment of inertia of the door.", "To prevent axial friction at the hinges."], "answer": 0, "explanation": "To produce a given torque \\(\\tau\\) to rotate the door, increasing the distance \\(r\\) decreases the required force \\(F\\) (since \\(F = \\tau/r\\)) [313]."}, {"q": "A particle of mass m is performing uniform circular motion in a circle of radius R with constant speed v. What is the magnitude of its angular momentum about the center of the circle?", "options": ["m v R", "m v^2 R", "m v R^2", "Zero"], "answer": 0, "explanation": "For circular motion, the position vector r is radial and the velocity vector v is tangential, making them perpendicular (\\(\\theta = 90^\\circ\\)). The angular momentum is \\(l = r p \\sin(90) = R m v = m v R\\) [310]."}, {"q": "For a simple pendulum executing small oscillations, where is the torque due to gravity about the suspension pivot maximum?", "options": ["At the mean position (equilibrium).", "At the extreme positions (maximum displacement).", "It is constant throughout the motion.", "It is always zero."], "answer": 1, "explanation": "Torque \\(\\tau = L m g \\sin\\theta\\). This is zero at the mean position (\\(\\theta = 0\\)) and maximum at the extreme positions where the angle of displacement \\(\\theta\\) is maximum [310]."}, {"q": "If a particle's position vector is parallel to its momentum vector, what is its angular momentum about the origin?", "options": ["Maximum", "Zero (null vector)", "It increases with mass.", "It depends on the coordinate quadrants."], "answer": 1, "explanation": "Since \\(\\vec{l} = \\vec{r} \\times \\vec{p}\\), if the vectors are parallel, their cross product is zero. Thus, the angular momentum is a null vector [310]."}, {"q": "A particle of mass 1 kg is projected vertically upwards with a speed of 20 m/s from a point 5 m away from a tall tower. What is the magnitude of its angular momentum about the base of the tower at the highest point of its flight?", "options": ["100 kg m^2/s", "Zero", "50 kg m^2/s", "200 kg m^2/s"], "answer": 1, "explanation": "At the highest point, the vertical velocity of the particle is zero. Since it was projected vertically upwards, it has no horizontal velocity component. Thus, at the peak, its velocity \\(v = 0\\), making its linear momentum \\(p = 0\\) and angular momentum zero [310]."}, {"q": "A constant force \\(\\vec{F} = (2\\hat{i} + 3\\hat{j})\\text{ N}\\) acts on a particle. What is the torque acting on the particle when it is at the coordinates \\((3, -2)\\)?", "options": ["13k", "-13k", "5k", "Zero (null vector)"], "answer": 0, "explanation": "Position vector \\(\\vec{r} = 3\\hat{i} - 2\\hat{j}\\). Torque \\(\\vec{\\tau} = \\vec{r} \\times \\vec{F} = (3\\hat{i} - 2\\hat{j}) \\times (2\\hat{i} + 3\\hat{j}) = 3(3)\\hat{k} - (-2)(2)\\hat{k} = 9\\hat{k} + 4\\hat{k} = 13\\hat{k}\\) [310]."}, {"q": "A planet of mass m orbits the Sun of mass M in an elliptical path. If the distance of the planet from the Sun at perihelion (closest approach) is \\(r_p\\) and at aphelion (farthest approach) is \\(r_a\\), what is the ratio of its speeds \\(v_p / v_a\\)?", "options": ["1:1", "\\(r_p : r_a\\)", "\\(r_a : r_p\\)", "\\(r_a^2 : r_p^2\\)"], "answer": 2, "explanation": "By conservation of angular momentum about the Sun: \\(m v_p r_p = m v_a r_a \\Rightarrow v_p r_p = v_a r_a \\Rightarrow v_p / v_a = r_a / r_p\\) [333]."}, {"q": "If the kinetic energy of a particle in uniform circular motion of radius R is K, what is the magnitude of its angular momentum?", "options": ["\\(\\sqrt{2mK} R\\)", "\\(\\sqrt{2mK} / R\\)", "\\(2mK R^2\\)", "\\(mK R\\)"], "answer": 0, "explanation": "Since \\(p = \\sqrt{2mK}\\) and \\(l = R p\\) (since position and velocity are perpendicular), substituting \\(p\\) yields \\(l = \\sqrt{2mK} R\\) [310]."}, {"q": "What is the angle between the angular momentum vector \\(\\vec{l}\\) and the linear velocity vector \\(\\vec{v}\\) of a particle in circular motion?", "options": ["0 degrees", "45 degrees", "90 degrees", "180 degrees"], "answer": 2, "explanation": "Since \\(\\vec{l} = \\vec{r} \\times \\vec{p}\\), the angular momentum vector \\(\\vec{l}\\) is perpendicular to the plane containing \\(\\vec{r}\\) and \\(\\vec{p}\\) (which is parallel to \\(\\vec{v}\\)). Thus, \\(\\vec{l}\\) is strictly perpendicular to \\(\\vec{v}\\) (90 degrees) [310]."}, {"q": "A particle of mass m is projected with speed u at an angle \\(\\theta\\) to the horizontal from the origin. What is the magnitude of the torque due to gravity acting on the particle about the origin at the instant it reaches its maximum height?", "options": ["\\(m u^2 \\sin\\theta \\cos\\theta\\)", "\\(0.5 m u^2 \\sin(2\\theta)\\)", "Zero", "\\(m u^2 \\cos^2\\theta\\)"], "answer": 0, "explanation": "At the maximum height, the horizontal coordinate of the particle is \\(x = \\frac{R}{2} = \\frac{u^2 \\sin(2\\theta)}{2g} = \\frac{u^2 \\sin\\theta \\cos\\theta}{g}\\). The force of gravity is \\(F = mg\\) pointing vertically downwards. The perpendicular distance of the line of action of gravity from the origin is x. Thus, torque magnitude \\(\\tau = F x = mg \\frac{u^2 \\sin\\theta \\cos\\theta}{g} = m u^2 \\sin\\theta \\cos\\theta\\) [310]."}, {"q": "A uniform thin rod of length L and mass M is hinged at one end and held horizontally. If it is released from rest, what is the initial angular acceleration of the rod? (Moment of inertia about hinge is \\(ML^2/3\\))", "options": ["g/L", "3g/2L", "2g/3L", "3g/L"], "answer": 1, "explanation": "The force of gravity \\(Mg\\) acts at the Centre of Mass (midpoint, \\(L/2\\)). The torque about the hinge is \\(\\tau = Mg (L/2)\\). Since \\(\\tau = I \\alpha\\), and \\(I = \\frac{1}{3} M L^2\\), we get: \\(Mg \\frac{L}{2} = \\frac{1}{3} M L^2 \\alpha \\Rightarrow \\alpha = \\frac{3g}{2L}\\) [310]."}, {"q": "A particle of mass m is moving in a plane with its position vector given by \\(\\vec{r} = a \\cos(\\omega t)\\hat{i} + b \\sin(\\omega t)\\hat{j}\\). What is the angular momentum of the particle about the origin?", "options": ["\\(m a b \\omega \\hat{k}\\)", "Zero", "\\(m (a^2 + b^2) \\omega \\hat{k}\\)", "\\(m a b \\omega (\\hat{i} + \\hat{j})\\)"], "answer": 0, "explanation": "\\(\\vec{v} = -a\\omega \\sin(\\omega t)\\hat{i} + b\\omega \\cos(\\omega t)\\hat{j}\\). \\(\\vec{l} = \\vec{r} \\times \\vec{p} = m(\\vec{r} \\times \\vec{v}) = m [a \\cos(\\omega t)\\hat{i} + b \\sin(\\omega t)\\hat{j}] \\times [-a\\omega \\sin(\\omega t)\\hat{i} + b\\omega \\cos(\\omega t)\\hat{j}] = m [a b \\omega \\cos^2(\\omega t)\\hat{k} - (-a b \\omega \\sin^2(\\omega t)\\hat{k})] = m a b \\omega [\\cos^2(\\omega t) + \\sin^2(\\omega t)]\\hat{k} = m a b \\omega \\hat{k}\\) [310]."}, {"q": "A particle of mass m is projected with speed u at an angle \\(\\theta\\) to the horizontal. What is the magnitude of the angular momentum of the particle about the projection point when it reaches its maximum height?", "options": ["\\(\\frac{m u^3 \\sin^2\\theta \\cos\\theta}{2g}\\)", "\\(\\frac{m u^3 \\sin\\theta \\cos^2\\theta}{2g}\\)", "Zero", "\\(\\frac{m u^3 \\sin^2(2\\theta)}{2g}\\)"], "answer": 0, "explanation": "At the maximum height, the velocity vector is purely horizontal: \\(\\vec{v} = u \\cos\\theta \\hat{i}\\). The height of the particle is \\(H = \\frac{u^2 \\sin^2\\theta}{2g}\\). The position vector relative to the origin: \\(\\vec{r} = x\\hat{i} + H\\hat{j}\\). The angular momentum is \\(\\vec{l} = \\vec{r} \\times \\vec{p} = (x\\hat{i} + H\\hat{j}) \\times m(u \\cos\\theta \\hat{i}) = -m u H \\cos\\theta \\hat{k}\\). The magnitude is \\(l = m u \\frac{u^2 \\sin^2\\theta}{2g} \\cos\\theta = \\frac{m u^3 \\sin^2\\theta \\cos\\theta}{2g}\\) [310]."}, {"q": "An object is suspended by a string of length L. If it is given a horizontal velocity \\(v_0 = \\sqrt{3gL}\\) at its lowest point, what is the angle \\(\\theta\\) from the vertical downward direction where the tension in the string becomes zero?", "options": ["60 degrees", "120 degrees", "135 degrees", "180 degrees"], "answer": 1, "explanation": "Using energy and force equations: \\(T = \\frac{m v^2}{L} + m g \\cos\\theta\\). Setting \\(T=0\\) gives \\(v^2 = -g L \\cos\\theta\\). By conservation of energy: \\(\\frac{1}{2} m v_0^2 = \\frac{1}{2} m v^2 + m g L (1 - \\cos\\theta) \\Rightarrow \\frac{3}{2} g L = -\\frac{1}{2} g L \\cos\\thet     <script>
        const TOPICS = JSON.parse(document.getElementById('quizData').textContent);
        const STORAGE_KEY = 'puchki_rot_progress_v1';
        const INPROGRESS_PREFIX = 'puchki_rot_inprogress_v1_';

        const borderPalette = [
            { border: 'rgba(56,189,248,0.55)',  hover: 'rgba(56,189,248,0.9)',  shadow: 'rgba(56,189,248,0.2)',  shadowHover: 'rgba(56,189,248,0.4)' },
            { border: 'rgba(167,139,250,0.55)', hover: 'rgba(167,139,250,0.9)', shadow: 'rgba(167,139,250,0.2)', shadowHover: 'rgba(167,139,250,0.4)' },
            { border: 'rgba(244,114,182,0.55)', hover: 'rgba(244,114,182,0.9)', shadow: 'rgba(244,114,182,0.2)', shadowHover: 'rgba(244,114,182,0.4)' },
            { border: 'rgba(52,211,153,0.55)',  hover: 'rgba(52,211,153,0.9)',  shadow: 'rgba(52,211,153,0.2)',  shadowHover: 'rgba(52,211,153,0.4)' },
            { border: 'rgba(251,146,60,0.55)',  hover: 'rgba(251,146,60,0.9)',  shadow: 'rgba(251,146,60,0.2)',  shadowHover: 'rgba(251,146,60,0.4)' },
            { border: 'rgba(45,212,191,0.55)',  hover: 'rgba(45,212,191,0.9)',  shadow: 'rgba(45,212,191,0.2)',  shadowHover: 'rgba(45,212,191,0.4)' },
            { border: 'rgba(129,140,248,0.55)', hover: 'rgba(129,140,248,0.9)', shadow: 'rgba(129,140,248,0.2)', shadowHover: 'rgba(129,140,248,0.4)' },
            { border: 'rgba(251,191,36,0.55)',  hover: 'rgba(251,191,36,0.9)',  shadow: 'rgba(251,191,36,0.2)',  shadowHover: 'rgba(251,191,36,0.4)' },
        ];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getProgress() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            } catch (e) { return {}; }
        }
        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }
        function getInProgress(topicNum) {
            try {
                return JSON.parse(localStorage.getItem(INPROGRESS_PREFIX + topicNum));
            } catch (e) { return null; }
        }
        function saveInProgress(topicNum, state) {
            localStorage.setItem(INPROGRESS_PREFIX + topicNum, JSON.stringify(state));
        }
        function clearInProgress(topicNum) {
            localStorage.removeItem(INPROGRESS_PREFIX + topicNum);
        }

        // ============ TOPIC LIST ============
        function renderTopics() {
            const progress = getProgress();
            const grid = document.getElementById('topicsGrid');
            const totalQ = TOPICS.reduce((sum, t) => sum + t.questions.length, 0);
            document.getElementById('totalQCount').textContent = `${totalQ} MCQs across ${TOPICS.length} topics — pick one, Puchki! ☁️✨`;

            grid.innerHTML = TOPICS.map((t, i) => {
                const c = borderPalette[i % borderPalette.length];
                const p = progress[t.topicNum];
                const inProg = getInProgress(t.topicNum);
                let badge = '';
                if (p) {
                    const pct = Math.round((p.bestScore / t.questions.length) * 100);
                    const trophy = pct === 100 ? ' 🏆' : '';
                    badge = `<div class="text-xs font-bold text-ndagreen-700 bg-ndagreen-400/20 inline-block px-3 py-1 rounded-full w-max mb-3 border border-ndagreen-400/40">Best: ${p.bestScore}/${t.questions.length} (${pct}%)${trophy}</div>`;
                } else if (inProg) {
                    badge = `<div class="text-xs font-bold text-amber-700 bg-amber-100 inline-block px-3 py-1 rounded-full w-max mb-3 border border-amber-200">In progress — Q${inProg.currentIndex + 1}/${t.questions.length}</div>`;
                } else {
                    badge = `<div class="text-xs font-bold text-cutesky-400 bg-cutesky-50 inline-block px-3 py-1 rounded-full w-max mb-3 border border-cutesky-100">Not started</div>`;
                }
                return `
                <div class="cute-glass p-6 flex flex-col group card-hover cursor-pointer relative" onclick="startTopic('${t.topicNum}')"
                     style="--card-border: ${c.border}; --card-shadow: ${c.shadow}; --card-border-hover: ${c.hover}; --card-shadow-hover: ${c.shadowHover};">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold text-cutesky-400 bg-white/70 px-2.5 py-1 rounded-full border border-cutesky-100">Topic ${t.topicNum}</span>
                        <span class="text-xs font-bold text-gray-500">${t.questions.length} Qs</span>
                    </div>
                    <h3 class="text-lg font-cute font-bold text-gray-800 mb-3 leading-snug">${escapeHtml(t.topicName)}</h3>
                    ${badge}
                    <span class="mt-auto text-sm font-bold text-cutesky-500 flex items-center gap-1">${inProg ? 'Resume ' : 'Start '}Quiz →</span>
                </div>
            `;
            }).join('');
        }

        // ============ QUIZ STATE ============
        let currentTopic = null;
        let currentIndex = 0;
        let score = 0;
        let answers = []; // per-question: chosen index or null
        let answered = false;

        function startTopic(topicNum) {
            currentTopic = TOPICS.find(t => t.topicNum === topicNum);
            const saved = getInProgress(topicNum);
            if (saved && saved.currentIndex < currentTopic.questions.length) {
                currentIndex = saved.currentIndex;
                score = saved.score;
                answers = saved.answers;
            } else {
                currentIndex = 0;
                score = 0;
                answers = new Array(currentTopic.questions.length).fill(null);
            }
            showView('quizView');
            renderQuestion();
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showTopics() {
            currentTopic = null;
            renderTopics();
            showView('topicView');
        }

        function exitQuiz() {
            if (currentTopic) {
                saveInProgress(currentTopic.topicNum, { currentIndex, score, answers });
            }
            showTopics();
        }

        function renderQuestion() {
            answered = false;
            const q = currentTopic.questions[currentIndex];
            document.getElementById('quizTopicName').textContent = currentTopic.topicName;
            document.getElementById('quizScoreBadge').textContent = `Score: ${score}/${currentIndex}`;
            document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${currentTopic.questions.length}`;
            document.getElementById('progressFill').style.width = `${(currentIndex / currentTopic.questions.length) * 100}%`;
            document.getElementById('questionText').textContent = q.q;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = q.options.map((opt, i) => `
                <button class="option-btn w-full text-left p-4 rounded-xl border-2 border-cutesky-100 bg-white/60 font-semibold text-sm text-gray-700"
                        onclick="selectOption(${i})" id="opt-${i}">
                    <span class="font-bold text-cutesky-500 mr-2">${String.fromCharCode(65 + i)}.</span>${escapeHtml(opt)}
                </button>
            `).join('');

            document.getElementById('explanationBox').classList.add('hidden');
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-40', 'cursor-not-allowed');
            nextBtn.textContent = currentIndex === currentTopic.questions.length - 1 ? 'Finish 🏁' : 'Next →';

            // If this question was already answered (resumed session), show its state
            if (answers[currentIndex] !== null && answers[currentIndex] !== undefined) {
                selectOption(answers[currentIndex], true);
            }
        }

        function selectOption(i, isResume) {
            if (answered) return;
            answered = true;
            const q = currentTopic.questions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (i === q.answer) {
                buttons[i].classList.add('option-correct');
                if (!isResume) score++;
            } else {
                buttons[i].classList.add('option-wrong');
                buttons[q.answer].classList.add('option-correct');
            }

            if (!isResume) {
                answers[currentIndex] = i;
                saveInProgress(currentTopic.topicNum, { currentIndex, score, answers });
            }

            const box = document.getElementById('explanationBox');
            const label = document.getElementById('feedbackLabel');
            label.textContent = i === q.answer ? "✅ Correct!" : "❌ Not quite";
            label.className = i === q.answer ? "font-bold mb-1 text-emerald-600" : "font-bold mb-1 text-rose-600";
            document.getElementById('explanationText').textContent = q.explanation;
            box.classList.remove('hidden');

            document.getElementById('quizScoreBadge').textContent = `Score: ${score}/${currentIndex + 1}`;

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        }

        function nextQuestion() {
            if (currentIndex < currentTopic.questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishTopic();
            }
        }

        function finishTopic() {
            const progress = getProgress();
            const total = currentTopic.questions.length;
            const existing = progress[currentTopic.topicNum];
            progress[currentTopic.topicNum] = {
                bestScore: existing ? Math.max(existing.bestScore, score) : score,
                lastScore: score,
                total: total,
                completedAt: new Date().toISOString()
            };
            saveProgress(progress);
            clearInProgress(currentTopic.topicNum);

            const pct = Math.round((score / total) * 100);
            document.getElementById('resultTopicName').textContent = currentTopic.topicName;
            document.getElementById('resultScore').textContent = `${score}/${total} (${pct}%)`;

            let emoji, msg;
            if (pct >= 90) { emoji = '🚀'; msg = "You're unstoppable, Puchki! Absolutely crushing it."; }
            else if (pct >= 70) { emoji = '💪'; msg = "Solid work! A little more practice and this topic is locked in."; }
            else if (pct >= 50) { emoji = '🌱'; msg = "Good start! Review the explanations and give it another go."; }
            else { emoji = '📚'; msg = "This topic needs a revisit — go through the chapter notes and try again."; }
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultMessage').textContent = msg;

            showView('resultView');
        }

        function retryTopic() {
            currentIndex = 0;
            score = 0;
            answers = new Array(currentTopic.questions.length).fill(null);
            clearInProgress(currentTopic.topicNum);
            showView('quizView');
            renderQuestion();
        }

        renderTopics();

        /* ============ MUSIC SYNC (same mechanism as other pages) ============ */
        document.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicToggleBtn');

            const savedTime = localStorage.getItem('puchki_music_time') || 0;
            const isPlaying = localStorage.getItem('puchki_music_playing') === 'true';

            audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.play().then(() => {
                    musicBtn.innerHTML = '🔊';
                }).catch(e => {
                    console.log("Autoplay blocked", e);
                    musicBtn.innerHTML = '🔇';
                    localStorage.setItem('puchki_music_playing', 'false');
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('puchki_music_time', audio.currentTime);
            });

            window.toggleMusic = function() {
                if (audio.paused) {
                    audio.play();
                    localStorage.setItem('puchki_music_playing', 'true');
                    musicBtn.innerHTML = '🔊';
                } else {
                    audio.pause();
                    localStorage.setItem('puchki_music_playing', 'false');
                    musicBtn.innerHTML = '🔇';
                }
            };
        });
    </script>
