    <script id="quizData" type="application/json">[{"topicNum": "1", "topicName": "Aristotle's Fallacy, Galileo's Inclines & Laws of Inertia", "questions": [{"q": "Which of the following statements correctly summarizes the core assertion of 'Aristotle's fallacy' regarding the motion of bodies?", "options": ["An object in motion will naturally continue its motion along a straight line unless acted upon by an external force.", "An external force is required to keep a body in uniform motion along a straight path.", "Force is proportional to the acceleration of a body rather than its velocity.", "In the absence of any resistive force, a body must naturally accelerate to infinity."], "answer": 1, "explanation": "Aristotle held the view that if a body is moving, something external is required to keep it moving [276]. He stated that an external force is required to keep a body in motion. This was later recognized as a fallacy because it overlooked the invisible resistive force of friction, which acts to stop moving bodies in practical life."}, {"q": "How did Galileo Galilei logically resolve Aristotle's fallacy regarding the necessity of an external force to maintain motion?", "options": ["By showing that forces are only responsible for starting motion, not stopping it.", "By calculating the exact value of gravitational acceleration on inclined planes.", "By realizing that the stopping of a body is due to an opposing, non-zero force of friction which can be minimized but not entirely eliminated in practical experiments.", "By proposing that space does not contain any matter to offer resistance."], "answer": 2, "explanation": "Galileo realized that a moving ball on a horizontal plane comes to a stop due to the opposing force of friction [277]. If friction were completely eliminated, the ball would continue to move with a constant velocity, showing that the natural state of a body is not rest, but rather its current state of motion (either rest or uniform linear velocity) is maintained in the absence of net external forces."}, {"q": "In Galileo's famous double-incline thought experiment, a frictionless ball is released from a certain height on the left inclined plane. If the right inclined plane is made completely horizontal, how far will the ball roll?", "options": ["It will roll for a distance equal to twice the length of the left plane.", "It will continue to move infinitely with a constant velocity to reach the original height which it never can.", "It will roll until its kinetic energy becomes equal to its potential energy at the release height.", "It will decelerate slowly because of its own inertia of rest."], "answer": 1, "explanation": "In Galileo's thought experiment, a ball released from a height on a frictionless incline rolls down and climbs up the opposing incline to reach the same height [277]. If the opposing incline is made horizontal, the ball must continue to move infinitely with a constant velocity, as it perpetually attempts to reach its original release height which is geometrically impossible on a flat plane."}, {"q": "Which of the following serves as the qualitative and quantitative measure of a body's inertia in classical translational mechanics?", "options": ["The net external force acting on the body.", "The velocity of the body.", "The mass of the body.", "The acceleration due to gravity at its location."], "answer": 2, "explanation": "Inertia is the inherent property of a body to resist any change in its state of rest or uniform motion [281]. Mass is the quantitative measure of this inertia. A heavier body has more inertia (resists changes more) than a lighter body, independent of gravity or current velocity."}, {"q": "A passenger standing in a stationary bus is thrown backward with a sudden jerk when the driver starts the bus abruptly. Which of the following correctly explains this phenomenon?", "options": ["The upper part of the passenger's body moves with the bus while the feet remain stationary due to inertia.", "Friction between the feet and the floor pulls the feet forward with the bus, while the rest of the body remains at rest due to inertia of rest.", "An active pseudoforce acts on the passenger in the backward direction due to the non-inertial frame of reference.", "The center of mass of the passenger naturally shifts backward to maintain rotational equilibrium."], "answer": 1, "explanation": "When the bus starts suddenly, the feet, being in direct contact with the bus floor, are pulled forward by static frictional forces [281]. However, the upper part of the body, which is not rigidly bound, tends to remain at rest due to its 'inertia of rest'. Relative to the accelerating bus, the passenger therefore tilts or is thrown backward."}, {"q": "Why does a running athlete run some distance even after crossing the finish line before coming to a complete stop?", "options": ["To maximize the normal reaction force of the ground on their legs.", "Due to the inertia of motion, their body tends to resist a sudden change from a state of high velocity to a state of rest.", "Because the kinetic friction of the track becomes zero at high speeds.", "To prevent their muscles from doing negative work."], "answer": 1, "explanation": "An athlete in full sprint has a high 'inertia of motion'. Their body resists an instantaneous reduction of velocity to zero. Running a small distance allows their muscles to apply a gradual, controlled retarding force to overcome this inertia safely."}, {"q": "A passenger tossing a coin vertically upward in a uniformly accelerating train finds that the coin falls behind him. What would happen if the train was moving with a completely uniform velocity instead?", "options": ["The coin would fall in front of the passenger.", "The coin would fall directly back into the passenger's hand.", "The coin would travel in a parabolic trajectory relative to the passenger and fall sideways.", "The coin would remain suspended in mid-air due to the lack of external forces."], "answer": 1, "explanation": "If the train moves with uniform velocity (zero acceleration), the system behaves exactly as an inertial frame of reference [279]. By the law of inertia, the coin retains the horizontal velocity of the train throughout its flight. Thus, relative to the passenger, its motion is purely vertical and it lands back in his hand. If the train accelerates, the train gains horizontal velocity while the coin is in the air, causing the coin to land behind him."}, {"q": "Which of the following physical situations represents a state where the net external force on an object is zero, yet the object is in motion?", "options": ["A car negotiating a sharp, banked circular curve at constant speed.", "An interstellar spaceship drifting far from all celestial bodies with its propulsion engines completely turned off.", "A simple pendulum swinging back and forth through its mean position.", "A block of ice sliding down a rough inclined plane at a constant acceleration."], "answer": 1, "explanation": "According to Newton's First Law, if the net external force on a body is zero, its acceleration is zero [279]. If the body is already in motion, it continues to move with a constant, uniform velocity. A spaceship drifting in deep space experiences negligible gravity and no engine thrust, thus moving in a straight line at constant speed with net zero external force."}, {"q": "When a carpet is beaten vigorously with a stick, dust particles emerge out of it. What is the precise physical principle behind this daily life observation?", "options": ["The stick imparts a high kinetic energy to the dust particles directly.", "The beating creates a sudden vacuum inside the carpet fibers.", "The carpet is suddenly set into motion by the impact, while the dust particles tend to remain at rest due to their inertia of rest.", "The mechanical shock converts static friction into rolling friction."], "answer": 2, "explanation": "When the carpet is struck, the fibers of the carpet move forward rapidly under the force of the stick. However, the dust particles embedded in the fibers tend to remain at their original positions due to their 'inertia of rest'. As a result, they get separated from the moving carpet and fall down under gravity."}, {"q": "A stone tied to a string is being whirled in a horizontal circle at a constant speed. If the string suddenly snaps, in which direction will the stone fly?", "options": ["Radially outward away from the center of the circle.", "Radially inward toward the center of the circle.", "Tangentially to the circular path at the instant of snapping due to its inertia of direction.", "It will stop instantaneously and fall vertically downward."], "answer": 2, "explanation": "At any point on a circular path, the instantaneous direction of motion of a body is along the tangent to the circle [252]. When the string snaps, the centripetal force vanishes. Due to 'inertia of direction', the stone continues along its instantaneous tangent path."}, {"q": "Which of the following statements about Newton's First Law of Motion is correct?", "options": ["It defines force qualitatively but does not provide a quantitative formula.", "It provides the mathematical formulation to calculate the magnitude of force.", "It is only valid in non-inertial frames of reference.", "It asserts that forces are not necessary to bring about a change in speed."], "answer": 0, "explanation": "Newton's First Law qualitatively defines force as that external agency which can change a body's state of rest or uniform motion [278]. It does not provide the quantitative formula (which is the domain of the Second Law, F = ma). It establishes the concept of inertial frames and the definition of force."}, {"q": "A heavy iron block of mass 10 kg and a light wooden block of mass 1 kg are placed side-by-side on a frictionless horizontal table. If we want to accelerate both blocks at the same rate, which of the following is true?", "options": ["We must apply the same force on both blocks because both are on a frictionless surface.", "We must apply 10 times more force on the iron block because its inertia is 10 times larger.", "We must apply 10 times more force on the wooden block because it is lighter.", "No force is needed to accelerate them since the surface is frictionless."], "answer": 1, "explanation": "Force is given by F = ma. To produce the same acceleration 'a' on both blocks, the force required is directly proportional to their masses (inertia). Since the iron block has 10 times the mass of the wooden block, it requires 10 times the force: F_iron = 10 * a, F_wood = 1 * a."}, {"q": "When a wet dog shakes itself vigorously to dry its fur, water drops fly off its body. What mechanical concept explains this action?", "options": ["Inertia of motion of the water drops.", "Inertia of rest of the water drops as the skin moves rapidly underneath them.", "The centripetal force generated by the dog's circular body curves.", "The reduction of surface tension of water due to skin friction."], "answer": 1, "explanation": "As the dog rapidly changes the direction of motion of its skin, the skin pulls away from the water drops. Because the water drops are not rigidly bound, their 'inertia of rest' (or their tendency to preserve their state of motion at the turning points) causes them to separate from the fur as the skin changes direction."}, {"q": "Why are mudguards routinely placed over the wheels of a bicycle or motorcycle?", "options": ["To decrease the kinetic friction of the rotating wheel.", "To catch the mud particles which fly off tangentially due to their inertia of direction.", "To prevent the wheels from picking up static electric charges.", "To increase the air drag and stabilize the vehicle's speed."], "answer": 1, "explanation": "Mud sticking to a rotating tire is thrown off tangentially at the point of detachment because of its 'inertia of direction'. Mudguards are positioned directly above these tangential paths to intercept the flying mud and protect the rider and vehicle."}, {"q": "If a body is at rest on a table, which of the following statements is correct regarding the forces acting on it according to Newton's First Law?", "options": ["There are no forces whatsoever acting on the body.", "The gravitational force is the only active force, but it does not cause motion because of the body's high static friction.", "Multiple forces (like gravity and normal reaction) act on the body, but they are equal and opposite, summing to zero net external force.", "The body is at rest because the normal reaction is slightly larger than gravity."], "answer": 2, "explanation": "According to the First Law, a body remains at rest because the 'net' external force is zero [280]. On a table, gravity pulls the body down with force mg, and the table exerts an equal and opposite upward normal reaction force N. These forces cancel each other, leaving the net external force as zero."}, {"q": "A branch of a mango tree is shaken vigorously, causing ripe mangoes to fall down. Why do the green (unripe) mangoes on the same branch usually remain attached?", "options": ["Green mangoes have less mass and therefore less inertia of rest.", "The stalk of a green mango is stronger, resisting the sudden force of detachment when the branch moves rapidly, whereas ripe mangoes have weaker stalks that easily snap due to the mango's inertia of rest.", "Green mangoes have higher thermal capacity to absorb the kinetic shock.", "Ripe mangoes are acted upon by a larger centrifugal force because of their sweet juice."], "answer": 1, "explanation": "When the branch is shaken, both mangoes try to remain at rest due to inertia [281]. Ripe mangoes have a weak connection (stalk) to the branch, which easily breaks under the stress of the sudden relative displacement between the branch and the mango. Unripe mangoes have a tough, elastic stalk that can withstand this inertia-induced stress."}, {"q": "During a sudden turn of a car to the left, the passengers are tilted toward the right. What type of inertia is responsible for this shift?", "options": ["Inertia of rest.", "Inertia of motion.", "Inertia of direction.", "Inertia of mass distribution."], "answer": 2, "explanation": "The passengers inside the car are moving in a straight line. When the car suddenly turns left, the passengers' bodies tend to maintain their original straight-line direction of motion due to 'inertia of direction'. Relative to the turning car, they appear to slide or lean toward the right side."}, {"q": "Which of the following frames of reference is strictly 'inertial' by definition?", "options": ["A frame of reference attached to a merry-go-round rotating at constant speed.", "A frame of reference in which Galileo's law of inertia holds true, meaning it is either at rest or moving with a constant velocity.", "A cabin of a freely falling elevator under gravity.", "A fighter jet executing a high-g loop in the sky."], "answer": 1, "explanation": "An inertial frame of reference is defined as a frame in which Newton's First Law (Law of Inertia) is valid without the introduction of pseudo-forces [103]. Such a frame is either completely at rest or moving with a uniform linear velocity (constant speed in a straight line, zero acceleration). Rotating or accelerating frames are non-inertial."}, {"q": "Why does a heavy truck require a much more powerful braking system compared to a lightweight passenger car traveling at the same speed?", "options": ["Because the car experiences a larger normal reaction force.", "Because the truck has a much larger mass, and therefore higher inertia of motion, requiring more retarding force to stop over the same distance.", "Because the car has a smaller coefficient of static friction.", "Because the truck's wheels have a smaller radius."], "answer": 1, "explanation": "The truck has a much larger mass than the car. Since mass is the measure of inertia, the truck has a much higher 'inertia of motion'. It strongly resists being brought to a stop, necessitating a larger retarding force (brakes) to decelerate it within a reasonable stopping distance."}, {"q": "An empty box is sliding smoothly on a frictionless horizontal sheet of ice with a constant velocity of 5 m/s. If rain starts falling vertically, filling the box with water, what happens to the velocity of the box (neglecting any horizontal force from rain)?", "options": ["The velocity remains exactly 5 m/s because there is no horizontal friction.", "The velocity increases because the mass of the system increases.", "The velocity decreases because the inertia (mass) of the moving system increases, while horizontal momentum is conserved.", "The box stops instantly due to the downward impact of the rain."], "answer": 2, "explanation": "Since there is no external horizontal force, the horizontal momentum of the box must be conserved (P = m*v). As rain falls vertically, it adds mass 'm' to the box without adding any horizontal momentum. To keep P constant as mass increases, the horizontal velocity 'v' must decrease (v = P/m). This is a classic demonstration of how increasing inertia decreases speed under constant momentum."}, {"q": "A coin is placed on a smooth card covering a drinking glass. When the card is flicked horizontally with a finger, the card flies off while the coin drops straight into the glass. Why?", "options": ["Friction between the coin and the card is too large.", "The coin experiences a downward gravitational attraction that is larger than the horizontal force of the flick.", "Due to its inertia of rest, the coin tends to maintain its state of rest and does not move with the card, falling into the glass once support is removed.", "The flick creates a momentary electrostatic charge that repels the card."], "answer": 2, "explanation": "Flicking the card imparts a sudden, brief force on the card alone. Because the coin has inertia of rest, it resists being set into horizontal motion. As a result, the card slips out from underneath, leaving the coin temporarily unsupported, which then falls straight down into the glass under gravity."}, {"q": "A spaceship out in deep space, far from any gravitational source, runs out of fuel. What will be its subsequent motion?", "options": ["It will slowly decelerate and eventually come to a complete stop.", "It will immediately stop and remain anchored at that point in space.", "It will continue to move in a straight line with a constant velocity.", "It will enter a circular orbit around the nearest empty point."], "answer": 2, "explanation": "In deep space, there are no significant gravitational forces or friction [279]. According to Newton's First Law, once the engines stop (zero net external force), the spaceship will maintain its current state of motion. It will continue moving in a straight line at a constant velocity."}, {"q": "Which of the following observations cannot be explained by the concept of inertia of rest?", "options": ["A pile of carrom coins remains intact except for the bottom-most coin which is struck out by a fast striker.", "A person shaking a wet umbrella finds that water droplets are thrown off.", "An apple falls from a tree when its branch is shaken.", "A person running on a wet floor slips and falls backward."], "answer": 3, "explanation": "Option A (carrom coins), B (wet umbrella), and C (apple falling) are all classic examples of 'inertia of rest', where a sudden force moves one part of a system while the other part tends to remain in place [281]. Option D (slipping on a wet floor) is due to a sudden loss of frictional force between the feet and the ground, causing the feet to accelerate forward while the upper body remains behind."}, {"q": "Why are safety seat belts installed in modern cars and aircraft?", "options": ["To increase the friction of the seats and prevent sliding during normal turns.", "To exert a constant forward force and assist the vehicle's engine.", "To protect passengers from being thrown forward due to their inertia of motion during sudden deceleration or collisions.", "To adjust the passenger's center of gravity and increase vehicle stability."], "answer": 2, "explanation": "When a fast-moving vehicle is stopped suddenly, the passengers' bodies continue to move forward with the same velocity due to their 'inertia of motion' [281]. Seat belts apply an external retarding force to decelerate the passengers safely along with the vehicle, preventing them from colliding with the dashboard or windshield."}, {"q": "If a body is moving with constant velocity in a straight line, what can we definitely infer about the forces acting on it?", "options": ["A single, constant external force must be continuously acting in the direction of motion.", "No forces of any kind are acting on the body.", "The vector sum of all external forces acting on the body must be zero.", "The gravitational force must be greater than the frictional force."], "answer": 2, "explanation": "Constant velocity implies that acceleration is zero [279]. By Newton's First Law (F = ma), a zero acceleration means that the net external force acting on the body is zero. There could be multiple forces acting on the body (e.g., engine thrust and air resistance), but their vector sum must be zero."}, {"q": "In ancient physics, Aristotle believed that an arrow shot from a bow continues to fly because the air behind it keeps pushing it. What did Galileo and Newton identify as the real reason?", "options": ["The arrow creates a vacuum in front of it that pulls it forward.", "The arrow continues to fly simply because of its own inertia of motion once set in flight.", "Gravity exerts a horizontal force component on the arrow.", "The friction of the air provides a forward driving force."], "answer": 1, "explanation": "According to the Law of Inertia, once the arrow is accelerated and leaves the bow string, no forward force is required to keep it moving [276]. It continues to fly because of its 'inertia of motion'. Air resistance is actually a retarding force that gradually slows it down, contrary to Aristotle's view that air pushes it forward."}, {"q": "Why is it easier to pull a heavy handcart on a smooth concrete floor than on a rough gravel road?", "options": ["The mass (and thus inertia of rest) of the cart is smaller on the concrete floor.", "The opposing frictional force is much smaller on the smooth floor, meaning less external force is needed to overcome resistance and accelerate the cart.", "The gravity acting on the cart is smaller on the concrete floor.", "The smooth floor increases the cart's momentum."], "answer": 1, "explanation": "The mass (and inertia) of the cart remains constant regardless of the surface. However, a rough gravel road offers a much larger opposing force of friction [305]. To accelerate the cart, the applied force must exceed this resistive friction. Since concrete has less friction, a smaller force is needed to produce motion."}, {"q": "During a space walk, an astronaut accidentally pushes their tool kit away. If the tool kit has a mass of 5 kg and moves with a speed of 2 m/s, what force is needed to keep it moving at this constant speed in vacuum?", "options": ["10 N", "5 N", "0 N", "2.5 N"], "answer": 2, "explanation": "According to Newton's First Law, no force is required to keep a body moving with a constant velocity in the absence of resistive forces [279]. In the vacuum of space, there is no air resistance or friction, so the tool kit will continue moving at 2 m/s with a force of exactly 0 N."}, {"q": "A heavy stone of mass M is suspended from a ceiling by a light string", "options": ["Another identical string B is attached to the bottom of the stone. If string B is pulled down with a sudden, sharp jerk, which string will break? A. String A will break first because it supports the weight of the stone.", "String B will break first because the stone's large inertia of rest prevents the sudden force from propagating upward to string A.", "Both strings will break simultaneously.", "Neither string can break because they are identical."], "answer": 1, "explanation": "When string B is pulled with a sudden, sharp jerk, the stone's large mass (inertia of rest) resists being set into motion [281]. The sudden force is not transmitted to the upper string A in that tiny fraction of time, causing the tension in B to exceed its breaking point first. If the pull was gradual, the tension in A would be the weight of the stone plus the pulling force, and string A would break first."}, {"q": "Which of the following statements about inertia is incorrect?", "options": ["Inertia is not a physical force but an inherent property of matter.", "A body can have inertia of rest even in a gravity-free space.", "The inertia of an object increases when it is set into rapid motion.", "Different bodies made of different materials can have identical inertia if their masses are equal."], "answer": 2, "explanation": "Inertia depends strictly on the mass of the body (mass as a measure of inertia) [281]. It is completely independent of the body's velocity or state of motion in classical mechanics. Setting a body into motion does not change its mass, and therefore does not change its inertia. Thus, statement C is incorrect."}]}, {"topicNum": "2", "topicName": "Newton's Second Law & Linear Momentum", "questions": [{"q": "Linear momentum (\\(\\vec{p}\\)) is a key physical quantity in mechanics. Which of the following statements is mathematically and conceptually correct regarding momentum?", "options": ["Momentum is a scalar quantity because it is a product of mass (scalar) and speed (scalar).", "Momentum is a vector quantity pointing in the same direction as the velocity vector, measured in SI units of \\(\\text{kg m s}^{-1}\\).", "Two bodies of unequal masses moving with the same speed must possess the same linear momentum.", "In a closed system, momentum is only conserved if the colliding bodies are made of the same material."], "answer": 1, "explanation": "Linear momentum is defined as the product of mass and velocity: \\(\\vec{p} = m\\vec{v}\\) [306]. Because velocity is a vector, momentum is also a vector pointing in the direction of velocity. Its SI unit is \\(\\text{kg m/s}\\). Lighter and heavier bodies moving at the same speed have different momenta because mass is different."}, {"q": "Which of the following physical assertions represents the precise statement of Newton's Second Law of Motion as formulated in the SI system?", "options": ["The acceleration of a body is inversely proportional to the net external force acting on it.", "The rate of change of linear momentum of a body is directly proportional to the applied external force and takes place in the direction of the force.", "Force is always equal to the product of mass and instantaneous speed.", "A body continues to maintain its momentum unless an internal force changes its configuration."], "answer": 1, "explanation": "Newton's Second Law states that the rate of change of momentum of a body is proportional to the applied force and takes place in the direction of the force [306]. In SI units, the constant of proportionality is set to 1, yielding \\(\\vec{F} = \\frac{d\\vec{p}}{dt}\\)."}, {"q": "A block of mass \\(m = 5\\text{ kg}\\) is subject to a constant net horizontal force of \\(20\\text{ N}\\). What is the acceleration produced in the block?", "options": ["100 \\(\\text{m/s}^2\\)", "4 \\(\\text{m/s}^2\\)", "0.25 \\(\\text{m/s}^2\\)", "15 \\(\\text{m/s}^2\\)"], "answer": 1, "explanation": "For a constant mass system, Newton's second law simplifies to \\(F = ma\\) [306]. Here, \\(F = 20\\text{ N}\\) and \\(m = 5\\text{ kg}\\). Therefore, \\(a = F/m = 20 / 5 = 4\\text{ m/s}^2\\)."}, {"q": "A car of mass \\(1000\\text{ kg}\\) moving with a velocity of \\(20\\text{ m/s}\\) is brought to rest over a distance of \\(50\\text{ m}\\) by applying brakes. What is the magnitude of the constant retarding force exerted by the brakes?", "options": ["4000 N", "8000 N", "2000 N", "10000 N"], "answer": 0, "explanation": "First, find the deceleration using the kinematic equation \\(v^2 = u^2 + 2as\\). Here, \\(u = 20\\text{ m/s}\\), \\(v = 0\\), and \\(s = 50\\text{ m}\\). So, \\(0 = 20^2 + 2(a)(50) \\Rightarrow 100a = -400 \\Rightarrow a = -4\\text{ m/s}^2\\). The retarding force magnitude is \\(F = ma = 1000 \\times 4 = 4000\\text{ N}\\)."}, {"q": "The position of a particle of mass \\(m = 2\\text{ kg}\\) as a function of time is given by the relation \\(y(t) = 5t + 3t^2\\), where \\(y\\) is in metres and \\(t\\) in seconds. What is the net force acting on the particle?", "options": ["10 N", "12 N", "6 N", "8 N"], "answer": 1, "explanation": "The velocity \\(v\\) is the first derivative of position: \\(v(t) = \\frac{dy}{dt} = 5 + 6t\\). The acceleration \\(a\\) is the derivative of velocity: \\(a = \\frac{dv}{dt} = 6\\text{ m/s}^2\\) [286]. The net force is \\(F = ma = 2\\text{ kg} \\times 6\\text{ m/s}^2 = 12\\text{ N}\\). Since acceleration is constant, the force is also constant."}, {"q": "A bullet of mass \\(0.02\\text{ kg}\\) moving with a speed of \\(100\\text{ m/s}\\) enters a thick wooden block and is stopped after penetrating a distance of \\(10\\text{ cm}\\). What is the average resistive force exerted by the block on the bullet?", "options": ["1000 N", "2000 N", "500 N", "1500 N"], "answer": 0, "explanation": "Convert penetration distance to SI units: \\(s = 10\\text{ cm} = 0.1\\text{ m}\\). Using \\(v^2 = u^2 + 2as\\): \\(0 = 100^2 + 2(a)(0.1) \\Rightarrow 0.2a = -10000 \\Rightarrow a = -50000\\text{ m/s}^2\\) [285]. The resistive force magnitude is \\(F = ma = 0.02 \\times 50000 = 1000\\text{ N}\\)."}, {"q": "According to Newton's second law, \\(\\vec{F} = m\\vec{a}\\). What does it imply about the physical relationship between the force vector and the acceleration vector?", "options": ["The force vector is always perpendicular to the acceleration vector.", "The acceleration vector must always be parallel to the velocity vector.", "The acceleration is always parallel to the net external force acting on the body at that instant, regardless of its direction of motion.", "The direction of acceleration depends on the history of the particle's displacement."], "answer": 2, "explanation": "The vector equation \\(\\vec{F} = m\\vec{a}\\) indicates that the acceleration vector \\(\\vec{a}\\) is always strictly parallel to the net external force vector \\(\\vec{F}\\) [310]. Acceleration is not necessarily in the direction of velocity. For example, in circular motion, force and acceleration are perpendicular to velocity, pointing towards the center."}, {"q": "What is the physical significance of the statement 'Newton's Second Law is a local law of physics'?", "options": ["It only applies to small local laboratories, not on an astronomical scale.", "The force at a point in space at a certain instant of time determines the acceleration at that same point at that same instant, with no memory of the past motion.", "It is only valid for contacting bodies, not for non-contact fields.", "It means the acceleration is dependent on the local atmospheric pressure."], "answer": 1, "explanation": "The second law of motion is a local relation [285]. This means that the acceleration \\(\\vec{a}\\) 'here and now' is determined strictly by the net external force \\(\\vec{F}\\) 'here and now', completely independent of the past history of the motion of the particle. The moment a force ceases to act, the acceleration immediately drops to zero."}, {"q": "A stone is released from the window of a train running on a straight track at a constant horizontal acceleration of \\(2\\text{ m/s}^2\\). At the exact instant of release, what is the horizontal force (and acceleration) acting on the stone, neglecting air resistance?", "options": ["It experiences a horizontal force equal to \\(2m\\) in the direction of the train's motion.", "It experiences a backward force because of the inertia of rest.", "The horizontal force becomes exactly zero instantaneously, and its horizontal acceleration is zero; it experiences only the vertical force of gravity.", "It continues to accelerate horizontally at \\(2\\text{ m/s}^2\\) under the influence of the train's momentum."], "answer": 2, "explanation": "By the local nature of the Second Law, the horizontal force on the stone ceases the very instant it loses physical contact with the train [311]. Since there is no physical horizontal agency (like a string or surface) to pull it forward, the horizontal force and horizontal acceleration immediately become zero. The stone retains the horizontal velocity it had at the moment of release due to inertia, but experiences only the vertical downward force of gravity (acceleration \\(g\\))."}, {"q": "A rubber ball of mass \\(0.1\\text{ kg}\\) is dropped from a height on a hard floor. If its momentum changes from \\(-1\\text{ kg m/s}\\) (just before impact) to \\(+0.8\\text{ kg m/s}\\) (just after bouncing) during a contact time of \\(0.01\\text{ s}\\), what is the average force exerted by the floor on the ball?", "options": ["180 N", "20 N", "80 N", "100 N"], "answer": 0, "explanation": "Force is the rate of change of momentum: \\(F = \\frac{\\Delta p}{\\Delta t}\\) [306]. Here, \\(\\Delta p = p_{final} - p_{initial} = 0.8 - (-1) = 1.8\\text{ kg m/s}\\). The contact time is \\(\\Delta t = 0.01\\text{ s}\\). Therefore, \\(F = 1.8 / 0.01 = 180\\text{ N}\\)."}]}, {"topicNum": "3", "topicName": "Impulse & Practical Safety Mechanics", "questions": [{"q": "In physics, the quantity 'Impulse' represents the product of a large force and the extremely brief time interval over which it acts. What is the precise relation of Impulse to momentum?", "options": ["Impulse is equal to the rate of change of momentum per unit time.", "Impulse is equal to the total change in the linear momentum of the body.", "Impulse is a scalar quantity equal to the average momentum of the colliding bodies.", "Impulse represents the maximum momentum achieved by a body during a collision."], "answer": 1, "explanation": "By definition, impulse is the product of force and time, which mathematically equals the total change in linear momentum: \\(\\vec{J} = \\int \\vec{F} \\, dt = \\Delta \\vec{p}\\) [286, 307]. This is known as the Impulse-Momentum Theorem."}, {"q": "While catching a fast-moving cricket ball, a professional fielder on the ground gradually pulls his hands backward with the moving ball. Why is this action performed?", "options": ["To decrease the total change in momentum of the cricket ball.", "To increase the contact time interval, thereby decreasing the rate of change of momentum and minimizing the average impact force on his hands.", "To utilize the positive work done by the ball to increase his kinetic energy.", "To ensure that the ball undergoes a completely elastic collision with his palms."], "answer": 1, "explanation": "When a fielder pulls his hands backward, he increases the time interval \\(\\Delta t\\) over which the ball's velocity (and momentum) is reduced to zero [282]. Since force is \\(F = \\frac{\\Delta p}{\\Delta t}\\), increasing \\(\\Delta t\\) dramatically reduces the average impact force, preventing pain and injury to the hands."}, {"q": "A tennis ball of mass \\(0.15\\text{ kg}\\) hits a wall horizontally at a speed of \\(12\\text{ m/s}\\) and bounces back along the same straight line with the same speed. What is the magnitude of the impulse imparted to the ball by the wall?", "options": ["1.8 N s", "0 N s", "3.6 N s", "5.4 N s"], "answer": 2, "explanation": "Impulse is equal to change in momentum: \\(J = p_{final} - p_{initial}\\) [287]. Choosing the initial direction of motion as positive: \\(p_{initial} = m \\times u = 0.15 \\times 12 = 1.8\\text{ kg m/s}\\). Since it bounces back with the same speed, its final velocity is negative: \\(p_{final} = m \\times (-u) = 0.15 \\times (-12) = -1.8\\text{ kg m/s}\\). The change in momentum is \\(\\Delta p = 1.8 - (-1.8) = 3.6\\text{ kg m/s}\\). Thus, the impulse magnitude is \\(3.6\\text{ N s}\\)."}, {"q": "Why are luxury passenger cars equipped with heavy-duty shock absorbers (dampers) and pneumatic tires?", "options": ["To minimize the total momentum change of the car over the entire trip.", "To increase the duration of any road-shock impact, thereby reducing the peak average impulsive force transmitted to the passengers.", "To convert kinetic energy completely into potential energy of the springs.", "To ensure the frame remains in a strictly non-inertial state."], "answer": 1, "explanation": "Road bumps produce sudden changes in the vertical momentum of a car. Shock absorbers are designed to prolong the time over which these momentum changes occur [282]. Because the shock duration \\(\\Delta t\\) is lengthened, the average impulsive force experienced by the passengers is minimized, leading to a smoother ride."}, {"q": "A ball of mass \\(m\\) is thrown vertically downward from a high bridge. Case I: It hits a concrete floor and stops completely. Case II: It hits an elastic rubber sheet and rebounds upward to the same height. If the contact time is the same in both cases, which scenario exerts a larger force on the surface?", "options": ["Case I, because concrete is much harder than rubber.", "Case II, because the momentum change is twice as large during a rebound compared to a complete stop.", "Both cases exert the same force because the initial mass and velocities are identical.", "No force is exerted in either case because the net displacement is zero."], "answer": 1, "explanation": "In Case I, the change in momentum is \\(\\Delta p_1 = 0 - (-mv) = mv\\). In Case II (complete elastic rebound), the change in momentum is \\(\\Delta p_2 = mv - (-mv) = 2mv\\). Since impulse equals change in momentum, the rebounding ball experiences (and exerts) twice the impulse of the stopping ball [293]. For identical contact times, Case II therefore exerts twice the average force."}, {"q": "A batsman deflects a cricket ball of mass \\(0.15\\text{ kg}\\) by an angle of \\(45^\\circ\\) without changing its initial speed, which is \\(54\\text{ km/h}\\). What is the magnitude of the impulse imparted to the ball?", "options": ["4.2 N s", "2.1 N s", "8.4 N s", "1.0 N s"], "answer": 0, "explanation": "Convert speed to SI: \\(u = 54\\text{ km/h} = 15\\text{ m/s}\\). The ball is deflected by an angle \\(\\theta = 45^\\circ\\). The momentum vector is deflected by the same angle. The magnitude of the change in momentum vector is given by the vector subtraction formula: \\(|\\Delta \\vec{p}| = 2 m u \\cos(\\theta/2)\\) for a deflection where the path is split symmetrically, or \\(2 m u \\sin(\\theta/2)\\) depending on the geometry. For a simple deflection angle of \\(45^\\circ\\) from its original straight line (representing a total angle change of \\(45^\\circ\\)), the calculation gives: \\(J = 2 m u \\sin(22.5^\\circ) \\approx 2 \\times 0.15 \\times 15 \\times 0.9238 \\approx 4.2\\text{ N s}\\) [437]."}, {"q": "How do railway coaches utilize spring buffers between their coupling arrangements to ensure the safety of cargo and passengers during sudden engine braking?", "options": ["They completely eliminate any change in linear momentum.", "They increase the time of impact during coach collisions, reducing the peak force experienced by each coach.", "They convert the kinetic energy of coaches into rotational kinetic energy.", "They act as non-inertial gravity shields."], "answer": 1, "explanation": "When train coaches collide or couple, buffers compress, which significantly increases the time interval \\(\\Delta t\\) over which the shock force acts [307]. By prolonging the impact time, the average rate of change of momentum is kept low, thereby keeping the destructive impact forces on the coach bodies within safe structural limits."}, {"q": "An impulsive force acting on a body is represented on a graph of Force (along y-axis) versus Time (along x-axis). What does the total area under this curve represent?", "options": ["The instantaneous power delivered to the body.", "The total work done on the body.", "The total impulse imparted to the body, which equals its change in linear momentum.", "The constant acceleration of the body."], "answer": 2, "explanation": "Impulse is mathematically defined as \\(J = \\int F \\, dt\\). In graphical terms, the definite integral of a function represents the area under its curve. Therefore, the area under a Force-Time (\\(F-t\\)) graph represents the total impulse, which is equal to the body's momentum change [307]."}, {"q": "Why is a person jumping from a height of several feet likely to receive far more severe injuries if they land on a hard concrete floor compared to landing on a heap of sand?", "options": ["The concrete floor exerts a larger gravity force on their body.", "The sand is soft and yields, thereby increasing the duration of deceleration and reducing the peak average retarding force on their bones.", "The total change in momentum is much larger when landing on the concrete floor.", "Landing on sand completely conserves their mechanical kinetic energy."], "answer": 1, "explanation": "In both cases, the person's velocity changes from a high initial value to zero, meaning the total momentum change \\(\\Delta p\\) is identical. However, concrete is rigid, stopping the person almost instantaneously (small \\(\\Delta t\\)), resulting in a massive, bone-breaking retarding force [282]. The sand yields under their feet, prolonging the stop (large \\(\\Delta t\\)) and keeping the average impact force low and safe."}, {"q": "A ball of mass \\(0.2\\text{ kg}\\) is falling vertically at a speed of \\(10\\text{ m/s}\\). It hits a horizontal table and rebounds vertically upward at \\(8\\text{ m/s}\\). What is the impulse imparted to the ball by the table?", "options": ["0.4 N s (downward)", "3.6 N s (upward)", "1.8 N s (upward)", "3.6 N s (downward)"], "answer": 1, "explanation": "Take the vertically upward direction as positive. Initial velocity is downward: \\(v_i = -10\\text{ m/s}\\). Final velocity is upward: \\(v_f = +8\\text{ m/s}\\). Change in momentum is \\(\\Delta p = m(v_f - v_i) = 0.2 \\times (8 - (-10)) = 0.2 \\times 18 = 3.6\\text{ kg m/s}\\). Since \\(\\Delta p\\) is positive, the impulse is \\(3.6\\text{ N s}\\) directed vertically upward [287]."}]}, {"topicNum": "4", "topicName": "Third Law & Tension Dynamics", "questions": [{"q": "According to Newton's Third Law of Motion, every action is accompanied by an equal and opposite reaction. Which of the following is a vital property of these action-reaction pairs?", "options": ["The action force occurs slightly before the reaction force, creating a cause-and-effect relationship.", "Action and reaction forces must always act on the same body to maintain rotational equilibrium.", "Action and reaction forces act simultaneously on two different bodies, and therefore can never cancel each other out.", "The reaction force is always slightly smaller than the action force in non-conservative media."], "answer": 2, "explanation": "Action and reaction are simultaneous forces acting on two different bodies [308]. Because they act on different bodies, they do not combine to form a net force on a single body and thus never cancel each other out. There is no cause-effect delay; both forces occur at the exact same instant."}, {"q": "A heavy book of mass \\(m\\) is lying at rest on a horizontal table. The gravitational force pulls the book down with force \\(mg\\), and the table exerts an upward normal reaction force \\(N = mg\\). Do these two forces constitute a Newton's Third Law action-reaction pair?", "options": ["Yes, because they are equal in magnitude and opposite in direction.", "Yes, because the system is in perfect static translational equilibrium.", "No, because both forces act on the same body (the book); a true action-reaction pair must act on two different bodies.", "No, because the normal reaction is electromagnetic in origin while gravity is gravitational."], "answer": 2, "explanation": "This is a classic trap [304, 312]. The downward weight of the book (force on book by Earth) and the upward normal force (force on book by table) both act on the same body (the book). Therefore, they are not an action-reaction pair. The true reaction to the book's weight is the upward gravitational pull the book exerts on the Earth."}, {"q": "A man of mass \\(70\\text{ kg}\\) stands on a weighing scale inside a lift. If the lift accelerates vertically upward at a constant rate of \\(2\\text{ m/s}^2\\), what will be the reading on the scale? (Take \\(g = 10\\text{ m/s}^2\\))", "options": ["70 kg", "56 kg", "84 kg", "0 kg"], "answer": 2, "explanation": "The reading on the scale is the normal reaction \\(R\\). When a lift accelerates upward, the apparent weight is \\(R = m(g + a)\\) [320]. Here, \\(m = 70\\text{ kg}\\), \\(g = 10\\text{ m/s}^2\\), and \\(a = 2\\text{ m/s}^2\\). Thus, \\(R = 70 \\times (10 + 2) = 70 \\times 12 = 840\\text{ N}\\). In units of mass (kg-force), this is \\(84\\text{ kg}\\). The person feels heavier."}, {"q": "If the support cable of the lift in the previous question suddenly breaks, causing the lift to fall freely under gravity, what will be the reading shown on the weighing scale?", "options": ["70 kg", "140 kg", "0 kg (complete weightlessness)", "35 kg"], "answer": 2, "explanation": "In a state of free fall, the downward acceleration is \\(a = g\\) [321]. The normal reaction force becomes \\(R = m(g - a) = m(g - g) = 0\\). There is no contact force between the person's feet and the scale, resulting in a scale reading of 0 kg (weightlessness)."}, {"q": "Two blocks of masses \\(m_1 = 4\\text{ kg}\\) and \\(m_2 = 6\\text{ kg}\\) are connected by a light, inextensible string passing over a smooth, frictionless pulley. When released from rest, what is the acceleration of the masses? (Take \\(g = 10\\text{ m/s}^2\\))", "options": ["10 \\(\\text{m/s}^2\\)", "2 \\(\\text{m/s}^2\\)", "5 \\(\\text{m/s}^2\\)", "4 \\(\\text{m/s}^2\\)"], "answer": 1, "explanation": "For an Atwood machine pulley system, the acceleration of the blocks is given by the formula: \\(a = \\frac{m_2 - m_1}{m_1 + m_2} g\\) [322]. Substituting the given values: \\(a = \\frac{6 - 4}{4 + 6} \\times 10 = \\frac{2}{10} \\times 10 = 2\\text{ m/s}^2\\)."}, {"q": "For the pulley system in the previous question, what is the tension (\\(T\\)) in the string while the blocks are in motion?", "options": ["48 N", "50 N", "40 N", "60 N"], "answer": 0, "explanation": "The tension in the string for a simple vertical pulley system is given by: \\(T = \\frac{2 m_1 m_2}{m_1 + m_2} g\\) [322]. Substituting the values: \\(T = \\frac{2 \\times 4 \\times 6}{4 + 6} \\times 10 = \\frac{48}{10} \\times 10 = 48\\text{ N}\\). Alternatively, applying \\(T - m_1 g = m_1 a \\Rightarrow T = 4(10 + 2) = 48\\text{ N}\\)."}, {"q": "A pistol of mass \\(1.5\\text{ kg}\\) fires a bullet of mass \\(15\\text{ g}\\) horizontally with a muzzle velocity of \\(200\\text{ m/s}\\). What is the recoil velocity of the pistol?", "options": ["-2 m/s", "-1.5 m/s", "-0.2 m/s", "-3 m/s"], "answer": 0, "explanation": "Using conservation of linear momentum: \\(P_{initial} = 0 = P_{final}\\) [323]. Therefore, \\(M V_r + m v_b = 0 \\Rightarrow V_r = -\\frac{m v_b}{M}\\). Converting bullet mass to kg: \\(m = 15\\text{ g} = 0.015\\text{ kg}\\). Substituting: \\(V_r = -\\frac{0.015 \\times 200}{1.5} = -\\frac{3}{1.5} = -2\\text{ m/s}\\). The negative sign indicates backward recoil."}, {"q": "Why is it physically impossible for a person to walk or run on a completely frictionless surface?", "options": ["Because normal reaction cannot act on a frictionless surface.", "Because to walk, we must push the ground backward, and by Newton's Third Law, the ground pushes us forward with an equal horizontal friction force. On a frictionless surface, no backward force can be exerted, hence no forward reaction is generated.", "Because gravity disappears on frictionless sheets.", "Because the inertia of rest becomes infinite."], "answer": 1, "explanation": "Walking is a practical application of Newton's Third Law [313]. When we walk, our feet exert a backward horizontal force on the ground. The ground, in turn, exerts an equal and opposite forward reaction force on us via friction. If friction is zero, no backward force can be applied, meaning the forward reaction is also zero, making walking impossible."}, {"q": "A horse pulls a cart. The horse-and-cart paradox asks: If the horse pulls the cart forward with force \\(F\\), and the cart pulls the horse backward with the same force \\(-F\\), why does the system move at all?", "options": ["Because the horse pulls the cart slightly before the cart pulls the horse.", "Because the forward force of friction on the horse's hooves by the ground is larger than the backward pull of the cart, generating a net forward force on the combined horse-cart system.", "Because the horse is animate and can override the laws of physics.", "Because the cart's wheels eliminate the backward reaction force completely."], "answer": 1, "explanation": "The forces between the horse and the cart are internal to the combined system and cancel [438]. For the system to accelerate from rest, we must analyze external forces. The horse pushes the ground backward, and the ground pushes the horse forward with friction force \\(f_h\\). The cart experiences backward friction \\(f_c\\). If the forward force on the horse by the ground is larger than the backward friction on the cart (\\(f_h > f_c\\)), the system has a net forward external force and moves."}, {"q": "A balloon is inflated with air and released with its neck pointing downward. As air rushes out downward, the balloon shoots upward. What physical law explains this?", "options": ["Newton's first law of motion.", "Newton's second law of motion.", "Newton's third law of motion (action-reaction) and conservation of linear momentum.", "Aristotle's law of air cushions."], "answer": 2, "explanation": "As the air is forced out downward (action), the escaping air exerts an equal and opposite upward reaction force on the balloon (reaction) [90, 297]. This is the basic principle of jet and rocket propulsion, representing both Newton's Third Law and conservation of momentum."}]}, {"topicNum": "5", "topicName": "Conservation of Linear Momentum & Collision Mechanics", "questions": [{"q": "The law of conservation of linear momentum is a direct consequence of which of the following?", "options": ["Newton's first law of motion only", "Newton's second law of motion only", "Newton's second and third laws of motion combined", "The non-conservative nature of contact forces"], "answer": 2, "explanation": "According to Newton's third law, the mutual forces between two bodies are equal and opposite. Combining this with Newton's second law, the total rate of change of momentum of an isolated system is zero (F_ext = 0). Thus, total linear momentum is conserved [255, 274]."}, {"q": "When a gun fires a bullet, the gun recoils backward with a speed much less than the velocity of the bullet. This is because:", "options": ["The bullet has a much larger inertia than the gun.", "The gun is much more massive than the bullet.", "The force on the gun is less than the force on the bullet.", "The time of contact of the bullet inside the barrel is very small."], "answer": 1, "explanation": "By conservation of linear momentum, the total momentum after firing remains zero: m_b*v_b + m_g*v_g = 0. Therefore, the recoil speed of the gun is v_g = - (m_b/m_g) * v_b. Because the gun's mass m_g is much larger than the bullet's mass m_b, its recoil velocity is much smaller [255, 285]."}, {"q": "An isolated system is defined as a system on which:", "options": ["The net external force acting is zero.", "The internal forces are completely absent.", "Only conservative forces are allowed to act.", "No work of any kind can be performed."], "answer": 0, "explanation": "An isolated system is one where there is no net external force from the environment. Internal forces can be present and as large as possible, but because they occur in equal and opposite action-reaction pairs, they do not change the total momentum [255, 274]."}, {"q": "During any collision (whether elastic or inelastic), which of the following quantities is conserved at each and every instant of the process?", "options": ["Total kinetic energy of the system", "Total linear momentum of the system", "Both total kinetic energy and linear momentum", "Neither kinetic energy nor linear momentum"], "answer": 1, "explanation": "During a collision, the total linear momentum is conserved at each and every instant because the colliding bodies form an isolated system (no external forces). However, kinetic energy is not conserved at every instant because of temporary elastic/plastic deformations of the colliding bodies [326]."}, {"q": "A nucleus initially at rest in a laboratory frame disintegrates into two smaller nuclei. What must be the relative direction of motion of the two products?", "options": ["They must move in the same direction to conserve kinetic energy.", "They must move in perpendicular directions to minimize potential energy.", "They must move in exactly opposite directions.", "They can move in any arbitrary direction because mass is lost."], "answer": 2, "explanation": "Since the parent nucleus is initially at rest, its initial linear momentum is zero. By the momentum conservation principle, the total final momentum of the two fragments must also sum to zero: m1*v1 + m2*v2 = 0, which gives v1 = -(m2/m1)*v2. This requires them to move in exactly opposite directions [284, 361]."}, {"q": "In an elastic collision of two billiard balls of equal mass, if the target ball is initially at rest, what is the angle between their final velocity vectors after a non-head-on (oblique) collision?", "options": ["30 degrees", "45 degrees", "60 degrees", "90 degrees"], "answer": 3, "explanation": "For an elastic collision of two equal masses where one is initially at rest, the velocity vectors after collision are mutually perpendicular (theta1 + theta2 = 90 degrees), assuming the collision is not head-on [322]."}, {"q": "A rocket works on the principle of conservation of:", "options": ["Mass", "Energy", "Linear momentum", "Angular momentum"], "answer": 2, "explanation": "Rocket propulsion is based on Newton's laws of motion and the conservation of linear momentum. As the hot exhaust gases are ejected downward with high momentum, the rocket gains an equal and opposite upward momentum [18, 91]."}, {"q": "A bullet of mass 20 g is fired horizontally from a pistol of mass 2 kg with a muzzle speed of 150 m/s. What is the recoil velocity of the pistol?", "options": ["-1.5 m/s", "-3.0 m/s", "-1.2 m/s", "-0.75 m/s"], "answer": 0, "explanation": "Initial momentum = 0. Final momentum = m_b*v_b + m_g*v_g = 0. Given m_b = 20 g = 0.02 kg, v_b = 150 m/s, m_g = 2 kg. Hence, v_g = - (0.02 * 150) / 2 = -3 / 2 = -1.5 m/s. The negative sign represents the recoil direction [255, 285]."}, {"q": "A jet airplane traveling at a speed of 500 km/h ejects its products of combustion at a speed of 1500 km/h relative to the jet plane. What is the speed of these combustion products with respect to an observer standing on the ground?", "options": ["2000 km/h in the direction of the plane", "1000 km/h in the direction opposite to the plane", "1500 km/h in the direction of the plane", "1000 km/h in the direction of the plane"], "answer": 1, "explanation": "Let the direction of the plane's motion be positive. V_plane = +500 km/h. The combustion products are ejected backwards, so their velocity relative to the plane is V_exhaust/plane = -1500 km/h. By relative velocity formula, V_exhaust/ground = V_exhaust/plane + V_plane = -1500 + 500 = -1000 km/h. The magnitude is 1000 km/h opposite to the plane [170]."}, {"q": "Two bodies collide in an isolated system. If the collision is completely inelastic, which of the following is true?", "options": ["The bodies bounce off each other with their original speeds.", "The bodies stick together and move with a common velocity.", "The total momentum of the system becomes zero.", "The final kinetic energy is greater than the initial kinetic energy."], "answer": 1, "explanation": "In a completely inelastic collision, the maximum possible amount of kinetic energy is lost. The colliding bodies stick together after impact and move with a single common final velocity, while total momentum remains conserved [321, 326]."}, {"q": "If a system of particles has a net external force of zero, which of the following statements about its center of mass (CM) is correct?", "options": ["The velocity of the center of mass must change continuously.", "The center of mass must be at rest at all times.", "The center of mass moves with a constant velocity.", "The center of mass accelerates in the direction of internal forces."], "answer": 2, "explanation": "According to the relation V = P/M, if the net external force is zero, the total linear momentum P is constant. This implies that the velocity of the center of mass V is constant in both magnitude and direction [405]."}, {"q": "A bullet of mass 20 g is horizontally fired with a velocity of 100 m/s from a pistol of mass 1 kg. What is the recoil velocity of the pistol?", "options": ["-2.00 m/s", "2.00 m/s", "-4.00 m/s", "4.00 m/s"], "answer": 0, "explanation": "Using momentum conservation: m_b * v_b + m_g * v_g = 0. Here, m_b = 0.02 kg, v_b = 100 m/s, m_g = 1 kg. Substituting these values, v_g = - (0.02 * 100) / 1 = -2.00 m/s [255, 285]."}, {"q": "Two identical mass particles colliding elastically in 1D. Particle A moves with 20.0 m/s and hits Particle B which is at rest. After collision, what are their velocities?", "options": ["A comes to rest, B moves with 20.0 m/s", "Both move with 10.0 m/s", "A rebounds with -20.0 m/s, B remains at rest", "Both stop immediately"], "answer": 0, "explanation": "When two identical masses undergo a one-dimensional elastic collision, they completely exchange their velocities. Thus, the incoming particle A comes to rest, and target B moves off with A's initial velocity [321]."}, {"q": "If a system of particles has a net external force of zero, which of the following statements about its center of mass (CM) is correct?", "options": ["The velocity of the center of mass must change continuously.", "The center of mass must be at rest at all times.", "The center of mass moves with a constant velocity.", "The center of mass accelerates in the direction of internal forces."], "answer": 2, "explanation": "According to the relation V = P/M, if the net external force is zero, the total linear momentum P is constant. This implies that the velocity of the center of mass V is constant in both magnitude and direction [405]."}, {"q": "A bullet of mass 10 g is horizontally fired with a velocity of 400 m/s from a pistol of mass 1 kg. What is the recoil velocity of the pistol?", "options": ["-4.00 m/s", "4.00 m/s", "-8.00 m/s", "8.00 m/s"], "answer": 0, "explanation": "Using momentum conservation: m_b * v_b + m_g * v_g = 0. Here, m_b = 0.01 kg, v_b = 400 m/s, m_g = 1 kg. Substituting these values, v_g = - (0.01 * 400) / 1 = -4.00 m/s [255, 285]."}, {"q": "Two identical mass particles colliding elastically in 1D. Particle A moves with 10.0 m/s and hits Particle B which is at rest. After collision, what are their velocities?", "options": ["A comes to rest, B moves with 10.0 m/s", "Both move with 5.0 m/s", "A rebounds with -10.0 m/s, B remains at rest", "Both stop immediately"], "answer": 0, "explanation": "When two identical masses undergo a one-dimensional elastic collision, they completely exchange their velocities. Thus, the incoming particle A comes to rest, and target B moves off with A's initial velocity [321]." tions": ["-1.00 m/s", "1.00 m/s", "-2.00 m/s", "2.00 m/s"], "answer": 0, "explanation": "Using momentum conservation: m_b * v_b + m_g * v_g = 0. Here, m_b = 0.01 kg, v_b = 100 m/s, m_g = 1 kg. Substituting these values, v_g = - (0.01 * 100) / 1 = -1.00 m/s [255, 285]."}]}, {"topicNum": "6", "topicName": "Equilibrium & Concurrent Forces", "questions": [{"q": "Equilibrium of a particle in mechanics refers strictly to which of the following conditions?", "options": ["The particle must be completely at rest.", "The net external torque acting on the particle is zero.", "The vector sum of all external forces acting on the particle is zero.", "The particle must move with an increasing speed along a straight line."], "answer": 2, "explanation": "In particle mechanics, a particle is modeled as a point mass, meaning it does not rotate. Therefore, rotational equilibrium is trivial. Mechanical equilibrium of a particle requires only translational equilibrium: the net external force acting on it is zero (sum of F_ext = 0) [256, 258]."}, {"q": "Three concurrent, coplanar forces are in equilibrium. If they are represented as vectors, they can be arranged to form:", "options": ["A straight line parallel to the net force.", "A closed triangle with vector arrows taken in the same cyclic sense.", "A right-angled coordinate frame representing X, Y, and Z axes.", "An open polygon of four unequal sides."], "answer": 1, "explanation": "Under the action of three concurrent, coplanar forces F1, F2, and F3 in equilibrium, their vector sum is zero (F1 + F2 + F3 = 0). Geometrically, this means they can be represented in magnitude and direction by the sides of a closed triangle taken in a single cyclic order [256, 258]."}, {"q": "A mass of 6 kg is suspended by a rope of length 2 m from a rigid ceiling. A horizontal force of 50 N is applied at the midpoint P of the rope in equilibrium. What is the angle theta that the upper segment of the rope makes with the vertical? (Take g = 10 m/s^2)", "options": ["theta = tan^-1(5/6)", "theta = tan^-1(6/5)", "theta = sin^-1(5/6)", "theta = cos^-1(5/6)"], "answer": 0, "explanation": "Let T1 be the tension in the upper part of the rope and T2 be the tension in the lower part supporting the 6 kg mass. T2 = m*g = 60 N. At midpoint P, horizontal equilibrium requires T1*sin(theta) = 50 N, and vertical equilibrium requires T1*cos(theta) = T2 = 60 N. Dividing the two equations gives tan(theta) = 50/60 = 5/6, so theta = tan^-1(5/6) [257, 259, 260]."}, {"q": "Lami's Theorem is highly useful for solving concurrent force systems. It is mathematically stated as:", "options": ["A*cos(alpha) = B*cos(beta) = C*cos(gamma)", "A/sin(alpha) = B/sin(beta) = C/sin(gamma)", "A*tan(alpha) = B*tan(beta) = C*tan(gamma)", "A^2 + B^2 = C^2"], "answer": 1, "explanation": "Lami's Theorem states that if three coplanar, concurrent forces acting at a point are in equilibrium, each force is proportional to the sine of the angle between the other two forces: A/sin(alpha) = B/sin(beta) = C/sin(gamma) [195]."}, {"q": "A non-uniform bar of weight W is suspended at rest by two light strings. The strings make angles of 36.9 degrees and 53.1 degrees with the vertical. If the bar is 2 m long, what is the distance of the center of gravity of the bar from its left end?", "options": ["72 cm", "100 cm", "128 cm", "50 cm"], "answer": 0, "explanation": "For coplanar force equilibrium of a rigid body, we require both translational equilibrium and rotational equilibrium. Using vector angles and moment balances about the left end, the distance d works out to exactly 72 cm from the left end [411, 509]."}, {"q": "If a particle remains at rest under the action of three concurrent forces F1, F2, and F3, which of the following relations is mathematically correct?", "options": ["F1 + F2 = F3", "F1 - F2 = F3", "F1 + F2 + F3 = 0", "F1 * F2 = F3"], "answer": 2, "explanation": "Equilibrium under concurrent forces requires that the resultant vector sum of all forces is exactly zero (F1 + F2 + F3 = 0) [256, 258]."}, {"q": "When a body of mass 15 kg is suspended in equilibrium by two symmetric strings making equal angles of 30 degrees with the horizontal, what is the tension in each string? (g = 10 m/s^2)", "options": ["150 N", "75.0 N", "300 N", "86.61 N"], "answer": 0, "explanation": "Vertical equilibrium requires: 2 * T * sin(30 degrees) = m * g = 150 N. Since sin(30 degrees) = 0.5, this simplifies to 2 * T * 0.5 = T = 150 N. Each string carries a tension equal to the weight [258]."}, {"q": "A mass of 20 kg is suspended by a light rope. A horizontal force of 10 N pulls the mass sideways until it is in equilibrium. What is the value of tan(theta) of the rope with the vertical?", "options": ["0.0500", "20.0000", "0.1000", "0.0250"], "answer": 0, "explanation": "Using the equilibrium conditions: T*sin(theta) = F_horizontal = 10 N, and T*cos(theta) = m*g = 200 N. Dividing these gives tan(theta) = F_horizontal / (m*g) = 10 / 200 = 0.0500 [257, 259]."}, {"q": "When a body of mass 25 kg is suspended in equilibrium by two symmetric strings making equal angles of 30 degrees with the horizontal, what is the tension in each string? (g = 10 m/s^2)", "options": ["250 N", "125.0 N", "500 N", "144.34 N"], "answer": 0, "explanation": "Vertical equilibrium requires: 2 * T * sin(30 degrees) = m * g = 250 N. Since sin(30 degrees) = 0.5, this simplifies to 2 * T * 0.5 = T = 250 N. Each string carries a tension equal to the weight [258]."}, {"q": "A mass of 5 kg is suspended by a light rope. A horizontal force of 40 N pulls the mass sideways until it is in equilibrium. What is the value of tan(theta) of the rope with the vertical?", "options": ["0.8000", "1.2500", "1.6000", "0.4000"], "answer": 0, "explanation": "Using the equilibrium conditions: T*sin(theta) = F_horizontal = 40 N, and T*cos(theta) = m*g = 50 N. Dividing these gives tan(theta) = F_horizontal / (m*g) = 40 / 50 = 0.8000 [257, 259]."}, {"q": "When a body of mass 10 kg is suspended in equilibrium e smaller. Hence: Static > Kinetic > Rolling [1409]."}, {"q": "A block of mass 4 kg rests on a rough horizontal plane. The plane is gradually tilted until it makes an angle of exactly 15 degrees with the horizontal, at which point the block just begins to slide. What is the coefficient of static friction?", "options": ["0.15", "0.27", "0.50", "0.75"], "answer": 1, "explanation": "When an inclined plane is tilted, the angle of slide theta_max occurs when the downslope component of gravity matches the maximum static friction: m*g*sin(theta) = mu_s * m*g*cos(theta), which simplifies to mu_s = tan(theta_max). Given theta_max = 15 degrees, mu_s = tan(15 degrees) = 0.2679 ≈ 0.27 [264, 265]."}, {"q": "A student pushes a 5 kg block with a horizontal force of 10 N on a rough floor. If the coefficient of static friction is 0.4, what is the actual magnitude of the static friction force acting on the block? (Take g = 10 m/s^2)", "options": ["20 N", "10 N", "5 N", "0 N"], "answer": 1, "explanation": "The maximum possible static friction force is f_s_max = mu_s * N = mu_s * m * g = 0.4 * 5 * 10 = 20 N. Since the applied horizontal force is only 10 N (which is less than 20 N), the block does not move. Therefore, the actual static friction force self-adjusts to exactly match the applied force: f_s = 10 N [275]."}, {"q": "Why is it easier to pull a lawn mower than to push it across a rough field?", "options": ["Pulling increases the mass of the mower, reducing relative acceleration.", "Pulling increases the vertical downward component of force, reducing friction.", "Pulling has an upward vertical component that reduces the normal reaction and thus reduces friction.", "Pushing completely eliminates the normal reaction force."], "answer": 2, "explanation": "When pulling a lawn mower, the force is applied at an upward angle, which provides an upward vertical component. This vertical component reduces the normal reaction force N from the ground. Since friction is directly proportional to normal reaction (f = mu * N), pulling reduces the retarding friction, making it easier than pushing (where the downward force increases N and thus increases friction) [497, 498]."}, {"q": "A wooden box of mass 2 kg lies on the floor of a train. If the coefficient of static friction between the box and the floor is 0.2, what is the maximum horizontal acceleration of the train so that the box remains stationary?", "options": ["2.0 m/s^2", "1.0 m/s^2", "4.0 m/s^2", "0.2 m/s^2"], "answer": 0, "explanation": "The maximum horizontal accelerating force is provided by the maximum static friction: m * a_max = mu_s * N = mu_s * m * g. This simplifies to a_max = mu_s * g = 0.2 * 10 = 2.0 m/s^2 [264]."}, {"q": "A block of mass 4 kg is pulled along a rough horizontal plane with a constant speed. If the coefficient of kinetic friction is 0.15, what is the tension in the pulling horizontal string? (g = 10 m/s^2)", "options": ["6.00 N", "12.00 N", "40.00 N", "0 N"], "answer": 0, "explanation": "Since the speed is constant, the acceleration is zero and the net force is zero. Therefore, the pulling force (tension T) must exactly balance the kinetic friction: T = f_k = mu_k * N = mu_k * m * g = 0.15000000000000002 * 4 * 10 = 6.00 N [266, 274]."}, {"q": "A student wants to reduce the coefficient of friction between two sliding metal parts in a machine. Which of the following methods is the least effective?", "options": ["Applying a highly viscous grease between the surfaces.", "Polishing the metal surfaces to a highly reflective mirror finish.", "Using steel ball bearings between the rotating components.", "Creating a compressed air cushion between the surfaces."], "answer": 1, "explanation": "While slight polishing reduces surface roughness and decreases friction, extreme polishing actually increases friction because it brings the surfaces into so close contact that strong intermolecular adhesive forces (cold welding) develop [267]."}, {"q": "A wooden box of mass 8 kg lies on the fl ce (like tension in a string, friction on a road, or gravity on a planet) that points radially inward and provides the necessary centripetal acceleration to keep a body moving in a circular path [267, 275]."}, {"q": "What is the maximum safe speed for a car negotiating an unbanked, level turn of radius R on a road with a coefficient of static friction mu_s?", "options": ["v = sqrt(mu_s * R * g)", "v = mu_s * R * g", "v = sqrt(R * g / mu_s)", "v = mu_s^2 * R * g"], "answer": 0, "explanation": "For an unbanked, flat road, the centripetal force is provided entirely by static friction: m*v^2/R <= f_s_max = mu_s * m*g. Canceling mass m, we get the maximum safe speed as v_max = sqrt(mu_s * R * g) [268]."}, {"q": "A circular racetrack of radius 300 m is banked at an angle of 15 degrees. If the coefficient of friction is 0.2, what is the optimum speed of a race-car to completely avoid wear and tear on its tires?", "options": ["15.0 m/s", "28.1 m/s", "38.1 m/s", "10.0 m/s"], "answer": 1, "explanation": "At the optimum speed v_o on a banked road, the horizontal component of the normal reaction is alone sufficient to provide the centripetal force. No friction is needed, meaning zero tire wear. The formula is v_o = sqrt(R * g * tan(theta)). Substituting R = 300 m, g = 9.8 m/s^2, and theta = 15 degrees, we get v_o = sqrt(300 * 9.8 * 0.2679) = sqrt(787.6) ≈ 28.1 m/s [269, 270]."}, {"q": "An electron and a proton circulate with the same speed in circular paths of equal radius. If the mass of the proton is about 2000 times that of the electron, which of the following is true?", "options": ["The centripetal force required by the electron is 2000 times more than that of the proton.", "The centripetal force required by the proton is 2000 times more than that of the electron.", "No centripetal force is required for either particle.", "Both particles require identical centripetal forces because the radii are equal."], "answer": 1, "explanation": "Centripetal force is given by F = m * v^2 / R. Since both particles have the same speed v and rotate in paths of the same radius R, the required force is directly proportional to their masses (F ∝ m). Because the proton is 2000 times heavier than the electron, the centripetal force required by the proton is 2000 times greater [60, 61]."}, {"q": "For a simple pendulum executing small-amplitude oscillations, the tension in the supporting string is maximum at which point of its motion?", "options": ["At the extreme positions of the swing.", "At the mean (lowest) position of its swing.", "Uniformly constant at all points.", "At the midpoint between the mean and extreme positions."], "answer": 1, "explanation": "At the lowest (mean) position, the string must not only support the weight of the bob (m*g) but also provide the necessary centripetal force for its circular arc motion (m*v^2/L). Thus, T_max = m*g + m*v^2/L. At extreme positions, the velocity v is zero, and the tension is T = m*g*cos(theta), which is less than m*g [288, 499]."}, {"q": "A cyclist speeding at 9.3 m/s on a level road takes a sharp circular turn of radius 20 m. If the coefficient of static friction is 0.3, will the cyclist slip?", "options": ["Yes, because the speed exceeds the safe threshold of 7.75 m/s.", "No, because centripetal force does not depend on speed.", "No, because the friction is always self-adjusting.", "Yes, but only if the mass of the cyclist is doubled."], "answer": 0, "explanation": "The maximum safe speed on a level road is v_max = sqrt(mu_s * R * g) = sqrt(0.30000000000000004 * 20 * 10) = 7.75 m/s. Since the cyclist's speed is 9.3 m/s (which exceeds v_max), the cyclist will slip [269]."}, {"q": "A motorcyclist drives in vertical loops inside a spherical chamber ('death-well') of radius 30 m. What is the minimum speed required at the uppermost position to complete the loop without falling? (g = 10 m/s^2)", "options": ["17.32 m/s", "300.00 m/s", "600.00 m/s", "24.49 m/s"], "answer": 0, "explanation": "At the uppermost p
