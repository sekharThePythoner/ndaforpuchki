<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Physics MCQ — Puchki's Physics Vault ✅⚛️</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts: Fredoka & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cutesky: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 800: '#075985' },
                        ndagreen: { 400: '#86efac', 500: '#22c55e', 700: '#15803d', 800: '#166534' }
                    },
                    fontFamily: {
                        sans: ['"Quicksand"', 'sans-serif'],
                        cute: ['"Fredoka"', 'sans-serif'],
                    },
                    animation: { 'wiggle': 'wiggle 1s ease-in-out infinite' },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #bae6fd 100%);
            color: #075985;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cute-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2.5px solid var(--card-border, rgba(255, 255, 255, 0.85));
            box-shadow: 0 10px 25px var(--card-shadow, rgba(56, 189, 248, 0.15));
            border-radius: 1.5rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(6deg); }
        }
        .floating-emoji { animation: float 6s ease-in-out infinite; }

        .card-hover { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-hover:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 20px 35px var(--card-shadow-hover, rgba(56, 189, 248, 0.25));
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--card-border-hover, #7dd3fc);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f0f9ff; }
        ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-6 relative">

    <div class="absolute top-10 left-8 text-4xl opacity-40 floating-emoji pointer-events-none">☁️</div>
    <div class="absolute top-48 right-10 text-3xl opacity-40 floating-emoji pointer-events-none" style="animation-delay: 2s;">✅</div>
    <div class="absolute bottom-20 left-16 text-4xl opacity-40 floating-emoji pointer-events-none" style="animation-delay: 4s;">✨</div>
    <div class="absolute bottom-10 right-24 text-3xl opacity-40 floating-emoji pointer-events-none" style="animation-delay: 1.5s;">📘</div>

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-8 relative z-10">
        <a href="phymcq.html" class="cute-glass px-4 py-2 rounded-full text-sm font-bold text-cutesky-500 hover:bg-white transition shadow-sm flex items-center gap-2">
            <span>←</span> Back to MCQ
        </a>
        <div class="cute-glass px-4 py-1.5 rounded-full text-xs font-bold text-cutesky-500 shadow-sm flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-cutesky-400 animate-pulse"></span>
            developed by your chipkali 💗
        </div>
    </header>

    <main class="max-w-6xl mx-auto relative z-10 pb-16">
        <div class="text-center mb-10">
            <div class="w-20 h-20 mx-auto bg-white rounded-full flex items-center justify-center text-4xl shadow-md border-4 border-cutesky-100 mb-3 floating-emoji">
                1️⃣1️⃣
            </div>
            <h1 class="text-3xl md:text-4xl font-cute font-bold text-cutesky-800 mb-2">Class 11th Physics MCQ</h1>
            <p class="text-cutesky-500 font-bold text-sm md:text-base">Pick a chapter and start drilling, Puchki! ☁️✨</p>
        </div>

        <div class="cute-glass p-3 mb-6 flex items-center gap-3" style="--card-border: rgba(56,189,248,0.5); --card-shadow: rgba(56,189,248,0.18);">
            <span class="text-xl pl-2">🔍</span>
            <input
                id="chapterSearch"
                type="text"
                placeholder="Search chapters..."
                class="search-input w-full bg-transparent py-2 pr-3 text-cutesky-800 placeholder-cutesky-400 font-semibold rounded-xl"
                oninput="filterChapters()"
            />
        </div>

        <div id="chapterCount" class="text-sm font-bold text-cutesky-500 mb-4"></div>

        <div id="chaptersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

        <div id="noResults" class="hidden text-center py-12 cute-glass mt-4">
            <div class="text-4xl mb-2">🙈</div>
            <p class="font-bold text-cutesky-600">No chapters match that search, Puchki!</p>
        </div>
    </main>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <button id="musicToggleBtn" onclick="toggleMusic()" class="fixed bottom-6 left-6 cute-glass w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg z-[100] hover:scale-110 transition-transform">
        🔇
    </button>

    <script>
        /* ============ CHAPTER DATA (NDA Class 11 Physics syllabus) ============
           To add a new chapter: { num, name, file }
        */
        const chapters = [
            { num: 1,  name: "Units And Dimension",              file: "unitandmeasurements.html",         icon: "📏" },
            { num: 2,  name: "Motion In A Straight Line",         file: "motioninastraightline.html",       icon: "➡️" },
            { num: 3,  name: "Motion In Plane",                   file: "motioninplane.html",               icon: "📐" },
            { num: 4,  name: "Laws Of Motion",                    file: "lawsofmotion.html",                icon: "🍎" },
            { num: 5,  name: "Work, Power & Energy",              file: "workpowerenergy.html",             icon: "⚡" },
            { num: 6,  name: "Rotational Motion",                 file: "rotationalmotion.html",            icon: "🌀" },
            { num: 7,  name: "Gravitation",                       file: "gravitation.html",                 icon: "🌍" },
            { num: 8,  name: "Mechanical Properties Of Solids",   file: "mechanicalpropertiesofsolids.html", icon: "🧱" },
            { num: 9,  name: "Mechanical Properties Of Fluids",   file: "mechanicalpropertiesoffluids.html", icon: "💧" },
            { num: 10, name: "Thermal Properties Of Matter",      file: "thermalpropertiesofmatter.html",   icon: "🌡️" },
            { num: 11, name: "Thermodynamics",                    file: "thermodynamics.html",              icon: "🔥" },
            { num: 12, name: "Kinetic Theory Of Gases",           file: "kinetictheoryofgases.html",        icon: "💨" },
            { num: 13, name: "Simple Harmonic Motion",            file: "simpleharmonicmotion.html",        icon: "🎢" },
            { num: 14, name: "Wave Motion",                       file: "wavemotion.html",                  icon: "🌊" },
        ];

        const borderPalette = [
            { border: 'rgba(56,189,248,0.55)',  hover: 'rgba(56,189,248,0.9)',  shadow: 'rgba(56,189,248,0.2)',  shadowHover: 'rgba(56,189,248,0.4)' },
            { border: 'rgba(167,139,250,0.55)', hover: 'rgba(167,139,250,0.9)', shadow: 'rgba(167,139,250,0.2)', shadowHover: 'rgba(167,139,250,0.4)' },
            { border: 'rgba(244,114,182,0.55)', hover: 'rgba(244,114,182,0.9)', shadow: 'rgba(244,114,182,0.2)', shadowHover: 'rgba(244,114,182,0.4)' },
            { border: 'rgba(52,211,153,0.55)',  hover: 'rgba(52,211,153,0.9)',  shadow: 'rgba(52,211,153,0.2)',  shadowHover: 'rgba(52,211,153,0.4)' },
            { border: 'rgba(251,146,60,0.55)',  hover: 'rgba(251,146,60,0.9)',  shadow: 'rgba(251,146,60,0.2)',  shadowHover: 'rgba(251,146,60,0.4)' },
            { border: 'rgba(45,212,191,0.55)',  hover: 'rgba(45,212,191,0.9)',  shadow: 'rgba(45,212,191,0.2)',  shadowHover: 'rgba(45,212,191,0.4)' },
            { border: 'rgba(129,140,248,0.55)', hover: 'rgba(129,140,248,0.9)', shadow: 'rgba(129,140,248,0.2)', shadowHover: 'rgba(129,140,248,0.4)' },
            { border: 'rgba(251,191,36,0.55)',  hover: 'rgba(251,191,36,0.9)',  shadow: 'rgba(251,191,36,0.2)',  shadowHover: 'rgba(251,191,36,0.4)' },
            { border: 'rgba(251,113,133,0.55)', hover: 'rgba(251,113,133,0.9)', shadow: 'rgba(251,113,133,0.2)', shadowHover: 'rgba(251,113,133,0.4)' },
        ];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderChapters(list) {
            const grid = document.getElementById('chaptersGrid');
            const noResults = document.getElementById('noResults');
            const chapterCount = document.getElementById('chapterCount');

            chapterCount.textContent = `${list.length} chapter${list.length !== 1 ? 's' : ''}`;

            if (list.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            grid.innerHTML = list.map((ch, i) => {
                const c = borderPalette[i % borderPalette.length];
                return `
                <a href="${escapeHtml(ch.file)}"
                   class="cute-glass p-6 flex flex-col group card-hover cursor-pointer relative"
                   style="--card-border: ${c.border}; --card-shadow: ${c.shadow}; --card-border-hover: ${c.hover}; --card-shadow-hover: ${c.shadowHover};">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center text-2xl shadow-sm border-2 border-cutesky-100 group-hover:animate-wiggle">
                            ${ch.icon}
                        </div>
                        <span class="text-xs font-bold text-cutesky-400 bg-cutesky-50 px-2.5 py-1 rounded-full border border-cutesky-100">Ch ${ch.num}</span>
                    </div>
                    <h3 class="text-lg font-cute font-bold text-gray-800 leading-snug">${escapeHtml(ch.name)}</h3>
                </a>
            `;
            }).join('');
        }

        function filterChapters() {
            const q = document.getElementById('chapterSearch').value.trim().toLowerCase();
            const filtered = chapters.filter(ch => ch.name.toLowerCase().includes(q));
            renderChapters(filtered);
        }

        renderChapters(chapters);

        /* ============ MUSIC SYNC (same mechanism as other pages) ============ */
        document.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicToggleBtn');

            const savedTime = localStorage.getItem('puchki_music_time') || 0;
            const isPlaying = localStorage.getItem('puchki_music_playing') === 'true';

            audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.play().then(() => {
                    musicBtn.innerHTML = '🔊';
                }).catch(e => {
                    console.log("Autoplay blocked", e);
                    musicBtn.innerHTML = '🔇';
                    localStorage.setItem('puchki_music_playing', 'false');
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('puchki_music_time', audio.currentTime);
            });

            window.toggleMusic = function() {
                if (audio.paused) {
                    audio.play();
                    localStorage.setItem('puchki_music_playing', 'true');
                    musicBtn.innerHTML = '🔊';
                } else {
                    audio.pause();
                    localStorage.setItem('puchki_music_playing', 'false');
                    musicBtn.innerHTML = '🔇';
                }
            };
        });
    </script>
</body>
</html>
