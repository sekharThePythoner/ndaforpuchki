    <script id="quizData" type="application/json">[{"topicNum": "1", "topicName": "Introduction, Frames of Reference & Point Object Concept", "questions": [{"q": "Which of the following is the most fundamental requirement to specify the position of a moving body in space?", "options": ["A scalar clock and a mass balance.", "A rectangular Cartesian coordinate system consisting of three mutually perpendicular axes with a defined origin, along with a synchronized clock.", "A single reference point and a vector measuring tape without a timekeeping device.", "The mass of the body and its chemical composition."], "answer": 1, "explanation": "To describe the position of an object, we choose a rectangular coordinate system with three mutually perpendicular axes labeled X, Y, and Z. The intersection of these axes is the origin (O), which serves as the reference point. To measure time, we position a clock in this system. This coordinate system along with a clock constitutes a frame of reference [140]."}, {"q": "Under what condition can an extended, real-world physical body of finite size be mathematically treated as a 'point object' in classical mechanics?", "options": ["Only if the object has no mass and travels in a complete vacuum.", "If the size of the object is much smaller than the distance it covers in a reasonable duration of time.", "If the object is perfectly spherical and does not rotate.", "If the object moves with a velocity exactly equal to the speed of light."], "answer": 1, "explanation": "In classical mechanics, a real-world object of finite size can be approximated as a point mass (or point object) if the geometric dimensions of the body are completely negligible compared to the distances involved in its motion [181, 326]."}, {"q": "Consider the following physical systems: 1. A railway carriage moving without jerks between two distant stations. 2. A monkey sitting on top of a man cycling smoothly on a circular track. 3. A spinning cricket ball that turns sharply on hitting the ground. 4. A tumbling beaker that has slipped off the edge of a table. According to the NCERT guidelines, which of these can be treated as point objects?", "options": ["1 and 2 only", "3 and 4 only", "1, 2, and 4 only", "1, 2, 3, and 4"], "answer": 0, "explanation": "Based on NCERT Chapter 3 Exercise 3.1: (1) The carriage moves between two distant stations, so the distance is much larger than its size (point object). (2) The track is circular and large, so the monkey/cyclist is a point object. (3) The spinning ball turns sharply on impact; its rotational size and spin are crucial to the turn, so its size cannot be neglected. (4) The beaker falls off a table edge; the distance fallen is comparable to the beaker's size, so it is not a point object [181-182]."}, {"q": "Rest and motion are relative terms. If an observer on a moving train views a fellow passenger sitting next to him, and a second observer on the station platform views the same passenger, what are the observed states of the passenger?", "options": ["Both observers find the passenger in a state of absolute motion.", "Both observers find the passenger in a state of absolute rest.", "The train observer finds the passenger at rest, while the platform observer finds the passenger in motion.", "The train observer finds the passenger in motion, while the platform observer finds the passenger at rest."], "answer": 2, "explanation": "Motion is a change in position with respect to a frame of reference [139]. Relative to the train's frame of reference, the passenger's coordinates do not change (at rest). Relative to the platform's frame of reference, the coordinates of the passenger change with time (in motion) [173]."}, {"q": "A coordinate system along with a clock positioned inside it constitutes which of the following physical concepts?", "options": ["Inertial Mass", "Vector Space", "Frame of Reference", "Dimensional Matrix"], "answer": 2, "explanation": "The coordinate axes describe the spatial positions (x, y, z) of the object, and a clock measures time. Together, this coordinate system and the clock define the frame of reference used by an observer [140]."}, {"q": "If the motion of an object is restricted to a straight line (rectilinear motion), how many coordinate axes must be used to completely specify its position at any given instant?", "options": ["Zero", "Exactly one", "Exactly two", "Three"], "answer": 1, "explanation": "For motion along a straight line, we can choose our coordinate axis, say the X-axis, to coincide with the path of the object. Therefore, only one coordinate (e.g., x) is required to describe the position of the object as a function of time [141]."}, {"q": "Which of the following frames of reference is the most appropriate choice to describe the motion of a ball thrown vertically upwards by a passenger inside a train moving with constant velocity?", "options": ["The train frame of reference, because the coordinate axes move along with the passenger.", "The ground frame of reference, which is the only frame where gravity exists.", "An accelerating rocket frame of reference.", "The frame of reference of the sun."], "answer": 0, "explanation": "To analyze motion, any frame can be chosen, but choosing a coordinate system that moves with the train simplifies the description of the vertical throw, since the horizontal relative speed of the ball and passenger is zero [140, 173]."}, {"q": "When we state that 'the Earth is rotating on its axis and revolving around the Sun,' which of the following represents the correct choice of reference frame to study the motion of the Sun relative to the Earth?", "options": ["A frame of reference attached to the Sun.", "A frame of reference attached to the Earth.", "A frame of reference attached to the Milky Way's galactic center.", "An absolute static space frame which has no physical origin."], "answer": 1, "explanation": "To study the motion of any body 'relative to the Earth', we attach our coordinate origin to the Earth itself. From this frame of reference, the Sun appears to move across the sky, demonstrating that motion is completely dependent on the observer's frame [138, 140]."}, {"q": "Under what condition does an observer sitting in an airplane flying smoothly at 900 km/h in a straight line at constant altitude feel completely stationary?", "options": ["Because the air pressure outside is extremely low.", "Because, relative to the cabin's frame of reference, the observer's coordinate positions remain invariant over time.", "Because gravity becomes zero at high altitudes.", "Because the speed of sound is exceeded by the plane."], "answer": 1, "explanation": "Inside the cabin, the observer and all surrounding parts are moving at the same speed. In a coordinate frame fixed to the cabin, the passenger's position (x, y, z) is constant. Thus, relative to the airplane, the passenger is at rest [140, 173]."}, {"q": "Which of the following coordinate configurations represents a standard right-handed three-dimensional Cartesian frame?", "options": ["The X-axis points right, Y-axis points up, and the Z-axis is directed outward from the plane of the page.", "The X-axis points left, Y-axis points down, and the Z-axis is directed into the page.", "The X-axis points up, Y-axis points right, and the Z-axis is parallel to the X-axis.", "Any coordinate system where the axes are at 45 degrees to each other."], "answer": 0, "explanation": "In a right-handed Cartesian system, the cross product of the unit vectors is \\(\\hat{i} \\times \\hat{j} = \\hat{k}\\). If X points right (\\(\\hat{i}\\)) and Y points up (\\(\\hat{j}\\)), then the Z-axis (\\(\\hat{k}\\)) must point out of the page [210, 594]."}, {"q": "Why is the motion of a spinning cricket ball that turns sharply upon impact on the ground not considered as a point-object motion?", "options": ["Because the ball has a negligible mass compared to the Earth.", "Because the interaction of spin (rotation) and impact deformation depends directly on the physical size and rotational kinetics of the ball.", "Because the ball always travels in a parabola under gravity.", "Because the ball's velocity is completely non-uniform."], "answer": 1, "explanation": "When a spinning ball hits the ground, the friction and collision forces cause it to slip or grab, which depends directly on the radius and rotational inertia of the ball. Because the physical dimensions are crucial to explaining the physical phenomenon (the sharp turn), the point-object approximation fails [181-182, 326]."}, {"q": "A particle moves along a circular path of radius \\(R\\). Under which of the following circumstances can the particle's entire motion not be treated simply as one-dimensional?", "options": ["If the particle moves with constant speed.", "If the particle travels only a small arc of the circle.", "Because a circular path lies in a plane, requiring at least two independent coordinate variables (such as \\(x\\) and \\(y\\)) to describe its trajectory in Cartesian coordinates.", "Only if the circular track is placed inside an elevator."], "answer": 2, "explanation": "One-dimensional motion is restricted to a straight-line path. A circular path requires a two-dimensional frame of reference (a plane) to specify its positions using Cartesian coordinates (x, y) [204, 212]."}, {"q": "Which of the following is a classic example of three-dimensional motion?", "options": ["A car traveling along a straight, level highway.", "A stone dropped vertically downwards from a high bridge.", "A kite flying in a windy, turbulent sky or a gas molecule undergoing thermal collisions.", "A billiard ball rolling across a flat, friction-free table."], "answer": 2, "explanation": "A kite in a turbulent sky or a gas molecule moves in all three dimensions (length, width, height), requiring three independent coordinates (x, y, z) and a clock to completely describe its state of motion [140]."}, {"q": "A student sets up a coordinate origin at the ground level directly below a balcony. A ball is dropped from the balcony at height \\(h\\). What is the coordinate of the ball's landing point on the ground if the upward direction is chosen as positive?", "options": ["\\(+h\\)", "\\(0\\)", "\\(-h\\)", "Infinity"], "answer": 1, "explanation": "Since the coordinate origin (zero point) is chosen at the ground level, any object reaching the ground will have a vertical coordinate position of exactly 0, regardless of the sign convention chosen for positive directions [140, 166]."}, {"q": "A coordinate system is established such that the positive direction is directed towards the East. A vehicle is traveling West. What is the sign of the vehicle's position coordinates relative to an origin located far to the West of the vehicle's current position?", "options": ["Negative", "Positive", "Zero", "Alternating between positive and negative"], "answer": 1, "explanation": "Even though the vehicle is traveling West (meaning its velocity is negative), its current position lies to the East of the origin (which is far to the West). Since positions to the East of the origin are defined as positive, its position coordinate is positive [141]."}, {"q": "In studying the kinematics of a simple pendulum, the motion is usually assumed to occur in a single vertical plane. What is the minimum dimensionality of the frame of reference required to describe this plane?", "options": ["One-dimensional", "Two-dimensional", "Three-dimensional", "Zero-dimensional"], "answer": 1, "explanation": "A pendulum oscillating in a single vertical plane undergoes two-dimensional motion (requiring two independent coordinates, e.g., x and y) because its position has both vertical and horizontal components [204]."}, {"q": "Which of the following statements about the 'Origin' in a coordinate system is correct?", "options": ["The origin must always be a physically solid stationary object.", "The choice of the origin is completely arbitrary and is chosen for mathematical convenience.", "Once selected, the origin cannot be changed under any relative coordinate translations.", "The origin must always be placed at the starting point of the object's motion."], "answer": 1, "explanation": "The origin serves as a reference point. Its choice is completely arbitrary; we can set the origin at the starting point, the landing point, or any other convenient reference point [140]."}, {"q": "A passenger drops a stone from the window of a train moving with a uniform horizontal velocity \\(v\\). What is the path of the stone as observed by a person standing stationary on the ground?", "options": ["A straight vertical line downwards.", "A straight horizontal line forward.", "A parabolic path directed forward and downwards.", "A circular arc backward."], "answer": 2, "explanation": "To the ground observer, the stone has an initial horizontal velocity \\(v\\) (equal to the train's velocity) and accelerates vertically downwards under gravity (constant \\(g\\)). This horizontal projection in a uniform gravitational field results in a parabolic trajectory [224, 420]."}, {"q": "In the same scenario where a passenger drops a stone from a uniformly moving train, what is the path of the stone as observed by the passenger inside the train?", "options": ["A straight vertical line downwards.", "A parabolic path downwards.", "A straight horizontal line forward.", "A hyperbolic curve."], "answer": 0, "explanation": "Relative to the passenger (train's frame of reference), both the passenger and the stone share the same horizontal speed \\(v\\). Therefore, there is no horizontal relative motion. The stone is observed to fall in a straight vertical line downwards [420]."}, {"q": "Why does a passenger standing inside a bus get thrown forward when the moving bus suddenly applies its brakes?", "options": ["Due to the gravitational attraction of the windshield.", "Due to the inertia of motion, because the lower part of the body stops with the bus while the upper part tends to continue in its state of uniform motion.", "Due to an external force pushing the passenger from behind.", "Due to a centrifugal force acting on the passenger."], "answer": 1, "explanation": "This is a direct application of Galileo's law of inertia (Newton's First Law). When the bus stops, the feet of the passenger in contact with the floor stop, but the upper body continues in its state of uniform motion, throwing them forward [236, 424]."}, {"q": "Which of the following statements correctly highlights the difference between a 'point object' and an 'extended object' in kinematics?", "options": ["Point objects have zero mass, whereas extended objects have infinite mass.", "The motion of a point object involves only translation, whereas an extended object can undergo simultaneous translation, rotation, and vibration.", "Extended objects can only move in three dimensions.", "Point objects always move with uniform velocity."], "answer": 1, "explanation": "A point object represents a simplified model where only translational motion is studied. For extended bodies, the internal structures, rotations, and relative displacements of constituent particles must be considered [142, 326]."}, {"q": "An insect is crawling on the surface of a globe of radius \\(R\\). What is the minimum number of independent coordinates required to describe the position of the insect at any instant?", "options": ["One", "Two", "Three", "Four"], "answer": 1, "explanation": "Since the insect is restricted to a two-dimensional surface (the sphere's surface), its position is completely defined by two coordinates (e.g., latitude and longitude, or angular coordinates \\(\\theta\\) and \\(\\phi\\)), despite the sphere existing in three-dimensional space [204]."}, {"q": "Which of the following coordinates is chosen as the independent variable in almost all kinematics graphs (such as position-time and velocity-time graphs)?", "options": ["Position (\\(x\\))", "Velocity (\\(v\\))", "Time (\\(t\\))", "Acceleration (\\(a\\))"], "answer": 2, "explanation": "Kinematics describes motion over time. Since time flows independently and continuously, it is chosen as the independent variable and is plotted on the horizontal X-axis [145]."}, {"q": "A student measures the coordinates of a stationary car at \\(t = 2\\text{ s}\\) to be \\(x = +40\\text{ m}\\). At \\(t = 10\\text{ s}\\), the coordinate is still \\(x = +40\\text{ m}\\). What will the position-time graph of this car look like?", "options": ["A straight line inclined to the time axis.", "A parabola opening upwards.", "A straight line parallel to the time axis at height \\(40\\text{ m}\\).", "A vertical line parallel to the position axis."], "answer": 2, "explanation": "For a stationary object, the position coordinate remains constant over time. The graph is a straight line parallel to the time axis, representing zero velocity [145, 146]."}, {"q": "In the standard coordinate system for vertical motion near the Earth's surface, the upward direction is conventionally chosen as positive. What is the sign of the acceleration due to gravity (\\(g\\)) in this frame of reference?", "options": ["Positive during upward motion, negative during downward motion.", "Negative during upward motion, positive during downward motion.", "Always negative, because gravity is directed downwards towards the Earth's center.", "Zero at the highest point of flight."], "answer": 2, "explanation": "Since the upward direction is defined as positive, any vector pointing downwards must carry a negative sign. Because gravity always pulls objects downwards, the acceleration due to gravity is always negative (\\(a = -g = -9.8\\text{ m/s}^2\\)), regardless of whether the object is rising or falling [166, 169]."}, {"q": "When we analyze the 'streamline flow of water from a tap' or 'the smoke column of a cigarette rising and breaking up' [Q59 from CDS Physics], we are looking at fluid particles in motion. How are the frames of reference for studying fluid flow categorized in physics?", "options": ["Inertial and non-inertial frames only.", "Lagrangian (following a specific fluid particle) and Eulerian (observing a fixed point in space) frames of reference.", "Newtonian and relativistic frames of reference.", "Cartesian and polar systems only."], "answer": 1, "explanation": "In fluid mechanics, two approaches exist: the Lagrangian description (tracking individual fluid particles over time) and the Eulerian description (focusing on specific fixed coordinates in space and recording fluid velocity at those spots) [34, 140]."}, {"q": "If an observer is sitting inside a cabin of a giant Ferris wheel rotating smoothly at constant speed, what is the nature of the observer's frame of reference?", "options": ["It is a standard stationary inertial frame of reference.", "It is an accelerating, non-inertial frame of reference because the direction of velocity is continuously changing.", "It has zero acceleration because the speed is constant.", "It cannot be mathematically defined."], "answer": 1, "explanation": "Even though the speed is constant, the Ferris wheel travels in a circle, meaning there is a centripetal acceleration (\\(a_c = v^2/R\\)) pointing towards the center. This constant change in velocity direction makes it an accelerating (non-inertial) frame of reference [221, 266]."}, {"q": "In which of the following cases can a ship crossing an ocean not be considered approximately as a point object?", "options": ["When calculating the total travel time from India to New York.", "When analyzing the local fluid flow, wave-making resistance, and hull stresses on the ship's surface during a storm.", "When tracking the ship's coordinates on a global satellite map.", "When estimating fuel consumption based on average speed and distance."], "answer": 1, "explanation": "When analyzing fluid flow, hull stress, and wave interactions, the geometric size, shape, and distribution of mass of the ship are critical to the calar quantity and is always positive, unlike displacement which depends only on the endpoints and can be negative, positive, or zero [142, 180]."}, {"q": "What is the fundamental mathematical relationship between the magnitude of displacement (\\(|\\Delta x|\\)) and the total path length (\\(s\\)) between the same two points?", "options": ["\\(|\\Delta x| > s\\)", "\\(|\\Delta x| \\le s\\)", "\\(|\\Delta x| = s\\) always", "\\(|\\Delta x| \\ge s\\)"], "answer": 1, "explanation": "The displacement depends only on the initial and final endpoints, whereas the path length depends on the actual path traversed. Therefore, the magnitude of the displacement is always less than or equal to the path length. They are equal only if the object moves in a straight line without changing its direction [145, 180]."}, {"q": "A student is asked to jog along a circular track of radius \\(R = 35\\text{ m}\\). After completing exactly one full round, what are the magnitude of displacement and the total distance covered by the student respectively? [PYQ-Based]", "options": ["\\(220\\text{ m}\\) and \\(0\\)", "\\(0\\) and \\(220\\text{ m}\\)", "\\(0\\) and \\(110\\text{ m}\\)", "\\(110\\text{ m}\\) and \\(220\\text{ m}\\)"], "answer": 1, "explanation": "Since the student returns to the starting point, the final position coincides with the initial position, making the displacement zero. The total distance covered is the circumference of the track: \\(2\\pi R = 2 \\times \\frac{22}{7} \\times 35 = 220\\text{ m}\\). This matches the exact pattern of UPSC CDS Exam (II) Q82 [41, 145]."}, {"q": "An object starts from rest at the origin \\(x = 0\\), moves to point \\(P\\) at \\(x = +360\\text{ m}\\), and then moves back to point \\(Q\\) at \\(x = +240\\text{ m}\\). What are the net displacement and the total path length for this entire journey?", "options": ["\\(+240\\text{ m}\\) and \\(480\\text{ m}\\)", "\\(+360\\text{ m}\\) and \\(360\\text{ m}\\)", "\\(+120\\text{ m}\\) and \\(480\\text{ m}\ ion": "To find the position at any time, we substitute \\(t\\) directly into the position equation [140, 154]."}]}, {"topicNum": "3", "topicName": "Average Speed & Average Velocity", "questions": [{"q": "What is the physical definition of average velocity over a finite time interval \\(\\Delta t\\)?", "options": ["The total path length divided by \\(\\Delta t\\).", "The displacement of the body divided by the time interval \\(\\Delta t\\).", "The arithmetic mean of the initial and final instantaneous speeds.", "The product of acceleration and the time interval \\(\\Delta t\\)."], "answer": 1, "explanation": "Average velocity is a vector quantity defined as the change in position (displacement) divided by the time interval in which the displacement occurs: \\(\\bar{v} = \\frac{\\Delta x}{\\Delta t}\\) [147, 178]."}, {"q": "What represents the average velocity of an object on a position-time (\\(x-t\\)) graph over a specific time interval?", "options": ["The area under the \\(x-t\\) curve.", "The vertical height of the highest point on the curve.", "The slope of the straight line (chord) connecting the initial and final positions on the graph.", "The slope of the tangent at the mid-point of the time interval."], "answer": 2, "explanation": "On an \\(x-t\\) graph, the average velocity over a time interval is the slope of the straight line (chord) connecting the initial and final coordinates corresponding to that interval [151, 178]."}, {"q": "A bus travels from its origin to its destination at a distance of 300 km at a constant speed of 50 km/h, and returns along the same route to the origin at a constant speed of 60 km/h. What is the average speed of the bus for the entire round trip? [PYQ-Based]", "options": ["55 km/h", "54.55 km/h", "55.55 km/h", "54.0 km/h"], "answer": 1, "explanation": "Since the distance halves are equal, we use the harmonic mean formula for average speed: \\(v_{\\text{avg}} = \\frac{2 v_1 v_2}{v_1 + v_2} = \\frac{2 \\times 50 \\times 60}{50 + 60} = \\frac{6000}{110} \\approx 54.55\\text{ km/h}\\). This is a direct parallel of UPSC CDS GK Physics Q69 [37-38]."}, {"q": "In the same 300 km round-trip journey described in the previous question, what is the magnitude of the average velocity of the bus?", "options": ["54.55 km/h", "0", "55 km/h", "110 km/h"], "answer": 1, "explanation": "Since the bus returns to its origin, its net displacement is exactly zero. Since average velocity is defined as displacement divided by time (\\(\\bar{v} = \\Delta x / \\Delta t\\)), its average velocity is zero, highlighting the crucial difference between average speed and average velocity [145, 149]."}, {"q": "If an object travels the first half of its total journey time at a speed of \\(v_1\\) and the second half of its total journey time at a speed of \\(v_2\\), what is its average speed for the entire motion?", "options": ["\\(\\frac{2v_1 v_2}{v_1 + v_2}\\)", "\\(\\frac{v_1 + v_2}{2}\\)", "\\(\\sqrt{v_1 v_2}\\)", "\\(\\frac{v_1 + v_2}{v_1 v_2}\\)"], "answer": 1, "explanation": "Let the total time be \\(2t\\). The distance traveled in the first half is \\(s_1 = v_1 t\\), and in the second half is \\(s_2 = v_2 t\\). The total distance is \\(s_1 + s_2 = (v_1 + v_2)t\\). The average speed is \\(v_{\\text{avg}} = \\frac{\\text{Total Distance}}{\\text{Total Time}} = \\frac{(v_1 + v_2)t}{2t} = \\frac{v_1 + v_2}{2}\\) (the arithmetic mean) [147]."}, {"q": "A cyclist completes one round of a circular track of radius \\(R = 70\\text{ m}\\) in exactly \\(40\\text{ s}\\). Find the average velocity of the cyclist for this period.", "options": ["\\(11\\text{ m/s}\\)", "\\(5.5\\text{ m/s}\\)", "Zero", "\\(22\\text{ m/s}\\)"], "answer": 2, "explanation": "Because the cyclist completes a full round, the starting and ending positions are the same, resulting in zero net displacement. Hence, the average velocity (displacement/time) is exactly zero [41, 149]."}, {"q": "For the same cyclist in the previous question, what is the average speed of swer": 2, "explanation": "The total displacement is equal to the area under the \\(v-t\\) curve. For a triangle of base \\(b = 4\\) s and height \\(h = 30\\) m s^-1, the area is: \\(\\text{Area} = \\frac{1}{2} \\times \\text{base} \\times \\text{height} = \\frac{1}{2} \\times 4 \\times 30 = 60\\) m [157, 160]."}, {"q": "For a body moving along a straight line under constant negative acceleration, how do the position-time (\\(x-t\\)) and velocity-time (\\(v-t\\)) graphs appear respectively?", "options": ["A straight line sloping upwards, and a parabola opening upwards.", "A parabola curving downwards (concave down), and a straight line sloping downwards.", "A straight line parallel to the time axis, and a straight line sloping upwards.", "A parabola curving upwards, and a straight line parallel to the time axis."], "answer": 1, "explanation": "For constant acceleration, the position function is quadratic (\\(x(t) = v_0 t + \\frac{1}{2} a t^2\\)), which is represented by a parabola. Since the acceleration is negative, the parabola curves downward (concave down). The velocity is linear (\\(v(t) = v_0 + at\\)), which is represented by a straight line with a negative slope [155, 156, 158]. CLASS 11 PHYSICS — CHAPTER 2: MOTION IN A STRAIGHT LINE TOPIC 5: ACCELERATION & RETARDATION NCERT Class 11 Physics — Standalone"}]}, {"topicNum": "7", "topicName": "Kinematic Equations & Free Fall", "questions": [{"q": "A racing car starts from rest and accelerates with a uniform acceleration of 4.5 m/s² along a straight track. What is the distance covered by the car in the 6th second of its motion?", "options": ["27.0 m", "24.75 m", "22.5 m", "20.25 m"], "answer": 1, "explanation": "The displacement in the nth second is given by the kinematic relation: S_n = u + a/2 * (2n - 1). Here, initial velocity u = 0, acceleration a = 4.5 m/s², and n = 6. Substituting these values: S_6 = 0 + (4.5 / 2) * (2 * 6 - 1) = 2.25 * 11 = 24.75 m [166, 176]."}, {"q": "A motorcycle travelling with a velocity of 15 m/s is subjected to a uniform deceleration of 1.5 m/s² by applying brakes. What is the stopping distance of the motorcycle before it comes to rest?", "options": ["150 m", "100 m", "75 m", "50 m"], "answer": 2, "explanation": "Using the third equation of motion: v² = u² + 2as. Since the motorcycle comes to rest, final velocity v = 0. Initial velocity u = 15 m/s, and deceleration a = -1.5 m/s². Substituting: 0 = 15² + 2 * (-1.5) * s => 3s = 225 => s = 75 m [166]. PYQ Connection: Inspired by deceleration patterns in NDA 2025-I (Q130) and general stopping mechanics."}, {"q": "A bullet moving with a speed of 100 m/s penetrates a thick wooden plank and is brought to rest after traversing a distance of 4.0 cm. What is the average retarding force experienced by the bullet if its mass is 20 g?", "options": ["2500 N", "5000 N", "250 N", "1250 N"], "answer": 0, "explanation": "First, find the acceleration using v² = u² + 2as. Here, v = 0, u = 100 m/s, and s = 4.0 cm = 0.04 m. 0 = 100² + 2 * a * 0.04 => 0.08a = -10000 => a = -125,000 m/s². The retarding force is F = m * |a| = 0.02 kg * 125,000 m/s² = 2500 N [166]."}, {"q": "A train accelerating uniformly from a station covers a distance of 120 m in 6.0 seconds. If its velocity at the end of this 6-second interval is 25 m/s, what was its initial velocity when entering the measurement zone?", "options": ["5.0 m/s", "10.0 m/s", "15.0 m/s", "20.0 m/s"], "answer": 2, "explanation": "For uniformly accelerated motion, the average velocity is the arithmetic mean of initial and final velocities: v_avg = (u + v) / 2 [166]. We also know that distance s = v_avg * t. Therefore, s = [(u + v) / 2] * t => 120 = [(u + 25) / 2] * 6.0 => 120 = (u + 25) * 3 => 40 = u + 25 => u = 15 m/s."}, {"q": "A vehicle starts from rest and moves along a straight road with a constant acceleration. It covers a distance of 36 m in the first 3 seconds. What distance will it cover in the subsequent 3 seconds under the same acceleration?", "options": ["36 m", "72 m", "108 m", "144 m"], "answer": 2, "explanation": "Distance covered in first t seconds is s_1 = 0.5 * a * t². Here, 36 = 0.5 * a * 3² => 36 = 4.5a => a = 8 m/s². The total distance covered in the first 6 seconds (t = 3 + 3) is s_total = 0.5 * 8 * 6² = 4 * 36 = 144 m. Thus, the distance covered in the subsequent 3 seconds is s_subsequent = s_total - s_1 = 144 - 36 = 108 m [166]. Alternative approach: Since the body starts from rest, the displacements in equal successive intervals follow the ratio 1 : 3 : 5... (Galileo's law). Hence, interval 2 is 3 times interval 1: 3 * 36 = 108 m [169]."}, {"q": "An object starts from rest and moves with uniform acceleration. If it covers a distance S_1 in the first t seconds and a further distance S_2 in the next t seconds, what is the exact algebraic relationship between S_1 and S_2?", "options": ["S_2 = 2 S_1", "S_2 = 3 S_1", "S_2 = 4 S_1", "S_2 = 1.5 S_1"], "answer": 1, "explanation": "Using kinematic equations: S_1 = 0.5 * a * t². The distance covered in total time 2t is S_total = 0.5 * a * (2t)² = 4 * (0.5 * a * t²) = 4 S_1. Therefore, the distance covered in the second interval of duration t is S_2 = S_total - S_1 = 4 S_1 - S_1 = 3 S_1 [166, 169]."}, {"q": "A jet plane lands on an aircraft carrier with an initial speed of 72 m/s. It is hooked to a deceleration cable that stops the plane over a distance of 90 m. What is the magnitude of the uniform deceleration of the jet?", "options": ["14.4 m/s²", "28.8 m/s²", "43.2 m/s²", "57.6 m/s²"], "answer": 1, "explanation": "Using v² = u² + 2as. Here, v = 0 (rest), u = 72 m/s, and s = 90 m. 0 = 72² + 2 * a * 90 => 180a = -5184 => a = -28.8 m/s². The magnitude of deceleration is therefore 28.8 m/s² [166]."}, {"q": "An athlete accelerating at 2.0 m/s² from rest covers a straight sprint track. If the speed of the athlete at the finish line is 10 m/s, how long did the sprint last?", "options": ["2.5 s", "5.0 s", "10.0 s", "20.0 s"], "answer": 1, "explanation": "Using v = u + at. Since the athlete starts from rest, u = 0. Final velocity v = 10 m/s and acceleration a = 2.0 m/s². Substituting: 10 = 0 + 2 * t => t = 5.0 seconds [166]."}, {"q": "A car starts from rest and moves with constant acceleration 'a'. If the displacement of the car in the 1st, 2nd, and 3rd seconds are S_1, S_2, and S_3 respectively, what is the ratio S_1 : S_2 : S_3?", "options": ["1 : 2 : 3", "1 : 3 : 5", "1 : 4 : 9", "1 : 1.5 : 2"], "answer": 1, "explanation": "Using the formula for nth-second displacement: S_n = u + a/2 * (2n - 1) [166]. Since u = 0, we have S_n = (a/2) * (2n - 1). For n = 1, 2, 3: S_1 = a/2 * 1, S_2 = a/2 * 3, S_3 = a/2 * 5. The ratio S_1 : S_2 : S_3 is 1 : 3 : 5, which represents Galileo's law of odd numbers [169]."}, {"q": "A particle moving along a straight line path with constant acceleration covers a distance of 18 m in the 3rd second of its motion and 30 m in the 5th second. What is its initial velocity?", "options": ["3 m/s", "6 m/s", "9 m/s", "0 m/s"], "answer": 0, "explanation": "Using the formula S_n = u + (a/2) * (2n - 1). For n = 3: 18 = u + (a/2) * 5 => 2u + 5a = 36 (Eq. 1). For n = 5: 30 = u + (a/2) * 9 => 2u + 9a = 60 (Eq. 2). Subtracting Eq. 1 from Eq. 2: 4a = 24 => a = 6 m/s². Substituting 'a' back into Eq. 1: 2u + 5(6) = 36 => 2u = 6 => u = 3 m/s [166]."}, {"q": "A body starting from rest moves with a uniform acceleration of 2 m/s² for 5 seconds. It then continues to move with a constant velocity for the next 10 seconds. What is the total displacement of the body?", "options": ["25 m", "100 m", "125 m", "150 m"], "answer": 2, "explanation": "Phase 1: displacement s_1 = u*t + 0.5*a*t² = 0 + 0.5 * 2 * 5² = 25 m. Velocity at end of Phase 1: v = u + at = 0 + 2 * 5 = 10 m/s. Phase 2: uniform velocity, displacement s_2 = v * t_2 = 10 * 10 = 100 m. Total displacement: s = s_1 + s_2 = 25 + 100 = 125 m [166]."}, {"q": "A bullet penetrates a block of wood by 3 cm before its velocity is reduced to half of its initial value. Assuming uniform deceleration, how much further will it penetrate the block before coming to rest?", "options": ["1.0 cm", "2.0 cm", "1.5 cm", "3.0 cm"], "answer": 0, "explanation": "Let initial velocity be u. Case 1: final velocity v = u/2, displacement s = 3 cm. Using v² - u² = 2as: (u/2)² - u² = 2a(3) => -3/4 u² = 6a => a = -u² / 8. Case 2: from initial to final rest (v=0), total displacement s_total. 0 - u² = 2 * (-u²/8) * s_total => -u² = -u²/4 * s_total => s_total = 4 cm. Extra penetration = s_total - s_1 = 4 - 3 = 1 cm [166]."}, {"q": "For a particle moving along a straight line with constant acceleration, the displacement 's' is related to time 't' by the equation s = 3t² + 4t. What is the initial velocity and acceleration of the particle?", "options": ["u = 3 m/s, a = 4 m/s²", "u = 4 m/s, a = 6 m/s²", "u = 4 m/s, a = 3 m/s²", "u = 0 m/s, a = 6 m/s²"], "answer": 1, "explanation": "Comparing the given equation s = 4t + 3t² with the standard second kinematic equation s = ut + 0.5*a*t²: The coefficient of t is u, so u = 4 m/s. The coefficient of t² is 0.5*a, so 0.5*a = 3 => a = 6 m/s² [166]."}, {"q": "A car, initially moving with a speed of 30 m/s, slows down uniformly to a speed of 10 m/s over a distance of 80 m. What is the rate of constant deceleration of the car?", "options": ["2.5 m/s²", "5.0 m/s²", "7.5 m/s²", "10.0 m/s²"], "answer": 1, "explanation": "Using v² - u² = 2as. Here, v = 10 m/s, u = 30 m/s, and s = 80 m. 10² - 30² = 2 * a * 80 => 100 - 900 = 160a => -800 = 160a => a = -5 m/s². The deceleration magnitude is 5.0 m/s² [166]."}, {"q": "The displacement of a body in the 4th second of its uniformly accelerated motion starting from rest is 14 m. What is the uniform acceleration of the body?", "options": ["2 m/s²", "4 m/s²", "3 m/s²", "1 m/s²"], "answer": 1, "explanation": "Using S_n = u + a/2 * (2n - 1). Since the body starts from rest, u = 0. For n = 4, S_4 = 14 m. 14 = 0 + a/2 * (2 * 4 - 1) => 14 = 3.5a => a = 4 m/s² [166]."}, {"q": "An object starts from rest with a constant acceleration of 3.2 m/s². How much distance does it cover during the 5th second of its motion?", "options": ["14.4 m", "40.0 m", "28.8 m", "7.2 m"], "answer": 0, "explanation": "S_n = u + a/2 * (2n - 1). Here, u = 0, a = 3.2 m/s², and n = 5. S_5 = 0 + (3.2 / 2) * (2 * 5 - 1) = 1.6 * 9 = 14.4 m [166]."}, {"q": "A bullet is fired into a target. Its velocity is reduced by 20% after penetrating 6 cm into the target. How much deeper will it go before coming to rest, assuming uniform retardation?", "options": ["4.67 cm", "10.67 cm", "6.00 cm", "8.33 cm"], "answer": 1, "explanation": "Let initial velocity be u. After penetrating s_1 = 6 cm, velocity is reduced by 20%, so v = 0.8u. Using v² - u² = 2as: (0.8u)² - u² = 2a(6) => -0.36 u² = 12a => a = -0.03 u². Now, for the final rest state (v=0) starting from v_1 = 0.8u: 0 - (0.8u)² = 2 * (-0.03 u²) * s_remaining => -0.64 u² = -0.06 u² * s_remaining => s_remaining = 0.64 / 0.06 = 10.67 cm [166]."}, {"q": "Which of the following is a key limitation of the standard three kinematic equations of motion?", "options": ["They are only valid for 2D and 3D motion, not 1D.", "They are only applicable if the acceleration remains strictly constant in both magnitude and direction.", "They can only be used under zero gravitational influence.", "They do not hold for positive acceleration values."], "answer": 1, "explanation": "The standard kinematic equations of motion (v = u + at, s = ut + 0.5at², v² = u² + 2as) are derived assuming constant acceleration. If acceleration varies with time or position, these equations are invalid, and calculus must be used instead [177, 178]."}, {"q": "A proton enters a uniform electric field of length 2.0 cm with an initial speed of 1.0 * 10^5 m/s. It emerges from the field with a speed of 3.0 * 10^5 m/s. What is the constant acceleration of the proton inside the field?", "options": ["2.0 * 10^12 m/s²", "4.0 * 10^12 m/s²", "2.0 * 10^10 m/s²", "8.0 * 10^11 m/s²"], "answer": 0, "explanation": "Using v² - u² = 2as. Here, v = 3.0 * 10^5 m/s, u = 1.0 * 10^5 m/s, and s = 2.0 cm = 0.02 m. (3 * 10^5)² - (1 * 10^5)² = 2 * a * 0.02 => 9 * 10^10 - 1 * 10^10 = 0.04a => 8 * 10^10 = 0.04a => a = 2.0 * 10^12 m/s² [166]."}, {"q": "A block sliding down a frictionless inclined plane starting from rest covers a distance S_n in the nth second. What is the ratio S_4 / S_5?", "options": ["4 / 5", "7 / 9", "16 / 25", "9 / 11"], "answer": 1, "explanation": "Since u = 0, S_n is proportional to (2n - 1) [166]. For n = 4, 2n - 1 = 7. For n = 5, 2n - 1 = 9. Hence, the ratio S_4 / S_5 = 7 / 9."}, {"q": "The velocity of a particle moving along a straight line increases from 10 m/s to 20 m/s while covering a distance of 150 m. How much time does this process take?", "options": ["5.0 s", "10.0 s", "15.0 s", "7.5 s"], "answer": 1, "explanation": "The distance covered is s = [(u + v)/2] * t [166]. Here, s = 150 m, u = 10 m/s, v = 20 m/s. 150 = [(10 + 20)/2] * t => 150 = 15 * t => t = 10.0 seconds."}, {"q": "A vehicle starting from rest is accelerated at a constant rate of 1.5 m/s² until it reaches a speed of 12 m/s. What is the distance covered during this acceleration phase?", "options": ["96 m", "48 m", "24 m", "12 m"], "answer": 1, "explanation": "Using v² = u² + 2as. Since the vehicle starts from rest, u = 0. Final velocity v = 12 m/s and acceleration a = 1.5 m/s². 12² = 0 + 2 * 1.5 * s => 144 = 3s => s = 48 m [166]."}, {"q": "An object moving with uniform acceleration has velocity v_1 at a certain instant and v_2 after covering a distance S. What is its velocity at the exact midpoint of this path?", "options": ["(v_1 + v_2) / 2", "sqrt((v_1² + v_2²) / 2)", "sqrt(v_1 * v_2)", "(v_1² + v_2²) / 2"], "answer": 1, "explanation": "Let acceleration be 'a' and path length be S. Using v_2² - v_1² = 2aS. At the midpoint, displacement is S/2. Let the velocity there be v_mid. Then: v_mid² - v_1² = 2a(S/2) = aS = (v_2² - v_1²) / 2. Solving for v_mid²: v_mid² = v_1² + (v_2² - v_1²) / 2 = (v_1² + v_2²) / 2. Therefore, v_mid = sqrt((v_1² + v_2²) / 2) [166]."}, {"q": "A driver sees an obstacle 40 m away and immediately applies the brakes, decelerating the car at a constant rate of 5 m/s². If the driver's reaction time is 0.20 s and the car's initial speed is 15 m/s, what is the total stopping distance?", "options": ["25.5 m", "35.0 m", "45.0 m", "42.5 m"], "answer": 0, "explanation": "Total stopping distance = Reaction distance + Braking distance. Reaction distance = u * t_reaction = 15 m/s * 0.20 s = 3.0 m. Braking distance s_braking = u² / 2a = 15² / (2 * 5) = 225 / 10 = 22.5 m. Total stopping distance = 3.0 + 22.5 = 25.5 m [166]."}, {"q": "For a body starting from rest and moving with uniform acceleration, what is the ratio of the average velocity during the first t seconds to its final velocity at the end of t seconds?", "options": ["1 : 1", "1 : 2", "2 : 1", "1 : 3"], "answer": 1, "explanation": "Initial velocity u = 0. Final velocity at time t is v = at. Average velocity over the interval is v_avg = (u + v) / 2 = (0 + at) / 2 = at / 2. The ratio of average velocity to final velocity is: (at/2) / (at) = 1 / 2 = 1 : 2 [166]."}, {"q": "A ball is thrown vertically upwards with a velocity of 20 m/s from the top of a building. The height of the point from where the ball is thrown is 25 m from the ground. How high does the ball rise from its launch point? (Take g = 10 m/s²)", "options": ["10 m", "20 m", "40 m", "45 m"], "answer": 1, "explanation": "Using v² = u² + 2as. At the highest point, final velocity v = 0. Take upward direction as positive, so a = -g = -10 m/s². 0 = 20² + 2 * (-10) * h_max => 20h_max = 400 => h_max = 20 m from the point of launch [167]."}, {"q": "For the ball thrown in the previous question, how long does it take for the ball to reach the ground? (Take g = 10 m/s²)", "options": ["2.0 s", "4.0 s", "5.0 s", "6.0 s"], "answer": 2, "explanation": "Using y - y_0 = u*t + 0.5*a*t². Take the launch point as y_0 = 0. The ground is at y = -25 m. Initial velocity u = +20 m/s (upwards), and a = -g = -10 m/s². Substituting: -25 = 20t - 5t² => 5t² - 20t - 25 = 0 => t² - 4t - 5 = 0 => (t - 5)(t + 1) = 0. Since time cannot be negative, t = 5.0 seconds [167]."}, {"q": "A tennis ball is thrown vertically upwards and attains a maximum height of 20 m before returning to the launcher's hands. With what speed was the ball thrown? (Take g = 10 m/s²)", "options": ["10 m/s", "15 m/s", "20 m/s", "25 m/s"], "answer": 2, "explanation": "At the peak, v = 0. Using v² = u² - 2gh => 0 = u² - 2 * 10 * 20 => u² = 400 => u = 20 m/s. PYQ Connection: Directly matches the quantitative parameter of the tennis ball flight in UPSC NDA 2021-II (Q140) [1475]."}, {"q": "A stone is thrown vertically upwards with a speed of 29.4 m/s. What is the direction of its acceleration during its upward motion?", "options": ["Vertically upwards", "Vertically downwards", "Horizontally sideways", "Zero acceleration"], "answer": 1, "explanation": "The force of gravity always pulls massive bodies vertically downwards towards the Earth's center. Therefore, the acceleration due to gravity is always directed vertically downwards, regardless of whether the object is moving upwards, downwards, or is momentarily at rest [181]. PYQ Connection: Matches NCERT Exercise 3.10 and general gravity direction traps."}, {"q": "For the stone projected vertically upwards with a speed of 29.4 m/s in the previous question, what are the velocity and acceleration at its highest point?", "options": ["Velocity = 0 m/s, Acceleration = 0 m/s²", "Velocity = 29.4 m/s, Acceleration = 9.8 m/s² (downwards)", "Velocity = 0 m/s, Acceleration = 9.8 m/s² (downwards)", "Velocity = 0 m/s, Acceleration = 9.8 m/s² (upwards)"], "answer": 2, "explanation": "At the highest point of a vertically projected body, its speed is momentarily zero as it reverses direction. However, gravity does not switch off; the acceleration due to gravity remains constantly equal to g (9.8 m/s² downwards) [177, 181]."}, {"q": "A player throws a cricket ball vertically upwards with an initial speed of 29.4 m/s. Neglecting air resistance, what is the total time the ball takes to return to the player's hands? (Take g = 9.8 m/s²)", "options": ["3.0 s", "6.0 s", "4.5 s", "9.0 s"], "answer": 1, "explanation": "First, find the time of ascent (t_a) using v = u - g*t_a. At peak, v = 0 => 0 = 29.4 - 9.8 * t_a => t_a = 3.0 seconds. Due to symmetry of motion under constant gravity, time of descent equals time of ascent. Hence, total time of flight T = 2 * t_a = 6.0 seconds [181, 182]."}, {"q": "A boy standing in an open elevator (moving upwards with a constant velocity of 5 m/s) throws a ball vertically upwards with a speed of 49 m/s relative to himself. How much time does the ball take to return to his hands?", "options": ["10 s", "5 s", "15 s", "20 s"], "answer": 0, "explanation": "Let's analyze this from the frame of reference of the elevator. Since the elevator moves with constant velocity (5 m/s), it is an inertial frame. Within this frame, the ball is projected with an initial velocity of 49 m/s, and the constant downward acceleration is g = 9.8 m/s². The time to return to the hands is the time of flight T = 2u/g = 2 * 49 / 9.8 = 10 seconds [187]."}, {"q": "A toy rocket is projected vertically upwards from the ground. Its fuel provides a constant upward acceleration of 4.0 m/s² for 10 seconds, after which the fuel is completely exhausted. What is the maximum height attained by the rocket? (Take g = 10 m/s²)", "options": ["200 m", "280 m", "300 m", "400 m"], "answer": 1, "explanation": "Phase 1 (with fuel): u = 0, a = +4 m/s², t = 10 s. Height reached s_1 = 0.5 * 4 * 10² = 200 m. Velocity at the end of Phase 1: v_1 = 0 + 4 * 10 = 40 m/s. Phase 2 (coasting under gravity): initial velocity u_2 = 40 m/s, final velocity v_2 = 0, a = -10 m/s². Height reached s_2: 0 = 40² - 2 * 10 * s_2 => 20s_2 = 1600 => s_2 = 80 m. Maximum height = s_1 + s_2 = 200 + 80 = 280 m [166]."}, {"q": "A ball is projected vertically upwards with speed 'u'. If it covers a distance 'h' during the last second of its upward flight, what would be the value of 'h' if the initial projection speed 'u' is doubled?", "options": ["It remains unchanged because the distance covered in the last second of ascent is independent of 'u'.", "It is doubled.", "It is quadrupled.", "It is halved."], "answer": 0, "explanation": "By symmetry, the last second of upward motion is exactly identical in displacement to the first second of downward motion starting from rest at the highest point. The distance covered in the first second of descent from rest is always: h = 0.5 * g * (1)² = g/2 ≈ 4.9 m, which is completely independent of the launch speed 'u' [169]."}, {"q": "A particle is thrown vertically upwards with speed 'u'. The times at which it crosses a point at a height 'h' during its ascent and descent are t_1 and t_2 respectively. What is the sum of these times (t_1 + t_2)?", "options": ["u / g", "2u / g", "u² / g", "sqrt(2h / g)"], "answer": 1, "explanation": "Using the height equation: h = u*t - 0.5*g*t² => g*t² - 2u*t + 2h = 0. This is a quadratic equation in t. The sum of the roots is given by: t_1 + t_2 = -(-2u)/g = 2u/g, which is the total time of flight [166]."}, {"q": "A stone is thrown vertically upwards. It passes a point at a height of 14.7 m twice with a time interval of 4.0 seconds between the two passes. What was the initial projection speed of the stone? (Take g = 9.8 m/s²)", "options": ["19.6 m/s", "24.5 m/s", "25.9 m/s", "34.3 m/s"], "answer": 2, "explanation": "The time interval between the two passes at height h is delta_t = t_2 - t_1 = 4.0 s. From the highest point, the stone falls to the 14.7 m level in 2.0 s. The distance fallen from rest is y = 0.5 * g * t² = 0.5 * 9.8 * 2² = 19.6 m. So the peak height is h_max = 14.7 + 19.6 = 34.3 m. Now, using u = sqrt(2gh_max) = sqrt(2 * 9.8 * 34.3) = sqrt(672.28) = 25.9 m/s [166, 168]."}, {"q": "A ball is projected vertically upwards with a certain speed. If the air resistance is NOT neglected, how do the time of ascent (t_a) and the time of descent (t_d) compare?", "options": ["t_a = t_d", "t_a > t_d", "t_a < t_d", "They cannot be compared without knowing the mass of the ball."], "answer": 2, "explanation": "During ascent, both gravity and air resistance act downwards: a_up = -(g + F_air/m). During descent, gravity acts downwards while air resistance acts upwards: a_down = -(g - F_air/m). Since the average acceleration is larger in magnitude during ascent, the peak is reached quickly (smaller t_a). During descent, the acceleration is smaller, so it takes longer to fall back (larger t_d). Thus, t_a < t_d [166]."}, {"q": "An object thrown vertically upwards reaches 3/4 of its maximum height. What is the ratio of its kinetic energy at this point to its initial kinetic energy?", "options": ["1 : 4", "3 : 4", "1 : 2", "1 : 3"], "answer": 0, "explanation": "Total mechanical energy is conserved: E_total = K_initial = K_h + U_h. Since the height h = 3/4 h_max, the potential energy at this point is U_h = mgh = mg * (3/4 h_max) = 3/4 E_total. Therefore, the kinetic energy at this height is K_h = E_total - 3/4 E_total = 1/4 E_total. The ratio of kinetic energy to initial kinetic energy is 1 : 4 [262]."}, {"q": "A stone is thrown vertically upwards with velocity 'u'. It reaches a maximum height 'H'. At what height from the ground will its speed be u/2?", "options": ["H / 2", "3H / 4", "H / 4", "2H / 3"], "answer": 1, "explanation": "Using v² - u² = -2gh. At maximum height H, 0 - u² = -2gH => u² = 2gH. At height 'h' where speed is u/2: (u/2)² - u² = -2gh => -3/4 u² = -2gh => 3/4 (2gH) = 2gh => h = 3H / 4 [167]."}, {"q": "A ball is thrown up vertically with a speed of 20 m/s from the ground. What is the displacement and distance covered by the ball in the first 3 seconds? (Take g = 10 m/s²)", "options": ["Displacement = 15 m, Distance = 15 m", "Displacement = 15 m, Distance = 25 m", "Displacement = 25 m, Distance = 25 m", "Displacement = 5 m, Distance = 35 m"], "answer": 1, "explanation": "First, find the time to reach maximum height: v = u - gt => 0 = 20 - 10t => t_ascent = 2 s. Maximum height reached: H = u² / 2g = 20² / 20 = 20 m. In the remaining 1 second (from t = 2 to t = 3), the ball falls downwards from the peak: s_down = 0.5 * g * t² = 0.5 * 10 * 1² = 5 m. Therefore: (1) Displacement is the straight-line distance from starting point: 20 m (up) - 5 m (down) = 15 m. (2) Distance is the total path length: 20 m (up) + 5 m (down) = 25 m [157, 183]."}, {"q": "A body is projected vertically upwards with kinetic energy 'K'. What is its potential energy at half the maximum height if we choose potential energy at the launch ground to be zero?", "options": ["K / 4", "K / 2", "3K / 4", "K"], "answer": 1, "explanation": "At launch, the total energy is purely kinetic, E_total = K. At the maximum height H, the energy is purely potential, U_max = mgH = K. At half the maximum height (H/2), the potential energy is: U = mg(H/2) = 0.5 * mgH = K / 2 [262]."}, {"q": "A stone is thrown vertically upwards with speed 'u'. What is the average speed of the stone over its entire flight before returning to the ground?", "options": ["u / 2", "u", "2u", "Zero"], "answer": 0, "explanation": "Average speed is defined as total distance divided by total time of flight. Total distance = H_ascent + H_descent = 2 * (u² / 2g) = u²/g. Total time of flight = 2u/g. Average speed = (u²/g) / (2u/g) = u / 2 [183]."}, {"q": "A ball 'A' is projected vertically upwards with speed 'u', and another ball 'B' is projected vertically upwards with speed '2u'. What is the ratio of the maximum heights attained by A and B?", "options": ["1 : 2", "1 : 4", "1 : 8", "1 : 1"], "answer": 1, "explanation": "The maximum height is given by H = u² / 2g, meaning H is directly proportional to u². Therefore, the ratio of heights is: H_A / H_B = u² / (2u)² = u² / 4u² = 1 / 4 = 1 : 4 [167]."}, {"q": "Two bodies of masses 1 kg and 5 kg are dropped simultaneously from the same height. At any instant during their free fall, what physical quantity will be equal for both?", "options": ["Momentum", "Kinetic energy", "Potential energy", "Acceleration"], "answer": 3, "explanation": "In a vacuum, all bodies regardless of their masses experience the same acceleration due to gravity (g = 9.8 m/s²) [1391, 1449]. Since momentum (mv), potential energy (mgh), and kinetic energy (0.5mv²) depend on mass, they will differ for unequal masses. Only acceleration remains identical. PYQ Connection: Matches UPSC NDA 2025-I (Q132)."}, {"q": "A heavy stone and a light feather are dropped simultaneously from a high-rise building. If we consider air resistance, which one will hit the ground first?", "options": ["Both will hit at the same time.", "The feather will hit first because it is lighter and experiences less drag.", "The stone will hit first because it experiences a smaller deceleration due to air resistance relative to its weight.", "It depends on the wind direction."], "answer": 2, "explanation": "Air resistance force (drag) depends on the shape and speed of the body. For a lighter body like a feather, the drag force quickly becomes comparable to its small weight, leading to a low terminal velocity. For the heavy stone, the drag force is negligible compared to its large weight, so it continues to accelerate close to 'g' and hits the ground first [168, 183]."}, {"q": "A stone is dropped from rest from the top of a tower of height 'H'. What is the ratio of the times taken to cover the first half and the second half of the distance respectively?", "options": ["1 : 1", "1 : (sqrt(2) - 1)", "(sqrt(2) + 1) : 1", "1 : sqrt(2)"], "answer": 1, "explanation": "Let total height be H. Time to cover first half (H/2): H/2 = 0.5 * g * t_1² => t_1 = sqrt(H/g). Time to cover total height H: H = 0.5 * g * t_total² => t_total = sqrt(2H/g) = sqrt(2) * t_1. Time to cover the second half of the distance is: t_2 = t_total - t_1 = (sqrt(2) - 1) * t_1. Therefore, the ratio t_1 : t_2 is 1 : (sqrt(2) - 1) [168]."}, {"q": "A stone is dropped from a cliff. What is the ratio of the distances covered by the stone in the 1st, 2nd, and 3rd seconds of its free fall from rest? (Take g = 9.8 m/s²)", "options": ["1 : 2 : 3", "1 : 4 : 9", "1 : 3 : 5", "1 : sqrt(2) : sqrt(3)"], "answer": 2, "explanation": "According to Galileo's law of odd numbers, the distances traversed during equal intervals of time by a body falling from rest stand to one another in the same ratio as the odd numbers beginning with unity, namely 1 : 3 : 5 : 7... [169, 170]."}, {"q": "A tap drips water drops at steady intervals of 1.0 second from a height. When the 4th drop starts to fall, what is the distance between the 2nd and 3rd drops? (Take g = 10 m/s²)", "options": ["5 m", "10 m", "15 m", "20 m"], "answer": 2, "explanation": "When the 4th drop starts to fall, t = 0 for the 4th drop. The 3rd drop has been falling for 1.0 second: s_3 = 0.5 * 10 * 1² = 5 m. The 2nd drop has been falling for 2.0 seconds: s_2 = 0.5 * 10 * 2² = 20 m. The distance between the 2nd and 3rd drops is: delta_s = s_2 - s_3 = 20 - 5 = 15 m [168]."}, {"q": "A stone is dropped from a balloon rising vertically upwards with a constant velocity of 10 m/s. If the stone is dropped when the balloon is at a height of 120 m, how long does it take for the stone to hit the ground? (Take g = 10 m/s²)", "options": ["4 s", "6 s", "8 s", "12 s"], "answer": 1, "explanation": "When dropped, the stone inherits the velocity of the balloon due to inertia: u = +10 m/s (upwards). Height y = -120 m (since ground is 120 m below), and a = -g = -10 m/s². s = ut + 0.5at² => -120 = 10t - 5t² => 5t² - 10t - 120 = 0 => t² - 2t - 24 = 0 => (t - 6)(t + 4) = 0. Thus, t = 6.0 seconds [166]."}, {"q": "A body falls from rest under gravity. What is its velocity after falling through a distance of 19.6 m? (Take g = 9.8 m/s²)", "options": ["9.8 m/s", "19.6 m/s", "39.2 m/s", "14.0 m/s"], "answer": 1, "explanation": "Using v² = u² + 2gy. Since it starts from rest, u = 0. v² = 2 * 9.8 * 19.6 = 19.6 * 19.6. Therefore, v = 19.6 m/s [168]."}, {"q": "A ball is dropped from a high tower. If it covers 35 m during the last second of its journey before hitting the ground, what is the height of the tower? (Take g = 10 m/s²)", "options": ["45 m", "80 m", "125 m", "100 m"], "answer": 1, "explanation": "Let the total time of fall be 't' seconds. Distance covered in the nth (last) second is S_t = u + a/2 * (2t - 1). Here, u = 0 and a = g = 10 m/s². 35 = 0 + (10 / 2) * (2t - 1) => 35 = 5 * (2t - 1) => 7 = 2t - 1 => 2t = 8 => t = 4 seconds. Total height of the tower is: H = 0.5 * g * t² = 0.5 * 10 * 4² = 5 * 16 = 80 m [166, 168]."}, {"q": "A body is dropped from rest from the top of a tower. If it covers half of its total height in the last second of its fall, what is the total height of the tower? (Take g = 9.8 m/s²)", "options": ["57.1 m", "45.0 m", "38.2 m", "125.0 m"], "answer": 0, "explanation": "Let total time of fall be t. Total height H = 0.5 * g * t². Height covered in the first (t - 1) seconds is also H/2. Thus: H/2 = 0.5 * g * (t - 1)². Therefore: 0.5 * (0.5 * g * t²) = 0.5 * g * (t - 1)² => 0.5 t² = (t - 1)² => t = sqrt(2) / (sqrt(2) - 1) = 3.414 s. Height of the tower: H = 0.5 * 9.8 * (3.414)² = 57.1 m [168]."}, {"q": "A stone is dropped into a deep well, and the sound of the splash is heard 4.25 seconds later. If the depth of the well is 80 m, what is the speed of sound in air? (Take g = 10 m/s²)", "options": ["320 m/s", "340 m/s", "330 m/s", "350 m/s"], "answer": 0, "explanation": "Total time t_total = t_fall + t_sound. Time for the stone to fall 80 m: 80 = 0.5 * 10 * t_fall² => 5 t_fall² = 80 => t_fall = 4.0 seconds. Therefore, time taken for the sound of the splash to travel back to the top: t_sound = t_total - t_fall = 4.25 - 4.0 = 0.25 s. Speed of sound: v_sound = Depth / t_sound = 80 m / 0.25 s = 320 m/s [168]."}, {"q": "An object dropped from the top of a tower covers a distance of 45 m in its last second of fall. What is the total height of the tower? (Take g = 10 m/s²)", "options": ["125 m", "100 m", "180 m", "45 m"], "answer": 0, "explanation": "S_last = u + a/2 * (2t - 1). Here, u = 0, a = 10. 45 = 5 * (2t - 1) => 9 = 2t - 1 => 2t = 10 => t = 5 s. Height of the tower: H = 0.5 * 10 * 5² = 125 m [168]."}, {"q": "A stone is dropped from the edge of a cliff 100 m high. Simultaneously, another stone is projected vertically upwards from the base of the cliff with a speed of 50 m/s. How long after release do the two stones collide?", "options": ["1.0 s", "2.0 s", "4.0 s", "5.0 s"], "answer": 1, "explanation": "Let the time of collision be t. Position of stone 1 (dropped): y_1 = 100 - 0.5*g*t². Position of stone 2 (thrown up): y_2 = 0 + 50*t - 0.5*g*t². At collision: y_1 = y_2 => 100 - 0.5*g*t² = 50t - 0.5*g*t² => 50t = 100 => t = 2.0 seconds [166]."}, {"q": "For the two stones in the previous question, at what height from the base of the cliff does the collision occur? (Take g = 10 m/s²)", "options": ["80 m", "60 m", "40 m", "20 m"], "answer": 0, "explanation": "Using t = 2.0 s in y_2: y_2 = 50 * 2 - 0.5 * 10 * 2² = 100 - 20 = 80 m from the ground [166]."}, {"q": "A body is released from a great height. If it falls under constant gravity, what is the ratio of the velocities attained by the body at the end of the 1st, 2nd, and 3rd seconds of its fall?", "options": ["1 : 3 : 5", "1 : 2 : 3", "1 : 4 : 9", "1 : sqrt(2) : sqrt(3)"], "answer": 1, "explanation": "Using v = gt. Since g is constant, the velocity is directly proportional to time t. Therefore, the ratio of velocities at t = 1, 2, 3 s is 1 : 2 : 3 [168]."}, {"q": "A stone is dropped from a high-rise bridge. 1.0 second later, another stone is projected vertically downwards with a speed of 15 m/s. How long after the release of the first stone will the second stone catch up with it? (Take g = 10 m/s²)", "options": ["2.0 s", "3.0 s", "1.0 s", "4.0 s"], "answer": 0, "explanation": "Let t be the time of travel of the first stone. The second stone travels for (t - 1) seconds. Distance covered by first stone: s_1 = 0.5 * 10 * t² = 5t². Distance covered by second stone: s_2 = 15*(t - 1) + 0.5 * 10 * (t - 1)² = 5t² + 5t - 10. For catch-up: s_1 = s_2 => 5t² = 5t² + 5t - 10 => 5t = 10 => t = 2.0 seconds [166]."}, {"q": "An object falling from a high tower covers a distance 'h_1' in the first 2 seconds, and 'h_2' in the next 2 seconds. What is the value of h_2 in terms of h_1?", "options": ["h_2 = h_1", "h_2 = 2 h_1", "h_2 = 3 h_1", "h_2 = 4 h_1"], "answer": 2, "explanation": "Since the time intervals are equal (2 seconds each) and the object starts from rest, the displacements in successive intervals follow the ratio of odd numbers: h_1 : h_2 = 1 : 3. Therefore, h_2 = 3 h_1 [169]."}, {"q": "A steel sphere is dropped from a helicopter at rest. What is the displacement of the sphere between the 3rd and 4th seconds of its fall? (Take g = 10 m/s²)", "options": ["35 m", "25 m", "45 m", "15 m"], "answer": 0, "explanation": "Using S_n = u + a/2 * (2n - 1). Here, u = 0, a = g = 10, and n = 4. S_4 = 0 + (10 / 2) * (2 * 4 - 1) = 5 * 7 = 35 m [166]."}, {"q": "A car accelerates from rest at a constant rate of 2.0 m/s² for some time, and then decelerates at a constant rate of 4.0 m/s² to come to rest. If the total time of travel is 15 seconds, what is the maximum velocity attained by the car?", "options": ["10 m/s", "20 m/s", "30 m/s", "40 m/s"], "answer": 1, "explanation": "Let the acceleration phase last for t_1 seconds, so the deceleration phase lasts for (15 - t_1) seconds. Since final velocity at the peak is v_max: v_max = a_1 * t_1 = 2t_1. Also: v_max = 4 * (15 - t_1). Equating the two: 2t_1 = 60 - 4t_1 => 6t_1 = 60 => t_1 = 10 s. Thus, v_max = 2 * 10 = 20 m/s [166]."}, {"q": "For the car in the previous question, what is the total distance covered during the entire 15-second journey?", "options": ["100 m", "150 m", "200 m", "300 m"], "answer": 1, "explanation": "The total distance is the area under the v-t graph. Since the graph is a triangle with base T = 15 s and height v_max = 20 m/s: s = 0.5 * Base * Height = 0.5 * 15 * 20 = 150 m [164, 176]."}, {"q": "A motorcycle travelling at 20 m/s is brought to rest over a distance of 40 m by applying brakes. What is the constant deceleration rate of the motorcycle?", "options": ["5.0 m/s²", "10.0 m/s²", "2.5 m/s²", "7.5 m/s²"], "answer": 0, "explanation": "Using v² = u² - 2as => 0 = 20² - 2 * a * 40 => 80a = 400 => a = 5.0 m/s² [166]."}, {"q": "A point object starts from rest and moves with constant acceleration 'a'. If its velocity after covering distance 'x' is 'v', what will be its velocity after covering a total distance of '4x'?", "options": ["2v", "4v", "1.414v", "8v"], "answer": 0, "explanation": "Since u = 0, v² = 2ax, meaning v is directly proportional to sqrt(x). If the distance is quadrupled (4x), the velocity becomes: v' = sqrt(4) * v = 2v [166]."}, {"q": "An electron moving with an initial speed of 2.0 * 10^4 m/s is accelerated uniformly at a rate of 4.0 * 10^12 m/s² over a distance of 1.0 cm. What is the final speed of the electron?", "options": ["4.0 * 10^5 m/s", "2.0 * 10^5 m/s", "3.0 * 10^5 m/s", "3.0 * 10^4 m/s"], "answer": 2, "explanation": "Using v² = u² + 2as. Here, u = 2.0 * 10^4 m/s, a = 4.0 * 10^12 m/s², and s = 1.0 cm = 1.0 * 10^-2 m. v² = (2 * 10^4)² + 2 * (4 * 10^12) * (1 * 10^-2) = 4 * 10^8 + 8 * 10^10 = 8.04 * 10^10 ≈ 9 * 10^10. Therefore, v = sqrt(9 * 10^10) = 3.0 * 10^5 m/s [166]."}, {"q": "A driver applies brakes to a car moving at 15 m/s. If the car decelerates at a constant rate of 6.0 m/s², what is the stopping distance of the car?", "options": ["18.75 m", "37.5 m", "9.38 m", "12.5 m"], "answer": 0, "explanation": "v² = u² - 2as => 0 = 15² - 2 * 6 * s => 12s = 225 => s = 18.75 m [166]."}, {"q": "A high-speed train travelling at 40 m/s must be stopped within 200 m to avoid a collision. What is the minimum constant deceleration required?", "options": ["2.0 m/s²", "4.0 m/s²", "6.0 m/s²", "8.0 m/s²"], "answer": 1, "explanation": "v² = u² - 2as => 0 = 40² - 2 * a * 200 => 400a = 1600 => a = 4.0 m/s² [166]."}, {"q": "An object starts from rest and accelerates uniformly. If its displacement in the first 4.0 seconds is 32 m, what will be its displacement in the subsequent 4.0 seconds?", "options": ["32 m", "64 m", "96 m", "128 m"], "answer": 2, "explanation": "Since u = 0, the displacements in equal successive intervals follow the ratio 1 : 3. Since the first 4.0 seconds displacement is 32 m, the next 4.0 seconds displacement is: S_2 = 3 * S_1 = 3 * 32 = 96 m [169]."}, {"q": "A bullet hits a target and penetrates 8.0 cm before coming to rest. If its initial penetration speed is doubled while the retarding force remains constant, by how much will the penetration depth increase?", "options": ["It increases by 8.0 cm (doubles).", "It increases by 16.0 cm (triples).", "It increases by 24.0 cm (quadruples).", "It remains the same."], "answer": 2, "explanation": "The stopping distance is s = u² / 2a. Since the retarding force (and thus retardation 'a') is constant, s is directly proportional to u². If u is doubled, the new penetration depth becomes: s' = (2)² * s = 4 * 8.0 = 32.0 cm. The increase in depth is: delta_s = s' - s = 32.0 - 8.0 = 24.0 cm [166]."}, {"q": "A stone is dropped from a tower of height 45 m. At the same instant, another stone is thrown vertically downwards from the same height with an initial speed of 10 m/s. What is the difference in their velocities when they hit the ground? (Take g = 10 m/s²)", "options": ["10 m/s", "Less than 10 m/s because gravity acts equally on both.", "More than 10 m/s.", "They hit with the same velocity."], "answer": 1, "explanation": "Let's calculate both hitting velocities. Stone 1 (dropped): v_1² = 0 + 2 * 10 * 45 = 900 => v_1 = 30 m/s. Stone 2 (thrown down): v_2² = 10² + 2 * 10 * 45 = 100 + 900 = 1000 => v_2 = sqrt(1000) ≈ 31.62 m/s. The difference in their hitting velocities is: delta_v = 31.62 - 30.0 = 1.62 m/s [166, 168]."}]}, {"topicNum": "8", "topicName": "Relative Velocity in 1D", "questions": [{"q": "Train A moves north with a constant speed of 54 km/h and Train B moves south with a speed of 90 km/h. What is the velocity of Train B with respect to Train A?", "options": ["36 km/h (South)", "144 km/h (South)", "36 km/h (North)", "144 km/h (North)"], "answer": 1, "explanation": "Let North be the positive direction. Then v_A = +54 km/h = +15 m/s, and v_B = -90 km/h = -25 m/s. The velocity of B with respect to A is v_BA = v_B - v_A = -90 - 54 = -144 km/h (or 144 km/h south) [172]. PYQ Connection: Directly matches the setup of standard NCERT Example 3.9."}, {"q": "For the same two parallel tracks from the previous question, what is the velocity of the ground with respect to Train B?", "options": ["90 km/h (North)", "90 km/h (South)", "0 km/h", "54 km/h (North)"], "answer": 0, "explanation": "The velocity of the ground is v_G = 0. The velocity of B is v_B = -90 km/h (South). The velocity of the ground with respect to B is v_GB = v_G - v_B = 0 - (-90) = +90 km/h (North) [172]."}, {"q": "A monkey runs on the roof of Train A (moving North at 54 km/h) against its motion with a speed of 18 km/h with respect to Train", "options": ["What is the speed of the monkey as observed by a man standing on the ground? A. 72 km/h (North)", "36 km/h (North)", "36 km/h (South)", "18 km/h (South)"], "answer": 1, "explanation": "Let North be positive. v_A = +54 km/h = +15 m/s. The velocity of the monkey relative to Train A is v_MA = -18 km/h = -5 m/s. By relative velocity definition: v_MA = v_M - v_A => v_M = v_MA + v_A = -18 + 54 = +36 km/h (or 10 m/s North) [172]. PYQ Connection: Directly matches NCERT Example 3.9 part (c)."}, {"q": "A police van moving on a highway with a speed of 30 km/h fires a bullet at a thief's car speeding away in the same direction with a speed of 192 km/h. If the muzzle speed of the bullet is 150 m/s, with what speed does the bullet hit the thief's car?", "options": ["150 m/s", "120 m/s", "105 m/s", "135 m/s"], "answer": 2, "explanation": "First, convert all speeds to m/s: * Speed of police van v_P = 30 km/h = 30 * (5/18) = 8.33 m/s. * Speed of thief's car v_T = 192 km/h = 192 * (5/18) = 53.33 m/s. * Since the gun is fired from the moving police van, the absolute velocity of the bullet with respect to the ground is v_B = v_P + v_muzzle = 8.33 + 150 = 158.33 m/s. * The speed with which the bullet hits the thief's car is the relative speed: v_BT = v_B - v_T = 158.33 - 53.33 = 105.0 m/s [184]. PYQ Connection: Directly matches the famous NCERT Exercise 3.18."}, {"q": "On a long horizontally moving belt, a child runs to and fro with a speed of 9 km/h with respect to the belt between his parents who are standing 50 m apart. If the belt moves with a speed of 4 km/h, what is the speed of the child running in the direction of motion of the belt as observed by a stationary observer on the platform?", "options": ["9 km/h", "5 km/h", "13 km/h", "4 km/h"], "answer": 2, "explanation": "Velocity of child relative to belt is v_CB = +9 km/h. Velocity of belt relative to ground is v_B = +4 km/h. The velocity of the child relative to ground is v_CG = v_CB + v_B = 9 + 4 = 13 km/h [188, 189]. PYQ Connection: Matches standard NCERT Exercise 3.25 part (a)."}, {"q": "For the child in the previous question, what is his speed when running opposite to the direction of motion of the belt as observed by the stationary platform observer?", "options": ["5 km/h", "9 km/h", "13 km/h", "0 km/h"], "answer": 0, "explanation": "The velocity of the child relative to the belt is now v_CB = -9 km/h (opposite). The velocity of the belt is v_B = +4 km/h. The velocity of the child relative to the ground is v_CG = v_CB + v_B = -9 + 4 = -5 km/h. The speed is the magnitude, which is 5 km/h [188, 189]. PYQ Connection: Matches NCERT Exercise 3.25 part (b)."}, {"q": "For the child on the moving belt in the previous question, what is the time taken by the child to run from his father to his mother (50 m apart) as measured by either of the parents?", "options": ["13.8 s", "20.0 s", "38.5 s", "45.4 s"], "answer": 1, "explanation": "Since both parents are standing still on the moving belt, they are in the same frame of reference as the belt. Within this frame, the child moves with a speed of 9 km/h = 9 * (5/18) = 2.5 m/s. The distance between the parents is 50 m. The time taken is t = Distance / speed = 50 m / 2.5 m/s = 20 seconds. This time remains completely unaffected by the motion of the belt [188, 189]. PYQ Connection: Matches NCERT Exercise 3.25 part (c)."}, {"q": "Two towns A and B are connected by a regular bus service with a bus leaving in either direction every T minutes. A man cycling with a speed of 20 km/h from A to B notices that a bus goes past him every 18 min in the direction of his motion, and every 6 min in the opposite direction. What is the period T of the bus service?", "options": ["12 min", "9 min", "15 min", "18 min"], "answer": 1, "explanation": "Let the constant speed of the buses be V_b (in km/h) and the cyclist's speed be V_c = 20 km/h. The distance between successive buses is d = V_b * (T/60). * For buses going in the same direction: relative speed is (V_b - V_c). Time interval t_1 = 18 min => 18/60 = d / (V_b - V_c) = [V_b * (T/60)] / (V_b - 20) => 18 * (V_b - 20) = V_b * T (Eq. 1). * For buses in opposite direction: relative speed is (V_b + V_c). t_2 = 6 min => 6/60 = d / (V_b + V_c) => 6 * (V_b + 20) = V_b * T (Eq. 2). * Equating Eq. 1 and Eq. 2: 18 * (V_b - 20) = 6 * (V_b + 20) => 3V_b - 60 = V_b + 20 => 2V_b = 80 => V_b = 40 km/h. * Substituting V_b = 40 into Eq. 2: 6 * (40 + 20) = 40 * T => 360 = 40T => T = 9 minutes [181]. PYQ Connection: Directly matches the famous NCERT Exercise 3.9."}, {"q": "For the bus service problem analyzed in the previous question, with what constant speed do the buses ply on the road?", "options": ["30 km/h", "40 km/h", "50 km/h", "60 km/h"], "answer": 1, "explanation": "As derived in the solution of the previous question, the constant speed of the buses plying on the road is exactly 40 km/h [181]."}, {"q": "Two parallel rail tracks run North-South. Train A moves north with a speed of 15 m/s, and Train B moves south with a speed of 25 m/s. What is the relative velocity of Train A with respect to Train B?", "options": ["10 m/s (North)", "40 m/s (North)", "10 m/s (South)", "40 m/s (South)"], "answer": 1, "explanation": "Let North be the positive direction. v_A = +15 m/s, v_B = -25 m/s. The relative velocity of A with respect to B is: v_AB = v_A - v_B = +15 - (-25) = +40 m/s (directed North) [172]."}, {"q": "Two motorboats A and B are moving along a straight river path in the same direction. Boat A has a speed of 20 m/s and Boat B has a speed of 10 m/s relative to the riverbank. What is the relative speed of Boat A with respect to Boat B?", "options": ["10 m/s", "30 m/s", "20 m/s", "10 m/s"], "answer": 0, "explanation": "The relative speed of boat A with respect to boat B when moving in the same direction is the algebraic difference of their speeds: v_AB = v_A - v_B = 20 - 10 = 10 m/s [171]."}, {"q": "Two motorboats A and B are moving along a straight river path in the same direction. Boat A has a speed of 22 m/s and Boat B has a speed of 11 m/s relative to the riverbank. What is the relative speed of Boat A with respect to Boat B?", "options": ["11 m/s", "33 m/s", "22 m/s", "11 m/s"], "answer": 0, "explanation": "The relative speed of boat A with respect to boat B when moving in the same direction is the algebraic difference of their speeds: v_AB = v_A - v_B = 22 - 11 = 11 m/s [171]."}, {"q": "Two motorboats A and B are moving along a straight river path in the same direction. Boat A has a speed of 24 m/s and Boat B has a speed of 12 m/s relative to the riverbank. What is the relative speed of Boat A with respect to Boat B?", "options": ["12 m/s", "36 m/s", "24 m/s", "12 m/s"], "answer": 0, "explan
